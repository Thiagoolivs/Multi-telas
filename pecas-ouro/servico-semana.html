<!--
  Agenda da semana — família serviço. Destaque e lateral.
  Treinamentos, grupos, aulas: o "quando" de cada coisa da semana. Cada
  linha começa por uma folhinha de calendário (o dia da semana e o número),
  a única cor forte da peça; o resto é o que acontece e onde. Linha com o
  evento em branco some.
-->
<style>
.mt-peca { overflow-wrap: break-word; display: grid; grid-template-columns: 34fr 66fr; align-items: center; column-gap: 5cqw; padding: 8cqmin 7cqw;
  color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(100% 100% at 0% 0%, var(--mt-fundo-2), var(--mt-fundo) 60%); }
.kicker { display: flex; align-items: center; gap: 2cqmin; font: 700 max(var(--mt-piso, 0cqw), 3.6cqmin)/1.15 var(--mt-fonte-texto); letter-spacing: .08em; text-transform: uppercase; color: var(--mt-preco); }
.kicker i { display: block; flex: none; width: 6cqmin; height: .9cqmin; border-radius: 1cqmin; background: var(--mt-destaque); }
h1 { margin-top: 3cqmin; font: 600 max(var(--mt-piso, 0cqw), calc(13cqmin * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.01em; }
h1 span { display: block; }
h1 span + span { color: var(--mt-destaque); }
.nota { margin-top: 5cqmin; font: 500 max(var(--mt-piso, 0cqw), 4.4cqmin)/1.35 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3.4cqmin; }
.lista li { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 3.6cqmin; }
.lista li:has(.evento:empty) { display: none; }
/* A folhinha: a largura acompanha a letra (em), para o dia nunca sair dela. */
.folha { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 4.4em; padding: .5em .5em .6em; border-radius: var(--mt-raio);
  background: var(--mt-destaque); color: var(--mt-sobre-destaque); text-align: center; font-size: max(var(--mt-piso, 0cqw), 3.6cqmin); }
.dia { font: 700 1em/1.1 var(--mt-fonte-texto); letter-spacing: .08em; text-transform: uppercase; }
.data { font: 700 2.2em/1 var(--mt-fonte-titulo); }
.evento { display: block; font: 600 max(var(--mt-piso, 0cqw), 5.6cqmin)/1.15 var(--mt-fonte-texto); text-wrap: balance; }
.detalhe { display: block; margin-top: 1cqmin; font: 500 max(var(--mt-piso, 0cqw), 4.4cqmin)/1.25 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
/* A principal ao lado da lateral: a coluna da semana mais larga, o título menor. */
@container (aspect-ratio >= 1.25) and (aspect-ratio < 1.75) {
  .mt-peca { grid-template-columns: 28fr 72fr; column-gap: 4cqw; padding: 7cqmin 6cqw; }
  .kicker, .nota { display: none; }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(11cqmin * var(--mt-escala-titulo, 1))); }
  .lista { gap: 3cqmin; }
  .lista li:nth-child(4) { display: none; }
  /* A folhinha deitada: o dia e o número na mesma linha (a de pé, com a letra da TV, passava da altura). */
  .folha { flex-direction: row; align-items: baseline; gap: .3em; min-width: 0; padding: .3em .55em; font-size: max(var(--mt-piso, 0cqw), 3.2cqmin); }
  .data { font-size: 1.3em; }
  .evento { font-size: max(var(--mt-piso, 0cqw), 4.8cqmin); }
  .detalhe { margin-top: .4cqmin; font-size: max(var(--mt-piso, 0cqw), 3.8cqmin); }
}
/* Em pé: o título em cima, a semana embaixo. */
@container (aspect-ratio < 1.25) {
  .mt-peca { grid-template-columns: 1fr; align-content: center; row-gap: 7cqmin; padding: 8cqmin 8cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(11cqw * var(--mt-escala-titulo, 1))); }
  .nota { margin-top: 3cqmin; }
  .lista { gap: 3.6cqmin; }
}
@container (aspect-ratio < 0.8) and (min-width: 701px) {
  .mt-peca { row-gap: 10cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 4.4cqw); }
  h1 { margin-top: 3.4cqw; font-size: max(var(--mt-piso, 0cqw), calc(14cqw * var(--mt-escala-titulo, 1))); }
  .nota { margin-top: 4cqw; font-size: max(var(--mt-piso, 0cqw), 5cqw); }
  .lista { gap: 5.4cqw; }
  .lista li { column-gap: 5cqw; }
  .folha { font-size: max(var(--mt-piso, 0cqw), 4.6cqw); }
  .evento { font-size: max(var(--mt-piso, 0cqw), 6.8cqw); }
  .detalhe { margin-top: 1.4cqw; font-size: max(var(--mt-piso, 0cqw), 5.2cqw); }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { row-gap: 5cqmin; padding: 7cqmin 7cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(9cqmin * var(--mt-escala-titulo, 1))); }
  h1 span { display: inline; }
  .nota { display: none; }
  .lista { gap: 2.6cqmin; }
  .folha { flex-direction: row; align-items: baseline; gap: .3em; min-width: 0; padding: .3em .55em; font-size: max(var(--mt-piso, 0cqw), 3cqmin); }
  .data { font-size: 1.3em; }
  .evento { font-size: max(var(--mt-piso, 0cqw), 4.8cqmin); }
  .detalhe { margin-top: .4cqmin; font-size: max(var(--mt-piso, 0cqw), 3.8cqmin); }
}
/* A lateral: três linhas, sem a nota. */
@container (max-width: 700px) {
  .mt-peca { row-gap: 6cqmin; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 6cqw); letter-spacing: .06em; }
  .kicker i, .nota { display: none; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(12cqw * var(--mt-escala-titulo, 1))); }
  .lista li:nth-child(4) { display: none; }
  .folha { font-size: max(var(--mt-piso, 0cqw), 5cqw); }
  .evento { font-size: max(var(--mt-piso, 0cqw), 7cqw); }
  .detalhe { font-size: max(var(--mt-piso, 0cqw), 6.2cqw); }
}
/* Deitada e baixa: o título ao lado, três linhas, sem o detalhe. */
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { grid-template-columns: 30fr 70fr; padding: 6cqmin 6cqw; }
  .kicker, .nota, .detalhe { display: none; }
  .lista li:nth-child(4) { display: none; }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(13cqmin * var(--mt-escala-titulo, 1))); }
  .folha { flex-direction: row; align-items: baseline; gap: .3em; min-width: 0; padding: .3em .55em; font-size: max(var(--mt-piso, 0cqw), 4.4cqmin); }
  .data { font-size: 1.3em; }
  .evento { font-size: max(var(--mt-piso, 0cqw), 8cqmin); }
}
</style>
<section class="mt-peca servico-semana">
  <div class="cabeca">
    <p class="kicker" data-entrada="esquerda"><i aria-hidden="true"></i><span data-campo="kicker">Treinamentos</span></p>
    <h1 data-entrada="subir" data-ordem="1"><span data-campo="titulo">Agenda</span> <span data-campo="titulo2">da semana</span></h1>
    <p class="nota" data-campo="nota" data-entrada="aparecer" data-ordem="2">Inscrição com o seu líder até a véspera.</p>
  </div>
  <ul class="lista">
    <li data-entrada="subir" data-ordem="2"><span class="folha"><span class="dia" data-campo="dia1">Seg</span><span class="data" data-campo="data1">10</span></span><span><b class="evento" data-campo="evento1">Integração de novos</b><span class="detalhe" data-campo="detalhe1">9h · Sala de treinamento</span></span></li>
    <li data-entrada="subir" data-ordem="3"><span class="folha"><span class="dia" data-campo="dia2">Ter</span><span class="data" data-campo="data2">11</span></span><span><b class="evento" data-campo="evento2">NR-12: máquinas seguras</b><span class="detalhe" data-campo="detalhe2">14h · Galpão B</span></span></li>
    <li data-entrada="subir" data-ordem="4"><span class="folha"><span class="dia" data-campo="dia3">Qui</span><span class="data" data-campo="data3">13</span></span><span><b class="evento" data-campo="evento3">Brigada de incêndio</b><span class="detalhe" data-campo="detalhe3">8h · Pátio</span></span></li>
