<!--
  Nossa equipe — família gente. Destaque e lateral.
  Quem atende, com nome, área e registro (na saúde, o registro do
  conselho vai junto do nome, como pede a regra de publicidade). Três
  pessoas: o retrato é o círculo com as iniciais, que nunca expõe ninguém
  e nunca fica velho. Pessoa com o nome em branco some.
-->
<style>
.mt-peca { overflow-wrap: break-word; display: flex; flex-direction: column; justify-content: center; padding: 8cqmin 7cqw;
  color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(120% 90% at 50% 0%, var(--mt-fundo-2), var(--mt-fundo) 60%); }
.kicker { display: flex; align-items: center; gap: 2cqmin; font: 700 max(var(--mt-piso, 0cqw), 3.8cqmin)/1.15 var(--mt-fonte-texto); letter-spacing: .08em; text-transform: uppercase; color: var(--mt-preco); }
/* O fio do kicker fica na altura da primeira linha, mesmo quando o kicker quebra. */
.kicker { align-items: flex-start; }
.kicker i { display: block; flex: none; align-self: flex-start; width: 6cqmin; height: .9cqmin; margin-top: .52em; border-radius: 1cqmin; background: var(--mt-destaque); }
h1 { margin-top: 2.4cqmin; font: 700 max(var(--mt-piso, 0cqw), calc(12.6cqmin * var(--mt-escala-titulo, 1)))/1.02 var(--mt-fonte-titulo); letter-spacing: -.01em; }
.pessoas { list-style: none; margin: 7cqmin 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5cqw; }
.pessoas li { display: flex; flex-direction: column; align-items: flex-start; }
.pessoas li:has(.nome:empty) { display: none; }
.foto { display: flex; align-items: center; justify-content: center; width: 27cqmin; height: 27cqmin; border-radius: 50%; background: var(--mt-destaque);
  box-shadow: 0 0 0 1.2cqmin var(--mt-fundo), 0 0 0 1.8cqmin var(--mt-destaque); }
.foto span { font: 700 10cqmin/1 var(--mt-fonte-titulo); color: var(--mt-sobre-destaque); }
.nome { margin-top: 4.4cqmin; font: 700 max(var(--mt-piso, 0cqw), 6cqmin)/1.1 var(--mt-fonte-titulo); text-wrap: balance; }
.funcao { margin-top: 1.4cqmin; font: 600 max(var(--mt-piso, 0cqw), 4.4cqmin)/1.2 var(--mt-fonte-texto); color: var(--mt-preco); }
.registro { margin-top: 1cqmin; font: 500 max(var(--mt-piso, 0cqw), 3.8cqmin)/1.2 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
/* A principal ao lado da lateral: três colunas não cabem com a letra da TV — uma pessoa por linha, área e registro juntos. */
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 860px) {
  .mt-peca { padding: 6cqmin 6cqw; }
  .kicker { display: none; }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(9.4cqmin * var(--mt-escala-titulo, 1))); }
  .pessoas { grid-template-columns: 1fr; margin-top: 5cqmin; gap: 3.4cqmin; }
  .pessoas li { display: grid; grid-template-columns: auto auto 1fr; align-items: baseline; column-gap: 1.4cqw; }
  .foto { grid-row: 1 / span 2; align-self: center; width: 15cqmin; height: 15cqmin; margin-right: 2.6cqw; box-shadow: 0 0 0 .9cqmin var(--mt-fundo), 0 0 0 1.4cqmin var(--mt-destaque); }
  .foto span { font-size: max(var(--mt-piso, 0cqw), 6cqmin); }
  .nome { grid-column: 2 / -1; margin-top: 0; font-size: max(var(--mt-piso, 0cqw), 5.6cqmin); }
  .funcao { grid-column: 2; margin-top: 1cqmin; font-size: max(var(--mt-piso, 0cqw), 4cqmin); }
  .registro { grid-column: 3; margin-top: 0; font-size: max(var(--mt-piso, 0cqw), 3.6cqmin); }
  .registro::before { content: '· '; }
}
/* Em pé e quase quadrada: uma pessoa por linha, o retrato à esquerda. */
@container (aspect-ratio < 1.25) {
  .mt-peca { padding: 8cqmin 8cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(11cqw * var(--mt-escala-titulo, 1))); }
  .pessoas { grid-template-columns: 1fr; gap: 5cqmin; }
  .pessoas li { display: grid; grid-template-columns: auto 1fr; column-gap: 5cqw; align-items: center; }
  .foto { grid-row: 1 / span 3; width: 22cqw; height: 22cqw; }
  .foto span { font-size: 8cqw; }
  .nome { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), 6.4cqw); }
  .funcao { font-size: max(var(--mt-piso, 0cqw), 4.6cqw); }
  .registro { font-size: max(var(--mt-piso, 0cqw), 4cqw); }
}
@container (aspect-ratio < 0.8) and (min-width: 701px) {
  .kicker { font-size: max(var(--mt-piso, 0cqw), 4.6cqw); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(13cqw * var(--mt-escala-titulo, 1))); }
  .pessoas { margin-top: 11cqw; gap: 8cqw; }
  .foto { width: 26cqw; height: 26cqw; }
  .foto span { font-size: 9.4cqw; }
  .nome { font-size: max(var(--mt-piso, 0cqw), 7.2cqw); }
  .funcao { font-size: max(var(--mt-piso, 0cqw), 5.4cqw); }
  .registro { font-size: max(var(--mt-piso, 0cqw), 4.6cqw); }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { padding: 6cqmin 7cqw; }
  .kicker { display: none; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(9cqmin * var(--mt-escala-titulo, 1))); }
  .pessoas { margin-top: 4cqmin; gap: 3.4cqmin; }
  .foto { width: 18cqmin; height: 18cqmin; box-shadow: 0 0 0 .9cqmin var(--mt-fundo), 0 0 0 1.4cqmin var(--mt-destaque); }
  .foto span { font-size: 6.6cqmin; }
  .nome { font-size: max(var(--mt-piso, 0cqw), 5.2cqmin); }
  .funcao { margin-top: .8cqmin; font-size: max(var(--mt-piso, 0cqw), 4cqmin); }
  .registro { margin-top: .4cqmin; font-size: max(var(--mt-piso, 0cqw), 3.6cqmin); }
}
/* A lateral: o nome, a área e o registro, uma pessoa embaixo da outra. */
@container (max-width: 700px) {
  /* Com a letra do balcão a área ("Odontopediatria") não cabia ao lado do retrato: o retrato de iniciais sai,
     e um filete na cor de destaque marca cada pessoa; o texto ganha a largura toda. */
  .mt-peca { padding: 7cqmin 7cqw; }
  .foto, .kicker i { display: none; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 5.8cqw); letter-spacing: .04em; line-height: 1.1; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(11.4cqw * var(--mt-escala-titulo, 1))); }
  .pessoas { margin-top: 5cqw; gap: 4.4cqw; }
  .pessoas li { display: block; padding-left: 3.6cqw; border-left: 1.2cqw solid var(--mt-destaque); }
  .nome { display: block; font-size: max(var(--mt-piso, 0cqw), 7cqw); }
  .funcao { display: block; margin-top: .6cqw; font-size: max(var(--mt-piso, 0cqw), 6.2cqw); line-height: 1.12; }
  .registro { display: block; margin-top: .4cqw; font-size: max(var(--mt-piso, 0cqw), 6cqw); line-height: 1.12; }
}
/* Deitada e baixa: as três lado a lado, o retrato menor, sem o registro. */
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { padding: 5cqmin 6cqw; }
  .kicker, .registro { display: none; }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(10cqmin * var(--mt-escala-titulo, 1))); }
  .pessoas { margin-top: 4cqmin; gap: 3cqw; }
  .foto { width: 26cqmin; height: 26cqmin; }
  .foto span { font-size: 9.6cqmin; }
  .nome { margin-top: 3cqmin; font-size: max(var(--mt-piso, 0cqw), 8cqmin); }
}
</style>
<section class="mt-peca gente-equipe">
  <p class="kicker" data-entrada="esquerda"><i aria-hidden="true"></i><span data-campo="kicker">Quem cuida do seu sorriso</span></p>
  <h1 data-campo="titulo" data-entrada="subir" data-ordem="1">Nossa equipe</h1>
  <ul class="pessoas">
    <li data-entrada="subir" data-ordem="2"><span class="foto" aria-hidden="true"><span data-campo="iniciais1">PM</span></span><b class="nome" data-campo="nome1">Dra. Paula Mendes</b><span class="funcao" data-campo="funcao1">Ortodontia</span><span class="registro" data-campo="registro1">CRO-SP 85421</span></li>
    <li data-entrada="subir" data-ordem="3"><span class="foto" aria-hidden="true"><span data-campo="iniciais2">RA</span></span><b class="nome" data-campo="nome2">Dr. Rafael Alves</b><span class="funcao" data-campo="funcao2">Implantes</span><span class="registro" data-campo="registro2">CRO-SP 91307</span></li>
    <li data-entrada="subir" data-ordem="4"><span class="foto" aria-hidden="true"><span data-campo="iniciais3">LC</span></span><b class="nome" data-campo="nome3">Dra. Lia Campos</b><span class="funcao" data-campo="funcao3">Odontopediatria</span><span class="registro" data-campo="registro3">CRO-SP 77815</span></li>
  </ul>
</section>
