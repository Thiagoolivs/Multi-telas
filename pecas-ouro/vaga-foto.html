<!--
  Vaga aberta — família gente (lote 4, arquétipos A2 + A8).
  "Estamos contratando" como anúncio de revista: a foto de gente
  trabalhando numa metade; na outra, o título, duas vagas em linhas com
  filete e o QR para se candidatar. O QR fica sobre o fundo cheio.
-->
<style>
.mt-peca { --f: 2.6cqw; --t: 6cqw; --q: 12cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo); display: grid; grid-template-columns: 46fr 54fr; }
.foto { width: 100%; height: 100%; min-height: 0; object-fit: cover; object-position: 50% 45%; }
.texto { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 7cqh 6cqw 7cqh 5cqw; }
.kicker { font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.1 var(--mt-fonte-texto); text-wrap: balance; letter-spacing: .08em; text-transform: uppercase; color: var(--mt-destaque); }
h1 { margin-top: 2cqh; font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.01em; text-wrap: balance; }
.vagas { margin-top: 3.4cqh; list-style: none; padding: 0; border-top: .14cqw solid var(--mt-linha); }
.vagas li { padding: 1.6cqh 0; border-bottom: .14cqw solid var(--mt-linha); font: 500 max(var(--mt-piso, 0cqw), var(--f))/1.2 var(--mt-fonte-texto); }
.qr { margin-top: 4cqh; display: flex; align-items: center; gap: 2.4cqw; }
.qr img { flex: none; width: var(--q); height: var(--q); }
.qr p { min-width: 0; font: 500 max(var(--mt-piso, 0cqw), var(--f))/1.25 var(--mt-fonte-texto); color: var(--mt-texto-suave); text-wrap: balance; }

@container (aspect-ratio >= 1.25) and (max-height: 900px) {
  .mt-peca { --f: 3.5cqw; --t: 5.6cqw; --q: 15cqw; grid-template-columns: 44fr 56fr; }
  .texto { padding: 5cqh 5cqw 5cqh 4cqw; }
  .kicker { display: none; }
  h1 { margin-top: 0; }
  .vagas { margin-top: 2.4cqh; }
  .vagas li { padding: 1.2cqh 0; }
  .qr { margin-top: 3cqh; }
}
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { --f: 4.8cqw; --t: 5.4cqw; --q: 18cqw; }
  .vagas { display: none; }
}
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.6cqw; --t: 10cqw; --q: 26cqw; grid-template-columns: 1fr; grid-template-rows: 36fr 64fr; }
  .texto { justify-content: flex-start; padding: 5cqh 7cqw 6cqh; }
  .vagas { border-top-width: .24cqw; }
  .vagas li { padding: 2cqh 0; border-bottom-width: .24cqw; }
  .qr { gap: 4.4cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --t: 7.4cqw; --q: 20cqw; grid-template-rows: 32fr 68fr; }
  .texto { justify-content: center; padding: 4cqh 7cqw 5cqh; }
  .kicker { display: none; }
  h1 { margin-top: 0; }
  .vagas { margin-top: 2.4cqh; }
  .vagas li { padding: 1.3cqh 0; }
  .qr { margin-top: 3cqh; }
}
@container (max-width: 700px) {
  .mt-peca { --f: 9.6cqw; --t: 11cqw; --q: 36cqw; grid-template-rows: 21fr 79fr; }
  .texto { justify-content: center; padding: 3cqh 8cqw 4.4cqh; }
  .kicker, .vagas { display: none; }
  h1 { margin-top: 0; }
  .qr { flex-direction: column; align-items: flex-start; margin-top: 2.4cqh; gap: 2cqh; }
  .qr p { line-height: 1.15; }
}
/* A lateral com a margem contra o corte de 5% (452×674): a instrução descia até a borda de baixo. A foto fica mais baixa. */
@container (max-width: 700px) and (max-height: 680px) {
  .mt-peca { grid-template-rows: 18fr 82fr; }
}
</style>
<section class="mt-peca vaga-foto">
  <img class="foto" data-campo-img="foto" alt="" data-entrada="aproximar" data-continua="kenburns">
  <div class="texto">
    <p class="kicker" data-campo="kicker" data-entrada="revelar" data-ordem="2">Vem trabalhar com a gente</p>
    <h1 data-campo="titulo" data-entrada="revelar" data-ordem="3">Estamos contratando</h1>
    <ul class="vagas">
      <li data-campo="vaga1" data-entrada="subir" data-ordem="6">Atendente de balcão · manhã</li>
      <li data-campo="vaga2" data-entrada="subir" data-ordem="7">Confeiteiro(a) · tarde</li>
    </ul>
    <div class="qr" data-entrada="aparecer" data-ordem="9">
      <img data-campo-qr="link" alt="QR para se candidatar">
      <p data-campo="instrucao">Aponte a câmera e mande o seu currículo</p>
    </div>
  </div>
</section>
