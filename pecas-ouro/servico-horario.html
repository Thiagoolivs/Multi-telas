<!--
  Horário de funcionamento — família serviço. Nasceu para a lateral, serve
  no destaque. O "quando" da casa (PLANO §4.7). A hora é o que se lê de
  longe, então ela domina; o dia vai pequeno em cima. Dia deixado em branco
  some com a linha toda. Medidas em cqmin, como o prazo: uma peça para a
  coluna estreita e a tela deitada.
-->
<style>
.mt-peca { color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(110% 80% at 100% 0%, var(--mt-fundo-2), var(--mt-fundo) 64%); }
.cabeca { position: absolute; left: 9cqmin; right: 9cqmin; top: 10cqmin; }
.kicker { display: flex; align-items: center; gap: 2.4cqmin; font: 600 max(var(--mt-piso, 0cqw), 3.6cqmin)/1 var(--mt-fonte-texto); letter-spacing: .28em; text-transform: uppercase; color: var(--mt-destaque); }
.kicker i { display: block; width: 6cqmin; height: .5cqmin; background: var(--mt-destaque); }
h1 { font: 400 calc(11cqmin * var(--mt-escala-titulo, 1))/.95 var(--mt-fonte-titulo); text-transform: uppercase; margin-top: 4cqmin; }
h1 span { display: block; white-space: nowrap; }
h1 span + span { color: var(--mt-destaque); }
.dias { position: absolute; left: 9cqmin; right: 9cqmin; bottom: 22cqmin; list-style: none; margin: 0; padding: 0; }
.dias li { padding: 4cqmin 0 4.4cqmin; border-top: .5cqmin solid var(--mt-linha); }
.dias li:last-child { border-bottom: .5cqmin solid var(--mt-linha); }
.dias li:has(.dia:empty) { display: none; }
.dia { display: block; font: 600 max(var(--mt-piso, 0cqw), 3.4cqmin)/1 var(--mt-fonte-texto); letter-spacing: .24em; text-transform: uppercase; color: var(--mt-texto-suave); white-space: nowrap; }
.hora { display: block; margin-top: 2.4cqmin; font: 400 calc(12cqmin * var(--mt-escala-titulo, 1))/.9 var(--mt-fonte-titulo); letter-spacing: .01em; white-space: nowrap; }
.nota { position: absolute; left: 9cqmin; right: 9cqmin; bottom: 8cqmin; font: 500 max(var(--mt-piso, 0cqw), 3.8cqmin)/1.35 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
/*
 * Deitada: o título à esquerda; à direita, uma linha por dia — o dia em cima,
 * a hora embaixo. Com a letra mínima da TV, dia e hora lado a lado não cabem
 * na metade da tela (o "Domingo e feriado" sozinho passa de 600 px).
 */
@container (aspect-ratio >= 1.25) {
  .cabeca { left: 6cqw; right: auto; width: 40cqw; top: 50%; transform: translateY(-56%); }
  .kicker { gap: 2cqmin; font-size: max(var(--mt-piso, 0cqw), 3cqmin); letter-spacing: .08em; }
  .kicker i { width: 4.4cqmin; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(11cqmin * var(--mt-escala-titulo, 1))); }
  .dias { left: 50cqw; right: 6cqw; top: 50%; bottom: auto; transform: translateY(-50%); }
  .dias li { padding: 2.2cqmin 0 2.6cqmin; }
  .dia { font-size: max(var(--mt-piso, 0cqw), 3cqmin); letter-spacing: .12em; }
  /* Margem em em: a caixa da letra da hora passa da linha, e a folga acompanha o tamanho. */
  .hora { margin-top: .3em; line-height: 1; font-size: max(var(--mt-piso, 0cqw), calc(12cqmin * var(--mt-escala-titulo, 1))); }
  .nota { left: 6cqw; right: 52cqw; bottom: 7cqh; font-size: max(var(--mt-piso, 0cqw), 3cqmin); }
}
/*
 * Deitada, mas menos larga que a TV inteira (as principais com lateral, de
 * 1,46 a 1,65): a coluna dos dias começa antes e a hora fica menor.
 */
@container (aspect-ratio >= 1.25) and (aspect-ratio < 1.65) {
  .cabeca { width: 38cqw; }
  .dias { left: 47cqw; }
  .dia { font-size: max(var(--mt-piso, 0cqw), 2.8cqmin); letter-spacing: .08em; }
  .hora { font-size: max(var(--mt-piso, 0cqw), calc(10.4cqmin * var(--mt-escala-titulo, 1))); }
  .nota { right: 55cqw; }
}
/* Em pé numa tela inteira (não na coluna): tudo maior, a hora domina de longe. */
@container (aspect-ratio < 0.8) and (min-width: 701px) {
  .cabeca { top: 12cqmin; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 3.4cqmin); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(15cqmin * var(--mt-escala-titulo, 1))); margin-top: 5cqmin; }
  .dias { bottom: 24cqmin; }
  .dias li { padding: 4.6cqmin 0 5cqmin; }
  .dia { font-size: max(var(--mt-piso, 0cqw), 3.6cqmin); }
  .hora { font-size: max(var(--mt-piso, 0cqw), calc(17cqmin * var(--mt-escala-titulo, 1))); margin-top: 3cqmin; }
  .nota { bottom: 10cqmin; font-size: max(var(--mt-piso, 0cqw), 4cqmin); }
}
/*
 * Quase quadrada: a lista em pé não cabe embaixo do título — o dia e a hora
 * vão na mesma linha, a hora na ponta. O dia pode quebrar em duas linhas
 * ("Domingo e / feriado"); a hora nunca quebra.
 */
/*
 * A lateral (estreita): com a letra da TV, "Domingo e feriado" espaçado passava da margem. O dia quebra, sem o
 * espaçamento largo e em caixa baixa. Com a letra do balcão o título, os dias e a nota (presos no alto e no pé)
 * se encontravam: aqui eles vão um embaixo do outro, centrados, e o kicker sai (o horário já diz).
 */
@container (max-width: 700px) {
  .mt-peca { display: flex; flex-direction: column; justify-content: center; gap: 3.4cqw; padding: 5cqmin 8cqw; }
  .cabeca, .dias, .nota { position: static; }
  .kicker { display: none; }
  h1 { margin-top: 0; }
  .dias li { padding: 1.8cqw 0 2cqw; }
  .dia { white-space: normal; letter-spacing: .02em; text-transform: none; line-height: 1.08; }
  .hora { margin-top: .2em; line-height: .95; font-size: max(var(--mt-piso, 0cqw), calc(15cqw * var(--mt-escala-titulo, 1))); }
  .nota { line-height: 1.2; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .cabeca { left: 7cqmin; right: 7cqmin; top: 8cqmin; }
  .kicker { letter-spacing: .12em; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(9cqmin * var(--mt-escala-titulo, 1))); }
  .dias { left: 7cqmin; right: 7cqmin; bottom: 16cqmin; }
  .dias li { display: flex; align-items: center; justify-content: space-between; gap: 4cqw; padding: 3cqmin 0 3.4cqmin; }
  .dia { flex: 1 1 auto; min-width: 0; white-space: normal; line-height: 1.1; font-size: max(var(--mt-piso, 0cqw), 3cqmin); letter-spacing: .12em; }
  .hora { flex: none; margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(8.5cqmin * var(--mt-escala-titulo, 1))); }
  .nota { left: 7cqmin; right: 7cqmin; bottom: 6.5cqmin; font-size: max(var(--mt-piso, 0cqw), 3.2cqmin); }
}
</style>
<section class="mt-peca servico-horario">
  <div class="cabeca">
    <p class="kicker" data-entrada="aparecer" data-ordem="1"><i aria-hidden="true"></i><span data-campo="kicker">Funcionamento</span></p>
    <h1 data-entrada="subir" data-ordem="2"><span data-campo="titulo">Pão quente</span><span data-campo="titulo2">o dia todo</span></h1>
  </div>
  <ul class="dias">
    <li data-entrada="subir" data-ordem="3"><span class="dia" data-campo="dia1">Segunda a sexta</span><span class="hora" data-campo="hora1">6h – 20h</span></li>
    <li data-entrada="subir" data-ordem="4"><span class="dia" data-campo="dia2">Sábado</span><span class="hora" data-campo="hora2">6h – 19h</span></li>
    <li data-entrada="subir" data-ordem="5"><span class="dia" data-campo="dia3">Domingo e feriado</span><span class="hora" data-campo="hora3">7h – 13h</span></li>
  </ul>
  <p class="nota" data-campo="nota" data-entrada="aparecer" data-ordem="6">Fornadas às 6h, 11h e 16h</p>
</section>
