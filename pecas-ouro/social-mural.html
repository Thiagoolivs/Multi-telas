<!--
  Foto do cliente (ou do mural) — família social. Destaque.
  A foto de quem comprou, num cartão de revelação inclinado, com a legenda
  embaixo — é gente de verdade, não modelo de banco de imagem. Do lado, o
  convite para mandar a sua. O QR é opcional: link em branco, ele some.
-->
<style>
.mt-peca { color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(90% 110% at 25% 50%, var(--mt-fundo-2), var(--mt-fundo) 62%); }
.cartao { position: absolute; left: 9cqw; top: 50%; width: 32cqw; margin: 0; padding: 1.4cqw 1.4cqw 0; background: var(--mt-superficie); border-radius: calc(var(--mt-raio) * .5);
  translate: 0 -50%; rotate: -4deg; box-shadow: 0 .8cqw 2.4cqw 0 var(--mt-linha); }
.cartao img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 40%; border-radius: calc(var(--mt-raio) * .3); }
/* Sem foto: o recorte vira um vazio da cor da linha — o cartão continua de pé. */
.cartao img[data-sem-foto] { visibility: visible; background: var(--mt-linha); }
/* Texto sobre a superfície: o contrato de cor garante a leitura nos 4 modos (no escuro a superfície é escura). */
.legenda { padding: 1.4cqw .4cqw 1.8cqw; font: 600 max(var(--mt-piso, 0cqw), 1.5cqw)/1.3 var(--mt-fonte-texto); color: var(--mt-texto); text-wrap: balance; }
.legenda small { display: block; margin-top: .4cqw; font: 500 max(var(--mt-piso, 0cqw), 1.15cqw)/1.3 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
.bloco { position: absolute; left: 50cqw; right: 7cqw; top: 50%; transform: translateY(-50%); }
.kicker { display: flex; align-items: center; gap: 1.1cqw; font: 600 max(var(--mt-piso, 0cqw), 1.25cqw)/1 var(--mt-fonte-texto); letter-spacing: .3em; text-transform: uppercase; color: var(--mt-destaque); }
.kicker i { display: block; width: 3.6cqw; height: .14cqw; background: var(--mt-destaque); }
h1 { margin-top: 2.2cqw; font: 400 max(var(--mt-piso, 0cqw), 5.6cqw)/.98 var(--mt-fonte-titulo); text-transform: uppercase; text-wrap: balance; }
.apoio { margin-top: 2.4cqw; font: 400 max(var(--mt-piso, 0cqw), 1.6cqw)/1.5 var(--mt-fonte-texto); color: var(--mt-texto-suave); text-wrap: pretty; }
.mande { display: flex; align-items: center; gap: 2cqw; margin-top: 3cqw; }
.qr { flex: none; margin: 0; width: 13cqw; height: 13cqw; padding: .5cqw; border-radius: calc(var(--mt-raio) * .6); background: var(--mt-superficie); box-shadow: 0 0 0 .2cqw var(--mt-destaque); }
.qr img { width: 100%; height: 100%; }
.qr:has(img[data-sem-foto]) { display: none; }
.pedido { font: 600 max(var(--mt-piso, 0cqw), 1.25cqw)/1.35 var(--mt-fonte-texto); letter-spacing: .2em; text-transform: uppercase; }
/*
 * O destaque do Corporativo (e as principais deitadas menos largas que a TV):
 * a régua da TV pesa mais na altura menor. O cartão fica quadrado e mais
 * baixo, a legenda cabe em duas linhas, o texto ganha a largura que sobra.
 */
@container (aspect-ratio >= 1.25) and (aspect-ratio < 1.74) {
  .cartao { left: 6cqw; width: 35cqw; padding: 1.2cqw 1.2cqw 0; }
  .cartao img { aspect-ratio: 1; }
  .legenda { padding: 1.2cqw .3cqw 1.6cqw; line-height: 1.25; }
  .legenda small { margin-top: .3cqw; line-height: 1.25; }
  .bloco { left: 47cqw; right: 6cqw; }
  .kicker { letter-spacing: .1em; }
  .kicker i { display: none; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 10cqh); margin-top: .36em; }
  .apoio { line-height: 1.4; }
  .mande { margin-top: 2.2cqw; }
  .qr { width: 21cqh; height: 21cqh; padding: .7cqh; }
  .pedido { letter-spacing: .06em; text-wrap: balance; }
}
/* Em pé: o cartão em cima, quadrado; o texto embaixo, com o QR. */
@container (aspect-ratio < 0.8) {
  .cartao { left: 50%; top: 5cqh; width: 56cqw; padding: 2.2cqw 2.2cqw 0; translate: -50% 0; }
  .cartao img { aspect-ratio: 1; }
  .legenda { padding: 2.2cqw .6cqw 2.8cqw; font-size: max(var(--mt-piso, 0cqw), 3cqw); line-height: 1.25; }
  .legenda small { font-size: max(var(--mt-piso, 0cqw), 2.3cqw); margin-top: .8cqw; line-height: 1.25; }
  .bloco { left: 8cqw; right: 8cqw; top: auto; bottom: 6cqh; transform: none; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 2.4cqw); letter-spacing: .16em; }
  .kicker i { width: 6cqw; height: .28cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 9.6cqw); margin-top: .4em; }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 3cqw); margin-top: 3cqw; line-height: 1.4; }
  .mande { gap: 4cqw; margin-top: 4cqw; }
  .qr { width: 17cqw; height: 17cqw; padding: .9cqw; box-shadow: 0 0 0 .35cqw var(--mt-destaque); }
  .pedido { font-size: max(var(--mt-piso, 0cqw), 2.4cqw); letter-spacing: .12em; }
}
/* Quase quadrada: o cartão estreito à esquerda; à direita o texto, e o QR com o pedido ao lado. */
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .cartao { left: 6cqw; width: 34cqw; padding: 1.6cqw 1.6cqw 0; }
  .legenda { font-size: max(var(--mt-piso, 0cqw), 2.2cqw); padding: 1.6cqw .4cqw 2cqw; line-height: 1.25; }
  .legenda small { font-size: max(var(--mt-piso, 0cqw), 1.7cqw); margin-top: .4cqw; line-height: 1.25; }
  .bloco { left: 46cqw; right: 6cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 1.8cqw); letter-spacing: .1em; }
  .kicker i { display: none; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 6.4cqw); margin-top: .4em; }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 2.3cqw); margin-top: 2.4cqw; line-height: 1.4; }
  .mande { gap: 2cqw; margin-top: 3.4cqw; }
  .qr { width: 17cqw; height: 17cqw; padding: .8cqw; }
  .pedido { font-size: max(var(--mt-piso, 0cqw), 1.8cqw); letter-spacing: .06em; text-wrap: balance; }
}
</style>
<section class="mt-peca social-mural">
  <figure class="cartao" data-entrada="girar">
    <img data-campo-img="foto" alt="">
    <figcaption class="legenda"><span data-campo="legenda">Juliana, de óculos novo</span><small data-campo="quando">Cliente desde 2019</small></figcaption>
  </figure>
  <div class="bloco">
    <p class="kicker" data-entrada="esquerda" data-ordem="1"><i aria-hidden="true"></i><span data-campo="kicker">Mural dos clientes</span></p>
    <h1 data-campo="titulo" data-entrada="subir" data-ordem="2">A próxima foto pode ser a sua</h1>
    <p class="apoio" data-campo="apoio" data-entrada="aparecer" data-ordem="3">Tire uma foto com o óculos novo e mande para a gente. Ela entra no mural da loja.</p>
    <div class="mande" data-entrada="aparecer" data-ordem="4">
      <figure class="qr"><img data-campo-qr="link" alt="QR para mandar a sua foto"></figure>
      <p class="pedido" data-campo="pedido">Mande pelo QR</p>
    </div>
  </div>
</section>
