<!--
  Aviso com o laço — família serviço (lote 5, arquétipo A10, docs/design/SISTEMA-VISUAL.md).
  O laço do lugar (a fresa, o balcão, a sala) numa faixa larga em cima; o
  selo reto da cor de destaque assenta na borda de baixo dela; embaixo, em
  fundo cheio, o título à esquerda e a explicação com a data à direita.
  O selo é um bloco cheio: nenhum texto fica sobre o vídeo cru.
-->
<style>
.mt-peca { --f: 2.8cqw; --t: 6cqw; --faixa: 46%; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo); }
.foto { position: absolute; top: 0; left: 0; width: 100%; height: var(--faixa); object-fit: cover; object-position: 50% 50%; }
.selo { position: absolute; left: 6cqw; bottom: calc(100% - var(--faixa)); padding: 1.2cqh 1.4cqw 1cqh; background: var(--mt-destaque); color: var(--mt-sobre-destaque); font: 700 max(var(--mt-piso, 0cqw), var(--f))/1 var(--mt-fonte-texto); letter-spacing: .12em; text-transform: uppercase; }
.corpo { position: absolute; top: var(--faixa); left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 54fr 46fr; align-items: start; align-content: center; gap: 5cqw; padding: 5cqh 6cqw 6cqh; }
h1 { font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/1.02 var(--mt-fonte-titulo); letter-spacing: -.01em; text-wrap: balance; }
.lado { min-width: 0; }
.texto { font: 400 max(var(--mt-piso, 0cqw), var(--f))/1.3 var(--mt-fonte-texto); color: var(--mt-texto-suave); text-wrap: pretty; }
.quando { margin-top: 2.6cqh; padding-top: 1.6cqh; border-top: .14cqw solid var(--mt-linha); font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.2 var(--mt-fonte-texto); color: var(--mt-destaque); }

@container ((aspect-ratio >= 1.25) and (max-height: 900px)) or ((aspect-ratio >= 1.25) and (aspect-ratio < 1.6) and (max-height: 940px)) {
  .mt-peca { --f: 3.5cqw; --t: 5.6cqw; --faixa: 44%; }
  .selo { left: 5cqw; letter-spacing: .06em; }
  .corpo { grid-template-columns: 1fr; gap: 2cqh; padding: 4cqh 5cqw 5cqh; }
  .texto { display: none; }
  .quando { margin-top: 0; }
}
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { --f: 4.8cqw; --t: 5.6cqw; --faixa: 44%; }
  .corpo { padding: 3.4cqh 5cqw 4cqh; gap: 1.6cqh; }
  .quando { padding-top: 1.2cqh; }
}
/* Em pé: a faixa em cima, tudo empilhado embaixo. */
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 5.4cqw; --t: 11cqw; --faixa: 38%; }
  .selo { left: 7cqw; letter-spacing: .1em; }
  .corpo { grid-template-columns: 1fr; align-content: center; gap: 3.4cqh; padding: 5cqh 7cqw 6cqh; }
  .quando { border-top-width: .24cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.8cqw; --t: 7.6cqw; --faixa: 38%; }
  .corpo { gap: 2.4cqh; padding: 4.4cqh 7cqw 5cqh; }
}
@container (max-width: 700px) {
  .mt-peca { --f: 9.6cqw; --t: 12.4cqw; --faixa: 32%; }
  .selo { left: 8cqw; letter-spacing: .04em; }
  .corpo { gap: 2cqh; padding: 3.4cqh 8cqw 4cqh; }
  .texto { display: none; }
  h1 { line-height: 1.02; }
  .quando { margin-top: 0; }
}
</style>
<section class="mt-peca cena-aviso">
  <img class="foto" data-campo-img="foto" alt="" data-entrada="aproximar" data-continua="kenburns">
  <div class="corpo">
    <h1 data-campo="titulo" data-entrada="revelar" data-ordem="4">Parada programada da linha 2</h1>
    <div class="lado">
      <p class="texto" data-campo="corpo" data-entrada="aparecer" data-ordem="7">Manutenção preventiva das fresadoras. O turno B apoia a linha 1.</p>
      <p class="quando" data-campo="quando" data-entrada="aparecer" data-ordem="9">Nesta sexta, das 13h às 17h</p>
    </div>
  </div>
  <p class="selo" data-campo="selo" data-entrada="varrer" data-origem="esquerda" data-ordem="2">Atenção</p>
</section>
