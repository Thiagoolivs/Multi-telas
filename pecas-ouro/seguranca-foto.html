<!--
  Lista de segurança com foto — família serviço (lote 4, arquétipo A2).
  Para o chão de fábrica: a foto de quem trabalha numa metade e, na outra,
  o título e quatro itens com um traço de marcação na cor de destaque (o
  traço é desenho, aria-hidden; cada item é um campo). Sem pictograma de
  clip-art: a foto mostra o EPI de verdade.
-->
<style>
.mt-peca { --f: 2.6cqw; --t: 5.6cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo); display: grid; grid-template-columns: 44fr 56fr; }
.foto { width: 100%; height: 100%; min-height: 0; object-fit: cover; object-position: 50% 45%; }
.texto { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 7cqh 6cqw 7cqh 5cqw; }
.selo { align-self: flex-start; padding: .8cqh 1.4cqw; background: var(--mt-destaque); color: var(--mt-sobre-destaque); font: 700 max(var(--mt-piso, 0cqw), var(--f))/1 var(--mt-fonte-texto); letter-spacing: .1em; text-transform: uppercase; }
h1 { margin-top: 3cqh; font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/1.02 var(--mt-fonte-titulo); letter-spacing: -.01em; text-wrap: balance; }
.itens { margin-top: 3.4cqh; list-style: none; padding: 0; }
.itens li { display: flex; align-items: center; gap: 1.8cqw; padding: 1.4cqh 0; border-top: .14cqw solid var(--mt-linha); }
.itens i { flex: none; display: block; width: 2.4cqw; height: .5cqw; background: var(--mt-destaque); }
.itens span { min-width: 0; font: 500 max(var(--mt-piso, 0cqw), var(--f))/1.2 var(--mt-fonte-texto); }

@container (aspect-ratio >= 1.25) and (max-height: 900px) {
  .mt-peca { --f: 3.5cqw; --t: 5.4cqw; grid-template-columns: 43fr 57fr; }
  .texto { padding: 5cqh 5cqw 5cqh 4cqw; }
  .selo { letter-spacing: .04em; }
  h1 { margin-top: 2cqh; }
  .itens { margin-top: 2cqh; }
  .itens li { padding: 1cqh 0; }
  .itens i { width: 3cqw; height: .6cqw; }
}
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.6cqw; --t: 9.6cqw; grid-template-columns: 1fr; grid-template-rows: 36fr 64fr; }
  .texto { justify-content: flex-start; padding: 5cqh 7cqw 6cqh; }
  .selo { padding: 1cqh 2.4cqw; }
  .itens li { gap: 3cqw; padding: 2cqh 0; border-top-width: .24cqw; }
  .itens i { width: 4.4cqw; height: .9cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --t: 7.4cqw; grid-template-rows: 32fr 68fr; }
  .texto { justify-content: center; padding: 4cqh 7cqw 5cqh; }
  h1 { margin-top: 2cqh; }
  .itens { margin-top: 2cqh; }
  .itens li { padding: 1.3cqh 0; }
}
</style>
<section class="mt-peca seguranca-foto">
  <img class="foto" data-campo-img="foto" alt="" data-entrada="aparecer">
  <div class="texto">
    <p class="selo" data-campo="selo" data-entrada="esquerda" data-ordem="1">Área de solda</p>
    <h1 data-campo="titulo" data-entrada="subir" data-ordem="2">Antes de entrar, confira</h1>
    <ul class="itens" data-entrada="subir" data-ordem="3">
      <li><i aria-hidden="true"></i><span data-campo="item1">Máscara de solda abaixada</span></li>
      <li><i aria-hidden="true"></i><span data-campo="item2">Luvas de raspa</span></li>
      <li><i aria-hidden="true"></i><span data-campo="item3">Avental e mangote</span></li>
      <li><i aria-hidden="true"></i><span data-campo="item4">Botina com biqueira</span></li>
    </ul>
  </div>
</section>
