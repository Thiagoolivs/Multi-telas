<!--
  Horário com foto — família serviço (lote 4, arquétipo A5).
  O quadro de horários como placa de recepção de hotel: a foto da casa em
  corte seco, e ao lado três linhas de dia e hora, com o dia à esquerda e a
  hora à direita, filete entre elas. Uma nota curta fecha. Serve a toda
  frente.
-->
<style>
.mt-peca { --f: 2.6cqw; --t: 5.4cqw; --h: 3.4cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo); display: grid; grid-template-columns: 40fr 60fr; }
.foto { width: 100%; height: 100%; min-height: 0; object-fit: cover; object-position: 50% 50%; }
.texto { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 7cqh 6cqw 7cqh 5cqw; }
.kicker { font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.1 var(--mt-fonte-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--mt-destaque); }
h1 { margin-top: 2cqh; font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.01em; }
.dias { margin-top: 4cqh; list-style: none; padding: 0; border-top: .14cqw solid var(--mt-linha); }
.dias li { display: flex; align-items: baseline; justify-content: space-between; gap: 2cqw; padding: 1.8cqh 0; border-bottom: .14cqw solid var(--mt-linha); }
.dias span { min-width: 0; font: 500 max(var(--mt-piso, 0cqw), var(--f))/1.2 var(--mt-fonte-texto); }
.dias b { flex: none; font: 500 max(var(--mt-piso, 0cqw), calc(var(--h) * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); white-space: nowrap; }
.nota { margin-top: 3cqh; font: 400 max(var(--mt-piso, 0cqw), var(--f))/1.25 var(--mt-fonte-texto); color: var(--mt-texto-suave); }

@container (aspect-ratio >= 1.25) and (max-height: 900px) {
  .mt-peca { --f: 3.5cqw; --t: 5.2cqw; --h: 4cqw; grid-template-columns: 34fr 66fr; }
  .texto { padding: 5cqh 5cqw 5cqh 4.4cqw; }
  .kicker, .nota { display: none; }
  h1 { margin-top: 0; }
  .dias { margin-top: 3cqh; }
  .dias li { padding: 1.4cqh 0; }
}
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { --f: 4.8cqw; --h: 5.2cqw; }
  h1 { display: none; }
  .dias { margin-top: 0; }
  .dias li { padding: 1cqh 0; }
}
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.6cqw; --t: 9.6cqw; --h: 6.4cqw; grid-template-columns: 1fr; grid-template-rows: 34fr 66fr; }
  .texto { justify-content: flex-start; padding: 6cqh 7cqw; }
  .dias { border-top-width: .24cqw; }
  .dias li { padding: 2.2cqh 0; border-bottom-width: .24cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --t: 7.6cqw; --h: 5.6cqw; grid-template-columns: 34fr 66fr; grid-template-rows: 1fr; }
  .texto { justify-content: center; padding: 5cqh 6cqw 5cqh 5cqw; }
  .kicker { display: none; }
  h1 { margin-top: 0; }
  .dias li { padding: 1.6cqh 0; }
}
@container (max-width: 700px) {
  .mt-peca { --f: 9.6cqw; --t: 12cqw; --h: 11cqw; grid-template-rows: 22fr 78fr; }
  .texto { justify-content: center; padding: 3cqh 8cqw 4cqh; }
  .kicker, .nota { display: none; }
  h1 { margin-top: 0; }
  .dias { margin-top: 2.4cqh; }
  .dias li { flex-direction: column; align-items: flex-start; gap: .6cqh; padding: 1.4cqh 0; }
}
/*
 * A lateral com a margem contra o corte de 4,5% ou mais (457×685 e menor):
 * o último horário passava da borda de baixo. A foto fica mais baixa e as
 * linhas dos dias apertam.
 */
@container (max-width: 700px) and (max-height: 690px) {
  .mt-peca { grid-template-rows: 15fr 85fr; }
  .dias { margin-top: 1.8cqh; }
  .dias li { gap: .4cqh; padding: 1cqh 0; }
}
</style>
<section class="mt-peca horario-foto">
  <img class="foto" data-campo-img="foto" alt="" data-entrada="aproximar" data-continua="kenburns">
  <div class="texto">
    <p class="kicker" data-campo="kicker" data-entrada="aparecer" data-ordem="2">Venha nos ver</p>
    <h1 data-campo="titulo" data-entrada="revelar" data-ordem="4">Horário de funcionamento</h1>
    <ul class="dias">
      <li data-entrada="aparecer" data-ordem="7"><span data-campo="dia1">Segunda a sexta</span><b data-campo="hora1">6h – 20h</b></li>
      <li data-entrada="aparecer" data-ordem="9"><span data-campo="dia2">Sábado</span><b data-campo="hora2">6h – 18h</b></li>
      <li data-entrada="aparecer" data-ordem="11"><span data-campo="dia3">Domingo</span><b data-campo="hora3">7h – 12h</b></li>
    </ul>
    <p class="nota" data-campo="nota" data-entrada="aparecer" data-ordem="13">Feriados: das 7h às 12h</p>
  </div>
</section>
