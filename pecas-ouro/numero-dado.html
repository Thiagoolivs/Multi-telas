<!--
  O número do mês — família institucional (lote 4, arquétipo A4).
  Um indicador como capa de relatório anual: o número enorme na letra do
  título domina a peça, a legenda logo abaixo diz o que ele mede, e uma
  linha de contexto fecha sob um filete. A foto fica numa coluna de corte
  seco — a fábrica, a loja, a equipe. Serve a qualquer frente (na saúde, um
  número de casa, nunca um resultado prometido).
-->
<style>
.mt-peca { --f: 2.6cqw; --n: 24cqw; --t: 4.4cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo); display: grid; grid-template-columns: 60fr 40fr; }
.texto { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 7cqh 5cqw 7cqh 6cqw; }
.foto { width: 100%; height: 100%; min-height: 0; object-fit: cover; object-position: 50% 50%; }
.kicker { display: flex; align-items: center; gap: 1.2cqw; font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.1 var(--mt-fonte-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--mt-destaque); }
.kicker i { flex: none; display: block; width: 3.2cqw; height: .16cqw; background: var(--mt-destaque); }
.numero { margin-top: 2cqh; font: 500 max(var(--mt-piso, 0cqw), calc(var(--n) * var(--mt-escala-titulo, 1)))/.84 var(--mt-fonte-titulo); letter-spacing: -.04em; white-space: nowrap; }
.rotulo { margin-top: 2.4cqh; font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/1.05 var(--mt-fonte-titulo); color: var(--mt-texto-suave); text-wrap: balance; }
.contexto { margin-top: 4cqh; padding-top: 2cqh; border-top: .14cqw solid var(--mt-linha); font: 500 max(var(--mt-piso, 0cqw), var(--f))/1.25 var(--mt-fonte-texto); }

@container (aspect-ratio >= 1.25) and (max-height: 900px) {
  .mt-peca { --f: 3.5cqw; --n: 22cqw; --t: 4.8cqw; grid-template-columns: 62fr 38fr; }
  .texto { padding: 5cqh 4cqw 5cqh 5cqw; }
  .kicker { letter-spacing: .06em; }
  .kicker i { display: none; }
  .contexto { margin-top: 3cqh; }
}
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { --f: 4.8cqw; --n: 18cqw; --t: 5cqw; }
  .kicker, .contexto { display: none; }
  .numero { margin-top: 0; }
}
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.6cqw; --n: 40cqw; --t: 7.6cqw; grid-template-columns: 1fr; grid-template-rows: 36fr 64fr; }
  .texto { grid-row: 2; padding: 4cqh 7cqw 6cqh; }
  .foto { grid-row: 1; }
  .kicker i { width: 5cqw; height: .26cqw; }
  .contexto { border-top-width: .24cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --n: 30cqw; --t: 6.6cqw; grid-template-rows: 28fr 72fr; }
  .texto { padding: 4cqh 7cqw 5cqh; }
  .numero { margin-top: 1cqh; }
  .contexto { margin-top: 3cqh; }
}
@container (max-width: 700px) {
  .mt-peca { --f: 9.6cqw; --n: 44cqw; --t: 11cqw; grid-template-rows: 30fr 70fr; }
  .texto { padding: 3cqh 8cqw 4cqh; }
  .kicker { letter-spacing: .02em; text-transform: none; }
  .kicker i, .contexto { display: none; }
}
</style>
<section class="mt-peca numero-dado">
  <div class="texto">
    <p class="kicker" data-entrada="esquerda" data-ordem="1"><i aria-hidden="true"></i><span data-campo="kicker">Segurança</span></p>
    <p class="numero" data-campo="numero" data-entrada="crescer" data-ordem="2">312</p>
    <p class="rotulo" data-campo="rotulo" data-entrada="subir" data-ordem="3">dias sem acidente com afastamento</p>
    <p class="contexto" data-campo="contexto" data-entrada="aparecer" data-ordem="4">O recorde da fábrica é 405. Vamos juntos.</p>
  </div>
  <img class="foto" data-campo-img="foto" alt="" data-entrada="aparecer">
</section>
