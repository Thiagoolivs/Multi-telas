<!--
  Três produtos com preço — família oferta. Destaque e lateral.
  Vitrine de cardápio, mas de produto: nome, um detalhe, o preço. Sem foto
  de propósito — custa zero e lê de longe. Deitada, título à esquerda e
  lista à direita; em pé ou quadrada, um embaixo do outro.
-->
<style>
.mt-peca { color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(90% 120% at 100% 0%, var(--mt-fundo-2), var(--mt-fundo) 60%); }
.marca-nome { position: absolute; left: 6cqw; top: 6cqh; font: 600 max(var(--mt-piso, 0cqw), 1.25cqw)/1 var(--mt-fonte-texto); letter-spacing: .42em; text-transform: uppercase; }
.marca-nome b { font-weight: 800; }
.cabeca { position: absolute; left: 6cqw; top: 50%; transform: translateY(-50%); width: 34cqw; }
.kicker { display: flex; align-items: center; gap: 1.1cqw; font: 600 max(var(--mt-piso, 0cqw), 1.25cqw)/1 var(--mt-fonte-texto); letter-spacing: .3em; text-transform: uppercase; color: var(--mt-destaque); }
.kicker i { display: block; width: 3.6cqw; height: .14cqw; background: var(--mt-destaque); }
h1 { font: 400 max(var(--mt-piso, 0cqw), 6.4cqw)/.95 var(--mt-fonte-titulo); text-transform: uppercase; margin: 2.2cqw 0 2.4cqw; text-wrap: balance; }
.apoio { font: 400 max(var(--mt-piso, 0cqw), 1.5cqw)/1.5 var(--mt-fonte-texto); color: var(--mt-texto-suave); max-width: 28cqw; }
.itens { position: absolute; left: 46cqw; right: 6cqw; top: 50%; transform: translateY(-50%); list-style: none; margin: 0; padding: 0; }
.itens li { display: grid; grid-template-columns: 4cqw 1fr auto; align-items: center; gap: 1.6cqw; padding: 2.3cqw 0; border-top: .12cqw solid var(--mt-linha); }
.itens li:last-child { border-bottom: .12cqw solid var(--mt-linha); }
.num { font: 600 max(var(--mt-piso, 0cqw), 1.15cqw)/1 var(--mt-fonte-texto); letter-spacing: .2em; color: var(--mt-destaque); }
.txt b { display: block; font: 400 max(var(--mt-piso, 0cqw), 2.7cqw)/1.05 var(--mt-fonte-titulo); text-transform: uppercase; letter-spacing: .02em; }
.det { display: block; margin-top: .6cqw; font: 400 max(var(--mt-piso, 0cqw), 1.25cqw)/1.3 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
.valor { font: 400 max(var(--mt-piso, 0cqw), 4.6cqw)/1 var(--mt-fonte-titulo); color: var(--mt-preco); white-space: nowrap; }
.valor small { font-size: max(var(--mt-piso, 0cqw), .36em); vertical-align: 1em; margin-right: .2em; }
.cta { position: absolute; left: 6cqw; bottom: 6cqh; font: 600 max(var(--mt-piso, 0cqw), 1.2cqw)/1 var(--mt-fonte-texto); letter-spacing: .24em; text-transform: uppercase; padding-bottom: .7cqw; border-bottom: .12cqw solid var(--mt-destaque); }
/*
 * A principal do Corporativo (1379×784 na TV): com a letra do balcão o
 * detalhe de cada item vai em duas linhas e a lista ocupa a altura toda.
 * Ela fica com a coluna da direita inteira; na da esquerda o apoio sai, as
 * letras espaçadas apertam e a chamada quebra dentro da coluna (comprida,
 * ela passava por baixo da lista).
 */
/* Sem mensagem no rodapé, a principal do Corporativo cresce (1377×913): o mesmo desenho, até 940 px de altura. */
@container ((aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 860px)) or ((aspect-ratio >= 1.25) and (aspect-ratio < 1.6) and (min-height: 860px) and (max-height: 940px)) {
  .marca-nome { letter-spacing: .14em; }
  .kicker { gap: .8cqw; letter-spacing: .06em; }
  .kicker i { width: 2.4cqw; }
  h1 { margin: 1.4cqw 0 0; }
  .apoio { display: none; }
  .itens li { padding: 1.1cqw 0; }
  .det { margin-top: .3cqw; line-height: 1.2; }
  .cta { max-width: 36cqw; letter-spacing: .06em; line-height: 1.1; }
}
/* Em pé e quase quadrada: título em cima, lista embaixo. */
@container (aspect-ratio < 1.25) {
  .marca-nome { left: 8cqw; top: 5cqh; font-size: max(var(--mt-piso, 0cqw), 2cqw); }
  .cabeca { left: 8cqw; right: 8cqw; width: auto; top: 12cqh; transform: none; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 2cqw); }
  .kicker i { width: 5.5cqw; height: .22cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 9cqw); margin: 3cqw 0 2.4cqw; }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 2.6cqw); max-width: none; }
  .itens { left: 8cqw; right: 8cqw; top: auto; bottom: 13cqh; transform: none; }
  .itens li { grid-template-columns: 6cqw 1fr auto; gap: 2.4cqw; padding: 3cqw 0; border-top-width: .2cqw; }
  .itens li:last-child { border-bottom-width: .2cqw; }
  .num { font-size: max(var(--mt-piso, 0cqw), 1.9cqw); }
  .txt b { font-size: max(var(--mt-piso, 0cqw), 4.2cqw); }
  .det { font-size: max(var(--mt-piso, 0cqw), 2.1cqw); margin-top: .9cqw; }
  .valor { font-size: max(var(--mt-piso, 0cqw), 7.4cqw); }
  .cta { left: 8cqw; bottom: 5cqh; font-size: max(var(--mt-piso, 0cqw), 2cqw); border-bottom-width: .2cqw; }
}
/* Quadrada: com a letra da TV a lista subia por cima do apoio. Margens de 7%, o rótulo menos espaçado, o preço um pouco menor (o detalhe cabe numa linha) e a lista mais justa. */
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .marca-nome, .cabeca, .itens, .cta { left: 7cqw; }
  .cabeca, .itens { right: 7cqw; }
  .kicker { letter-spacing: .16em; }
  .apoio { line-height: 1.35; }
  .itens { bottom: 12.5cqh; }
  .itens li { grid-template-columns: 5cqw 1fr auto; gap: 2cqw; padding: .8cqw 0; }
  .num { letter-spacing: .06em; }
  .det { margin-top: .6cqw; line-height: 1.15; }
  .valor { font-size: max(var(--mt-piso, 0cqw), 6.6cqw); }
}
/* A lateral: menos texto, letra maior. */
@container (max-width: 700px) {
  /* Com a letra do balcão os blocos presos no alto e no pé se encontravam: aqui eles vão um embaixo do outro,
     centrados; o kicker, o nome da loja (a tela já diz, no cabeçalho) e a chamada saem: o título e os três itens ficam. */
  .mt-peca { display: flex; flex-direction: column; justify-content: center; gap: 4cqw; padding: 6cqmin 7cqw; }
  .cabeca, .itens { position: static; width: auto; transform: none; }
  .apoio, .det, .marca-nome, .cta, .kicker { display: none; }
  h1 { margin: 0; font-size: max(var(--mt-piso, 0cqw), 11.5cqw); }
  /* O preço que não cabe ao lado do nome (fonte de marca larga) desce para a linha de baixo, à direita. */
  /* A linha na letra do número: a coluna dele (1,3em) e a do nome contam na mesma medida. */
  .itens li { display: flex; flex-wrap: wrap; align-items: center; column-gap: 2cqw; row-gap: .4cqw; padding: 2.2cqw 0; font-size: max(var(--mt-piso, 0cqw), 3cqw); }
  .num { flex: none; width: 1.3em; font-size: 1em; letter-spacing: 0; }
  .txt { flex: 1 1 auto; min-width: 0; max-width: calc(100% - 1.3em - 2cqw); }
  .txt b { font-size: max(var(--mt-piso, 0cqw), 6cqw); letter-spacing: 0; }
  .valor { flex: none; margin-left: auto; font-size: max(var(--mt-piso, 0cqw), 13.5cqw); }
  .valor small { vertical-align: .5em; }
}
/* Com a margem contra o corte de 2,5% ou mais (de 1307×728 a 1236×674): a lista e os detalhes apertam mais; com 3,5% ou mais, a lista alarga e o número de ordem sai. */
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 745px) {
  .itens li { padding: .7cqw 0; }
  .txt b { line-height: 1; }
  .det { margin-top: .2cqw; line-height: 1.1; }
}
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 712px) {
  .itens { left: 42cqw; }
  .itens li { grid-template-columns: 1fr auto; }
  .num { display: none; }
}
/* A lateral da margem de 5% (452×674): o título aperta a entrelinha. */
@container (max-width: 700px) and (max-height: 625px) {
  h1 { line-height: .88; }
}
</style>
<section class="mt-peca oferta-lista">
  <div class="marca-nome" data-campo="marca" data-repete="marca">Ótica <b>Central</b></div>
  <div class="cabeca">
    <p class="kicker" data-entrada="esquerda" data-ordem="1"><i aria-hidden="true"></i><span data-campo="kicker">Vitrine da semana</span></p>
    <h1 data-campo="titulo" data-entrada="subir" data-ordem="2">Escolha o seu par</h1>
    <p class="apoio" data-campo="apoio" data-entrada="aparecer" data-ordem="3">Três modelos com lente polarizada e proteção UV400.</p>
  </div>
  <ol class="itens">
    <li data-entrada="direita" data-ordem="3"><span class="num" aria-hidden="true">01</span><span class="txt"><b data-campo="item1-nome">Aviador clássico</b><span class="det" data-campo="item1-detalhe">Metal dourado · polarizado</span></span><span class="valor"><small aria-hidden="true">R$</small><span data-campo="item1-preco">389</span></span></li>
    <li data-entrada="direita" data-ordem="4"><span class="num" aria-hidden="true">02</span><span class="txt"><b data-campo="item2-nome">Gatinho acetato</b><span class="det" data-campo="item2-detalhe">Tartaruga · lente degradê</span></span><span class="valor"><small aria-hidden="true">R$</small><span data-campo="item2-preco">289</span></span></li>
    <li data-entrada="direita" data-ordem="5"><span class="num" aria-hidden="true">03</span><span class="txt"><b data-campo="item3-nome">Esportivo</b><span class="det" data-campo="item3-detalhe">Leve · espelhado azul</span></span><span class="valor"><small aria-hidden="true">R$</small><span data-campo="item3-preco">459</span></span></li>
  </ol>
  <div class="cta" data-entrada="aparecer" data-ordem="6"><span data-campo="cta">Experimente na loja</span> <span aria-hidden="true">→</span></div>
</section>
