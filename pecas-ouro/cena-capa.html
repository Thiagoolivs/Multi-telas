<!--
  Capa com o laço — família institucional (lote 5, arquétipo A1, docs/design/SISTEMA-VISUAL.md).
  O vídeo curto (a foto viva) cobre a peça; o texto mora num bloco de fundo
  cheio, de canto reto, preso ao pé e à esquerda, como a legenda de um filme.
  Nada escrito sobre o vídeo cru: o bloco cresce com a letra. Em pé, na
  quadrada e na lateral o vídeo fica em cima, numa janela entre 0,8 e 2,2 de
  proporção (o laço deitado e o quadrado cobrem sem cortar demais).
-->
<style>
.mt-peca { --f: 2.6cqw; --t: 6.2cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo); }
.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }
.bloco { position: absolute; left: 0; bottom: 0; width: 50%; padding: 5.4cqh 5cqw 7cqh 6cqw; background: var(--mt-fundo); }
.kicker { display: flex; align-items: center; gap: 1.2cqw; font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.1 var(--mt-fonte-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--mt-destaque); }
.kicker i { flex: none; display: block; width: 3.2cqw; height: .16cqw; background: var(--mt-destaque); }
h1 { margin-top: 2.6cqh; font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.01em; text-wrap: balance; }
h1 span, h1 em { display: block; }
h1 em { font-style: normal; color: var(--mt-destaque); }
.apoio { margin-top: 3cqh; font: 400 max(var(--mt-piso, 0cqw), var(--f))/1.3 var(--mt-fonte-texto); color: var(--mt-texto-suave); text-wrap: pretty; }
.foto[data-sem-foto] ~ .bloco { width: 100%; }

/* A principal do Corporativo (1405×832, e 1377×913 sem mensagem no rodapé): a letra do balcão; o bloco alarga e o apoio sai. */
@container ((aspect-ratio >= 1.25) and (max-height: 900px)) or ((aspect-ratio >= 1.25) and (aspect-ratio < 1.6) and (max-height: 940px)) {
  .mt-peca { --f: 3.5cqw; --t: 5.6cqw; }
  .bloco { width: 60%; padding: 5cqh 4cqw 6cqh 5cqw; }
  .kicker { letter-spacing: .08em; }
  .apoio { display: none; }
}
/* A faixa baixa (1038×559, a de baixo da TV em pé): só o título. */
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { --f: 4.8cqw; --t: 6cqw; }
  .bloco { width: 64%; padding: 4cqh 4cqw 5cqh 5cqw; }
  .kicker { display: none; }
  h1 { margin-top: 0; }
}
/* Em pé e quadrada: o vídeo em cima, o bloco no pé (por cima da borda de baixo do vídeo, se a letra pedir). */
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 5cqw; --t: 12cqw; }
  .foto { height: 60%; }
  .bloco { right: 0; width: auto; min-height: 40%; display: flex; flex-direction: column; justify-content: center; padding: 4cqh 7cqw 6cqh; }
  .kicker { letter-spacing: .1em; }
  .kicker i { width: 5cqw; height: .26cqw; }
  h1 { margin-top: 3cqw; }
  .apoio { margin-top: 3.4cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.6cqw; --t: 7.6cqw; }
  .foto { height: 50%; }
  .bloco { min-height: 50%; padding: 4cqh 7cqw 5cqh; }
  h1 { margin-top: 2.4cqw; }
  .apoio { margin-top: 2.4cqw; }
}
/* A lateral estreita (515×832 e, com 5% de margem, 452×674): o vídeo e o título. */
@container (max-width: 700px) {
  .mt-peca { --f: 9.6cqw; --t: 12cqw; }
  .foto { height: 54%; }
  .bloco { min-height: 46%; padding: 3cqh 8cqw 4cqh; }
  .kicker, .apoio { display: none; }
  h1 { margin-top: 0; line-height: 1.02; }
}
</style>
<section class="mt-peca cena-capa">
  <img class="foto" data-campo-img="foto" alt="" data-entrada="aproximar" data-continua="kenburns">
  <div class="bloco" data-entrada="varrer" data-origem="esquerda" data-ordem="1">
    <p class="kicker" data-entrada="aparecer" data-ordem="5"><i aria-hidden="true" data-entrada="desenhar" data-ordem="5"></i><span data-campo="kicker">Feito aqui</span></p>
    <h1 data-entrada="revelar" data-ordem="6"><span data-campo="titulo">Massa sovada</span><em data-campo="titulo2">à mão, todo dia</em></h1>
    <p class="apoio" data-campo="apoio" data-entrada="subir" data-ordem="9">Fermentação lenta e forno aceso desde as cinco da manhã.</p>
  </div>
</section>
