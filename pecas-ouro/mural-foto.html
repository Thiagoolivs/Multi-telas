<!--
  Mosaico de quatro fotos — família social (lote 4, arquétipo A9).
  A casa em quatro quadros, como a grade de um perfil de rede social: uma
  foto grande e três menores, em grade de corte seco com vão estreito; o
  título e o @ ficam numa coluna de fundo cheio. Comércio e empresa.
-->
<style>
.mt-peca { --f: 2.6cqw; --t: 5.6cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo);
  display: grid; grid-template-columns: 37fr 63fr; gap: 0; }
.texto { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 7cqh 4cqw 7cqh 6cqw; }
.kicker { font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.1 var(--mt-fonte-texto); letter-spacing: .08em; text-transform: uppercase; color: var(--mt-destaque); }
h1 { margin-top: 2cqh; font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/1.02 var(--mt-fonte-titulo); letter-spacing: -.01em; text-wrap: balance; }
.arroba { margin-top: 4cqh; padding-top: 2cqh; border-top: .14cqw solid var(--mt-linha); font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.2 var(--mt-fonte-texto); overflow-wrap: anywhere; }
.grade { min-width: 0; min-height: 0; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: .8cqw; padding: 0 0 0 0; }
.grade img { width: 100%; height: 100%; min-height: 0; object-fit: cover; object-position: 50% 50%; }
.grade img:first-child { grid-row: 1 / 4; }

@container (aspect-ratio >= 1.25) and (max-height: 900px) {
  .mt-peca { --f: 3.5cqw; --t: 5.4cqw; grid-template-columns: 38fr 62fr; }
  .texto { padding: 5cqh 3cqw 5cqh 5cqw; }
  .kicker { letter-spacing: .06em; }
}
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.6cqw; --t: 9.6cqw; grid-template-columns: 1fr; grid-template-rows: 62fr 38fr; }
  .grade { grid-row: 1; grid-template-columns: 1fr 1fr; grid-template-rows: 2fr 1fr; gap: 1.2cqw; }
  .grade img:first-child { grid-row: 1; grid-column: 1 / 3; }
  .grade img:nth-child(4) { display: none; }
  .texto { grid-row: 2; padding: 4cqh 7cqw 5cqh; }
  .arroba { border-top-width: .24cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --t: 7cqw; grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .texto { grid-row: 1; grid-column: 1; padding: 5cqh 7cqw 4cqh; }
  .kicker { display: none; }
  h1 { margin-top: 0; }
  .arroba { margin-top: 2cqh; padding-top: 1.6cqh; }
  .grade { grid-row: 2; grid-column: 1; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 1cqw; }
  .grade img:first-child { grid-row: auto; grid-column: auto; }
  .grade img:nth-child(4) { display: block; }
}
</style>
<section class="mt-peca mural-foto">
  <div class="texto">
    <p class="kicker" data-campo="kicker" data-entrada="revelar" data-ordem="4">No Instagram</p>
    <h1 data-campo="titulo" data-entrada="revelar" data-ordem="5">Os bastidores da cozinha, todo dia</h1>
    <p class="arroba" data-campo="arroba" data-entrada="aparecer" data-ordem="9">@sua.casa</p>
  </div>
  <div class="grade">
    <img data-campo-img="foto" alt="" data-entrada="aproximar" data-ordem="0">
    <img data-campo-img="foto2" alt="" data-entrada="aproximar" data-ordem="1">
    <img data-campo-img="foto3" alt="" data-entrada="aproximar" data-ordem="2">
    <img data-campo-img="foto4" alt="" data-entrada="aproximar" data-ordem="3">
  </div>
</section>
