<!--
  Chegou — família oferta. Destaque e lateral.
  O lançamento como um carimbo: o selo redondo de "Novo", girado, sobre
  um sol de raios finos (gradiente cônico, sem animação), e do lado o
  nome do produto, o porquê em uma linha e desde quando. Sem preço de
  propósito: o lançamento vende a novidade; a oferta tem outras peças.
-->
<style>
.mt-peca { overflow-wrap: break-word; display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 7cqw; padding: 8cqmin 7cqw;
  color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo); }
.carimbo { position: relative; display: flex; align-items: center; justify-content: center; width: 58cqmin; height: 58cqmin; }
.carimbo::before { content: ''; position: absolute; inset: -12cqmin; border-radius: 50%;
  background: repeating-conic-gradient(var(--mt-destaque) 0 3deg, transparent 3deg 15deg); opacity: .2; }
.disco { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border-radius: 50%; background: var(--mt-destaque);
  box-shadow: 0 0 0 1.4cqmin var(--mt-fundo), 0 0 0 2.2cqmin var(--mt-destaque); transform: rotate(-12deg); }
.disco::after { content: ''; position: absolute; inset: 4cqmin; border-radius: 50%; border: .6cqmin dashed var(--mt-sobre-destaque); opacity: .6; }
.selo { position: relative; max-width: 80%; text-align: center; font: 700 max(var(--mt-piso, 0cqw), calc(13cqmin * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: .02em; text-transform: uppercase; color: var(--mt-sobre-destaque); }
.kicker { font: 700 max(var(--mt-piso, 0cqw), 4cqmin)/1.15 var(--mt-fonte-texto); letter-spacing: .08em; text-transform: uppercase; color: var(--mt-preco); }
h1 { margin-top: 3cqmin; font: 700 max(var(--mt-piso, 0cqw), calc(12.4cqmin * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.01em; text-wrap: balance; }
.apoio { margin-top: 4cqmin; font: 500 max(var(--mt-piso, 0cqw), 5.4cqmin)/1.3 var(--mt-fonte-texto); color: var(--mt-texto-suave); max-width: 20em; text-wrap: pretty; }
.quando { display: inline-flex; align-items: center; gap: 2cqmin; margin-top: 5cqmin; font: 700 max(var(--mt-piso, 0cqw), 4.6cqmin)/1.2 var(--mt-fonte-texto); }
.quando i { display: block; flex: none; width: 2.6cqmin; height: 2.6cqmin; border-radius: 50%; background: var(--mt-destaque); }
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 860px) {
  .mt-peca { column-gap: 6cqw; padding: 7cqmin 6cqw; }
  .carimbo { width: 48cqmin; height: 48cqmin; }
  .selo { font-size: max(var(--mt-piso, 0cqw), calc(11cqmin * var(--mt-escala-titulo, 1))); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(10.4cqmin * var(--mt-escala-titulo, 1))); }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 4.8cqmin); }
}
/* Em pé: o carimbo em cima, o produto embaixo. */
@container (aspect-ratio < 1.25) {
  .mt-peca { grid-template-columns: 1fr; justify-items: center; align-content: center; row-gap: 9cqmin; padding: 9cqmin 8cqw; }
  .texto { justify-self: stretch; }
  .carimbo { width: 52cqw; height: 52cqw; }
  .selo { font-size: max(var(--mt-piso, 0cqw), calc(12cqw * var(--mt-escala-titulo, 1))); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(12.6cqw * var(--mt-escala-titulo, 1))); }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 5.8cqw); max-width: none; }
  .quando { font-size: max(var(--mt-piso, 0cqw), 5cqw); }
}
@container (aspect-ratio < 0.8) and (min-width: 701px) {
  .mt-peca { row-gap: 14cqw; }
  .carimbo { width: 60cqw; height: 60cqw; }
  .selo { font-size: max(var(--mt-piso, 0cqw), calc(14cqw * var(--mt-escala-titulo, 1))); }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 4.8cqw); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(14cqw * var(--mt-escala-titulo, 1))); }
  .apoio { margin-top: 5cqw; font-size: max(var(--mt-piso, 0cqw), 6.6cqw); }
  .quando { margin-top: 7cqw; font-size: max(var(--mt-piso, 0cqw), 5.6cqw); }
}
/* Quase quadrada: o carimbo menor, ao lado do kicker e do produto. */
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { grid-template-columns: 1fr auto; justify-items: stretch; align-items: start; column-gap: 4cqw; row-gap: 0; padding: 8cqmin 7cqw; }
  .texto { grid-column: 1 / -1; grid-row: 1; }
  .carimbo { grid-column: 2; grid-row: 1; width: 30cqmin; height: 30cqmin; margin: -2cqmin -2cqmin 0 0; }
  .carimbo::before { inset: -6cqmin; }
  .disco { box-shadow: 0 0 0 1cqmin var(--mt-fundo), 0 0 0 1.6cqmin var(--mt-destaque); }
  .disco::after { inset: 2.4cqmin; }
  .selo { font-size: max(var(--mt-piso, 0cqw), calc(7cqmin * var(--mt-escala-titulo, 1))); }
  .kicker, h1 { margin-right: 32cqmin; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(10.4cqmin * var(--mt-escala-titulo, 1))); }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 5cqmin); max-width: none; }
  .quando { font-size: max(var(--mt-piso, 0cqw), 4.4cqmin); }
}
/* A lateral: o carimbo, o produto e o desde quando; o porquê sai. */
@container (max-width: 700px) {
  .carimbo { width: 56cqw; height: 56cqw; }
  .selo { font-size: max(var(--mt-piso, 0cqw), calc(13cqw * var(--mt-escala-titulo, 1))); }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 5.8cqw); letter-spacing: .04em; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(12cqw * var(--mt-escala-titulo, 1))); }
  .apoio { display: none; }
  .quando { font-size: max(var(--mt-piso, 0cqw), 6.2cqw); }
}
/* Deitada e baixa: o carimbo, o produto e o desde quando. */
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { padding: 6cqmin 7cqw; column-gap: 7cqw; }
  .carimbo { width: 62cqmin; height: 62cqmin; }
  .selo { font-size: max(var(--mt-piso, 0cqw), calc(14cqmin * var(--mt-escala-titulo, 1))); }
  .apoio { display: none; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(13cqmin * var(--mt-escala-titulo, 1))); }
}
</style>
<section class="mt-peca oferta-chegou">
  <div class="carimbo" data-entrada="girar"><div class="disco"><span class="selo" data-campo="selo">Novo</span></div></div>
  <div class="texto">
    <p class="kicker" data-campo="kicker" data-entrada="esquerda" data-ordem="1">Acabou de chegar</p>
    <h1 data-campo="titulo" data-entrada="subir" data-ordem="2">Lentes com filtro de luz azul</h1>
    <p class="apoio" data-campo="apoio" data-entrada="aparecer" data-ordem="3">Para quem passa o dia na frente da tela.</p>
    <p class="quando" data-entrada="aparecer" data-ordem="4"><i aria-hidden="true"></i><span data-campo="quando">Na loja a partir de hoje</span></p>
  </div>
</section>
