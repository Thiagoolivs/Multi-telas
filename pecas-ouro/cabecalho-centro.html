<!--
  Cabeçalho centralizado — papel cabeçalho (PLANO §4.7: "quem e agora").
  A marca no centro, como o nome de uma revista; dois filetes saem dela
  para os lados e terminam no clima e na data, à esquerda, e na hora, à
  direita. Para quem vende pelo nome: salão, boutique, restaurante. Medidas
  em cqh: a altura da faixa decide a letra.
-->
<style>
/* Fase 10: no piso da TV o espaço entre as letras (em em) crescia com a letra, e a linha de baixo da marca passava por cima da data. Agora ele é fixo, e nada sai da coluna dele. */
.mt-peca { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 7cqh; padding: 0 3cqw;
  color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: linear-gradient(180deg, var(--mt-fundo-2), var(--mt-fundo)); border-bottom: 1.2cqh solid var(--mt-linha); }
.lado { display: flex; align-items: center; gap: 7cqh; min-width: 0; }
.lado > i { flex: 1; min-width: 1.5cqw; height: 1.2cqh; background: var(--mt-linha); }
.info { display: flex; flex-direction: column; gap: 6cqh; min-width: 0; }
.clima { font: 500 max(var(--mt-piso, 0cqw), 22cqh)/1 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
.data { font: 600 max(var(--mt-piso, 0cqw), 14cqh)/1 var(--mt-fonte-texto); letter-spacing: 2.4cqh; text-transform: uppercase; color: var(--mt-texto-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.marca { display: flex; flex-direction: column; align-items: center; gap: 5cqh; min-width: 0; max-width: 56cqw; }
.logo { height: 60cqh; width: auto; max-width: 30cqw; object-fit: contain; }
.logo[data-sem-foto] { display: none; }
.logo:not([data-sem-foto]) + .nome { display: none; }
.nome { max-width: 100%; font: italic 400 calc(48cqh * var(--mt-escala-titulo, 1))/.95 var(--mt-fonte-titulo); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nome b { font-weight: inherit; color: var(--mt-destaque); }
.sub { max-width: 100%; font: 600 max(var(--mt-piso, 0cqw), 11cqh)/.9 var(--mt-fonte-texto); letter-spacing: 5.5cqh; text-transform: uppercase; color: var(--mt-texto-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hora { font: 400 max(var(--mt-piso, 0cqw), 46cqh)/.9 var(--mt-fonte-titulo); letter-spacing: .02em; }
/* Faixa mais curta (TV em pé): o clima, a data e a linha de baixo da marca saem. */
@container (aspect-ratio < 9) {
  .mt-peca { gap: 5cqh; }
  .info, .sub { display: none; }
  /* D44: o nome no meio, entre a data e a hora — com a fonte larga da marca ele empurrava a hora para fora. */
  .nome { font-size: max(var(--mt-piso, 0cqw), calc(38cqh * var(--mt-escala-titulo, 1))); }
  .hora { font-size: max(var(--mt-piso, 0cqw), 38cqh); }
}
/*
 * A faixa deitada (16:9) com a letra do balcão (4,5%, 48,6 px): as duas linhas
 * empilhadas (o clima e a data; o nome e a linha de baixo) chegavam a 0–4 px
 * da borda. O vão entre elas encolhe o quanto a letra cresceu acima do
 * desenho. Sem piso (a letra do desenho) fica como era; a faixa em pé não
 * muda.
 */
@container (aspect-ratio >= 9) {
  .info { gap: max(0cqh, calc(6cqh - (max(var(--mt-piso, 0cqw), 14cqh) - 14cqh))); }
  .marca { gap: max(0cqh, calc(5cqh - (max(var(--mt-piso, 0cqw), 11cqh) - 11cqh))); }
}
</style>
<section class="mt-peca cabecalho-centro">
  <div class="lado" data-entrada="aparecer" data-ordem="1">
    <span class="info"><span class="clima" data-vivo="clima">24°</span><span class="data" data-vivo="data">Terça · 20 out</span></span>
    <i aria-hidden="true"></i>
  </div>
  <div class="marca" data-entrada="aparecer">
    <img class="logo" data-campo-img="logo" alt="">
    <span class="nome" data-campo="marca">Studio <b>Bella</b></span>
    <span class="sub" data-campo="sub">Cabelo · unhas · estética</span>
  </div>
  <div class="lado" data-entrada="aparecer" data-ordem="1">
    <i aria-hidden="true"></i>
    <span class="hora" data-vivo="relogio">10:20</span>
  </div>
</section>
