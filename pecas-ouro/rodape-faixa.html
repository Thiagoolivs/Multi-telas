<!--
  Faixa fixa com chamada e contato — papel rodapé (PLANO §4.7: "o resto").
  Nada rola: a chamada à esquerda, e os três jeitos de falar com a casa à
  direita, cada um com o rótulo pequeno em cima. Para quem prefere a tela
  quieta — salão, consultório, escritório. Contato deixado em branco some.
  Medidas em cqh: a altura da faixa decide a letra.
-->
<style>
.mt-peca { display: flex; align-items: center; gap: 6cqh; padding: 0 3cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: var(--mt-fundo); border-top: 1.2cqh solid var(--mt-linha); }
/* A chamada quebra em duas linhas quando a fonte da marca é larga (Rota Sul, no balcão): em uma, ela não deixava lugar nem para o primeiro contato. */
.chamada { flex: 0 1 auto; min-width: 0; max-width: 52%; display: flex; align-items: center; gap: 8cqh; font: italic 400 max(var(--mt-piso, 0cqw), 40cqh)/1.02 var(--mt-fonte-titulo); text-wrap: balance; }
.chamada::after { content: ''; display: block; width: 26cqh; height: 1.2cqh; background: var(--mt-destaque); }
/*
 * Reteste 2 (09/11): com a letra do balcão, os três contatos não cabiam ao
 * lado da chamada e passavam por cima dela ("Hora marcada, sem espera" sobre
 * o WhatsApp), e o piso cedia. Agora a lista mostra só o que cabe numa
 * linha: o contato que não cabe desce para a linha de baixo, que a caixa
 * esconde (flex-wrap + overflow, a regra "o que não cabe sai" do
 * js/peca-render.js). O espaço entre as letras do rótulo é fixo (cqh): em em,
 * ele crescia com a letra do piso.
 */
.contatos { flex: 1 1 0; min-width: 0; align-self: stretch; display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: flex-end; overflow: hidden;
  column-gap: 16cqh; list-style: none; margin: 0; padding: 0; }
/* Cada contato tem a altura da faixa: a segunda linha da lista começa onde a caixa termina. */
.contatos li { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: max(0cqh, calc(7cqh - (max(var(--mt-piso, 0cqw), 12cqh) - 12cqh))); white-space: nowrap; }
.contatos li + li { padding-left: 16cqh; border-left: 1.2cqh solid var(--mt-linha); }
.contatos li:has(> span:empty) { display: none; }
.rotulo { font: 600 max(var(--mt-piso, 0cqw), 12cqh)/1.05 var(--mt-fonte-texto); letter-spacing: 3.8cqh; text-transform: uppercase; color: var(--mt-destaque); }
.contatos span { font: 500 max(var(--mt-piso, 0cqw), 24cqh)/1.05 var(--mt-fonte-texto); letter-spacing: .02em; }
/*
 * Faixa curta: o endereço sai, a chamada encolhe. Em pé (8:1) e também a
 * faixa do layout padrão, ao lado da lateral (1390×140, 10:1): ali a
 * chamada passava por cima do WhatsApp. A faixa de 16:1 não muda.
 */
@container (aspect-ratio < 12) {
  /* Com a fonte da marca, que pode ser mais larga que a condensada (--mt-escala-titulo). */
  .chamada { font-size: max(var(--mt-piso, 0cqw), calc(32cqh * var(--mt-escala-titulo, 1))); gap: 5cqh; }
  .chamada::after { width: 14cqh; }
  .contatos { gap: 10cqh; }
  .contatos li + li { padding-left: 10cqh; }
  .contatos li:last-child { display: none; }
  .rotulo { font-size: max(var(--mt-piso, 0cqw), 11cqh); }
  .contatos span { font-size: max(var(--mt-piso, 0cqw), 20cqh); }
}
</style>
<section class="mt-peca rodape-faixa">
  <p class="chamada" data-campo="chamada" data-entrada="esquerda">Hora marcada, sem espera</p>
  <ul class="contatos" data-entrada="aparecer" data-ordem="1">
    <li><b class="rotulo" data-campo="rotulo1">WhatsApp</b><span data-campo="contato1">(11) 98888-0000</span></li>
    <li><b class="rotulo" data-campo="rotulo2">Instagram</b><span data-campo="contato2">@studiobella</span></li>
    <li><b class="rotulo" data-campo="rotulo3">Endereço</b><span data-campo="contato3">Rua Oscar Freire, 900</span></li>
  </ul>
</section>
