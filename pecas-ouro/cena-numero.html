<!--
  O número sobre a faixa — família institucional (lote 5, arquétipo A4, docs/design/SISTEMA-VISUAL.md).
  O laço da fábrica (a solda, a fresa) em cima; embaixo, uma faixa de fundo
  cheio sobe por cima dele com um fio da cor de destaque na borda, e o
  número enorme conta até o valor. O número é o maior texto (D44); o
  rótulo diz o que ele conta. A faixa larga de cima pede laço deitado.
-->
<style>
.mt-peca { --f: 2.6cqw; --t: 4.2cqw; --n: 16cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo); }
.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }
.faixa { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: auto 1fr; align-items: end; gap: 5cqw; padding: 4cqh 6cqw 7cqh; background: var(--mt-fundo); }
.faixa > i { position: absolute; left: 0; right: 0; top: 0; height: .3cqw; background: var(--mt-destaque); }
.numero { font: 500 max(var(--mt-piso, 0cqw), calc(var(--n) * var(--mt-escala-titulo, 1)))/1.15 var(--mt-fonte-titulo); letter-spacing: -.03em; white-space: nowrap; }
.texto { min-width: 0; padding-bottom: 2.4cqh; }
.kicker { font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.1 var(--mt-fonte-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--mt-destaque); }
.rotulo { margin-top: 1.6cqh; font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/1.05 var(--mt-fonte-titulo); text-wrap: balance; }
.contexto { margin-top: 2cqh; font: 400 max(var(--mt-piso, 0cqw), var(--f))/1.3 var(--mt-fonte-texto); color: var(--mt-texto-suave); text-wrap: pretty; }

@container ((aspect-ratio >= 1.25) and (max-height: 900px)) or ((aspect-ratio >= 1.25) and (aspect-ratio < 1.6) and (max-height: 940px)) {
  .mt-peca { --f: 3.5cqw; --t: 4.4cqw; --n: 15cqw; }
  .faixa { gap: 4cqw; padding: 3cqh 5cqw 8cqh; }
  .kicker { letter-spacing: .06em; }
  .contexto { display: none; }
}
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { --f: 4.8cqw; --t: 5.4cqw; --n: 14cqw; }
  .faixa { padding: 2.4cqh 5cqw 8cqh; }
  .kicker { display: none; }
  .rotulo { margin-top: 0; }
}
/* Em pé: o vídeo em cima; a faixa empilha o número e o rótulo. */
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.6cqw; --t: 7.4cqw; --n: 28cqw; }
  .foto { height: 54%; }
  .faixa { min-height: 46%; grid-template-columns: 1fr; align-items: start; align-content: center; gap: 2.6cqh; padding: 5cqh 7cqw 6cqh; }
  .faixa > i { height: .5cqw; }
  .texto { padding-bottom: 0; }
  .kicker { letter-spacing: .1em; }
  .numero { grid-row: 2; }
  .texto { display: contents; }
  .kicker { grid-row: 1; }
  .rotulo { grid-row: 3; margin-top: 0; }
  .contexto { grid-row: 4; margin-top: 0; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --t: 6cqw; --n: 22cqw; }
  .foto { height: 48%; }
  .faixa { min-height: 52%; gap: 2cqh; padding: 4cqh 7cqw 5cqh; }
  .contexto { display: none; }
}
/* A lateral: o vídeo, o número e o rótulo. */
@container (max-width: 700px) {
  .mt-peca { --f: 9.6cqw; --t: 11cqw; --n: 26cqw; }
  .foto { height: 44%; }
  .faixa { min-height: 56%; gap: 1.6cqh; padding: 3cqh 8cqw 4cqh; }
  .faixa > i { height: 1cqw; }
  .kicker, .contexto { display: none; }
  .rotulo { line-height: 1.02; }
}
</style>
<section class="mt-peca cena-numero">
  <img class="foto" data-campo-img="foto" alt="" data-entrada="aproximar" data-continua="kenburns">
  <div class="faixa" data-entrada="varrer" data-origem="baixo" data-ordem="1">
    <i aria-hidden="true" data-entrada="desenhar" data-ordem="3"></i>
    <p class="numero" data-campo="numero" data-entrada="contar" data-ordem="6">18.450</p>
    <div class="texto">
      <p class="kicker" data-campo="kicker" data-entrada="aparecer" data-ordem="5">Produção do mês</p>
      <p class="rotulo" data-campo="rotulo" data-entrada="revelar" data-ordem="7">peças entregues no prazo</p>
      <p class="contexto" data-campo="contexto" data-entrada="aparecer" data-ordem="10">Meta de 17.000 superada. Obrigado, equipe.</p>
    </div>
  </div>
</section>
