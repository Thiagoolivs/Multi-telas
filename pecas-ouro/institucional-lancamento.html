<!--
  Lançamento — família institucional. Destaque.
  Produto novo, coleção nova, sabor novo: o "novo" é a notícia. Ele vem
  num carimbo inclinado, o nome do produto vem enorme, e a data de
  chegada fecha a peça. Sem foto de propósito — a versão com foto é outra
  estrutura; esta funciona antes de o produto existir para fotografar.
-->
<style>
.mt-peca { color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(80% 110% at 85% 40%, var(--mt-fundo-2), var(--mt-fundo) 64%); }
.marca-nome { position: absolute; left: 6cqw; top: 6cqh; font: 700 max(var(--mt-piso, 0cqw), 1.25cqw)/1 var(--mt-fonte-texto); letter-spacing: .42em; text-transform: uppercase; }
.carimbo { position: absolute; left: 6cqw; top: 19cqh; padding: 1cqw 2.2cqw .9cqw; border: .3cqw solid var(--mt-destaque); border-radius: calc(var(--mt-raio) * .6);
  color: var(--mt-destaque); font: 400 max(var(--mt-piso, 0cqw), calc(3.2cqw * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: .14em; text-transform: uppercase; rotate: -6deg; }
.bloco { position: absolute; left: 6cqw; right: 6cqw; top: 34cqh; }
h1 { font: 400 max(var(--mt-piso, 0cqw), calc(13cqw * var(--mt-escala-titulo, 1)))/.88 var(--mt-fonte-titulo); text-transform: uppercase; letter-spacing: -.005em; }
/* Cada campo numa linha; se a fonte da marca for larga, quebra em vez de vazar (em pé, "DE COSTELA" passava 91px da borda). */
/* Reteste 2: o nome e o carimbo seguem a largura da fonte (--mt-escala-titulo): na letra padrão, a da conta que não escolheu fonte, o nome ia em três linhas, por baixo do carimbo e por cima do apoio. */
h1 span, h1 em { display: block; text-wrap: balance; }
h1 em { font-style: normal; color: var(--mt-destaque); }
.apoio { margin-top: 3cqw; font: 400 max(var(--mt-piso, 0cqw), 1.7cqw)/1.5 var(--mt-fonte-texto); color: var(--mt-texto-suave); max-width: 52cqw; text-wrap: pretty; }
.chega { position: absolute; left: 6cqw; right: 6cqw; bottom: 8cqh; display: flex; align-items: center; gap: 2cqw; }
.chega i { flex: 1; height: .14cqw; background: var(--mt-linha); }
.chega span { font: 700 max(var(--mt-piso, 0cqw), 1.5cqw)/1 var(--mt-fonte-texto); letter-spacing: .3em; text-transform: uppercase; white-space: nowrap; }
/* Deitada: o carimbo vai para a direita, grande e virado para o outro lado — contrapeso do nome. */
@container (aspect-ratio >= 1.25) {
  /* Reteste 2: no alto, acima do nome — à altura dele, o carimbo pousava em cima de um nome comprido ("NOVO SISTEMA"). */
  .carimbo { left: auto; right: 9cqw; top: 7cqh; font-size: max(var(--mt-piso, 0cqw), calc(5.6cqw * var(--mt-escala-titulo, 1))); padding: 1.6cqw 3.4cqw 1.4cqw; border-width: .4cqw; rotate: 7deg; }
  .bloco { top: 26cqh; }
  .apoio { margin-top: 2.4cqw; line-height: 1.35; max-width: 72cqw; }
  .chega { bottom: 6cqh; }
}
/*
 * A principal do Corporativo com a margem contra o corte (de 1321×739 a
 * 1236×674): com a letra do balcão o apoio descia por cima da data. O nome
 * do produto fica um pouco menor, o bloco sobe e o apoio usa a largura
 * toda (duas linhas).
 */
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 775px) {
  .marca-nome { letter-spacing: .24em; }
  /* O carimbo fica onde estava (no alto, ele encostava no nome da marca com a letra do balcão): aqui o nome do produto é menor e não chega a ele. */
  .carimbo { top: 24cqh; }
  .bloco { top: 23cqh; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(11cqw * var(--mt-escala-titulo, 1))); }
  .apoio { margin-top: 2cqw; max-width: none; line-height: 1.25; }
}
@container (aspect-ratio < 0.8) {
  .marca-nome { left: 8cqw; right: 8cqw; top: 5cqh; font-size: max(var(--mt-piso, 0cqw), 2.2cqw); letter-spacing: .2em; }
  .carimbo { left: 8cqw; top: 20cqh; font-size: max(var(--mt-piso, 0cqw), calc(7cqw * var(--mt-escala-titulo, 1))); padding: 2.2cqw 4.4cqw 2cqw; border-width: .5cqw; }
  .bloco { left: 8cqw; right: 8cqw; top: 32cqh; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(18cqw * var(--mt-escala-titulo, 1))); }
  .apoio { margin-top: 5cqw; font-size: max(var(--mt-piso, 0cqw), 3.8cqw); max-width: none; }
  .chega { left: 8cqw; right: 8cqw; bottom: 6cqh; gap: 3cqw; }
  .chega i { height: .25cqw; }
  .chega span { font-size: max(var(--mt-piso, 0cqw), 2.8cqw); white-space: normal; line-height: 1.4; }
}
/*
 * Quadrada. Com a fonte de título larga (Clínica Vida, Studio Bella, Rota
 * Sul…), "DE COSTELA" não cabe numa linha e o nome vai em três; com a letra
 * do balcão o apoio também vai em três, e a última encostava na data. O
 * bloco sobe um pouco, o apoio aperta a entrelinha e a data desce para
 * perto da margem: as três linhas de cada um cabem.
 */
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .marca-nome { left: 7cqw; top: 5cqh; font-size: max(var(--mt-piso, 0cqw), 1.8cqw); }
  .carimbo { left: 7cqw; top: 14cqh; font-size: max(var(--mt-piso, 0cqw), calc(4.4cqw * var(--mt-escala-titulo, 1))); padding: 1.4cqw 3cqw 1.2cqw; border-width: .4cqw; }
  .bloco { left: 7cqw; right: 7cqw; top: 27cqh; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(16cqw * var(--mt-escala-titulo, 1))); }
  .apoio { margin-top: 2.4cqw; font-size: max(var(--mt-piso, 0cqw), 2.4cqw); line-height: 1.3; max-width: none; }
  .chega { left: 7cqw; right: 7cqw; bottom: 6cqh; }
  .chega i { height: .2cqw; }
  .chega span { font-size: max(var(--mt-piso, 0cqw), 2cqw); }
}
</style>
<section class="mt-peca institucional-lancamento">
  <div class="marca-nome" data-campo="marca" data-repete="marca">Lanchonete da Praça</div>
  <p class="carimbo" data-campo="selo" data-entrada="estourar" data-ordem="3">Novidade</p>
  <div class="bloco">
    <h1 data-entrada="subir" data-ordem="1"><span data-campo="titulo">Burger</span><em data-campo="titulo2">de costela</em></h1>
    <p class="apoio" data-campo="apoio" data-entrada="aparecer" data-ordem="2">Costela desfiada no pão de brioche, com queijo coalho e cebola caramelizada.</p>
  </div>
  <div class="chega" data-entrada="aparecer" data-ordem="4"><span data-campo="quando">A partir de sexta, 25</span><i aria-hidden="true"></i></div>
</section>
