<!--
  Delivery com QR — família social. Destaque e lateral.
  "Entregamos" dito pelo desenho: um pino de mapa no fim de um caminho
  tracejado (CSS), e o QR que abre a conversa para pedir. As condições
  (taxa, tempo) numa linha; o telefone embaixo do QR para quem prefere
  digitar. Sem link, o QR e a moldura dele somem.
-->
<style>
.mt-peca { overflow-wrap: break-word; display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 6cqw; padding: 8cqmin 7cqw;
  color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(110% 110% at 100% 100%, var(--mt-fundo-2), var(--mt-fundo) 62%); }
/* O caminho até o pino: 10em × 3em, a linha tracejada e o pino no fim. */
.rota { position: relative; display: block; width: 10em; height: 3.2em; font-size: 3.4cqmin; }
.rota::before { content: ''; position: absolute; left: .4em; right: 2em; top: 2.4em; height: .3em;
  background: repeating-linear-gradient(90deg, var(--mt-destaque) 0 .7em, transparent .7em 1.2em); }
.rota::after { content: ''; position: absolute; left: 0; top: 2.15em; width: .8em; height: .8em; border-radius: 50%; background: var(--mt-destaque); }
.pino { position: absolute; right: .3em; top: 0; width: 2em; height: 2em; border-radius: 50% 50% 50% 0; background: var(--mt-destaque); transform: rotate(-45deg); }
.pino::after { content: ''; position: absolute; left: .6em; top: .6em; width: .8em; height: .8em; border-radius: 50%; background: var(--mt-fundo); }
.kicker { margin-top: 3cqmin; font: 700 max(var(--mt-piso, 0cqw), 4cqmin)/1.15 var(--mt-fonte-texto); letter-spacing: .08em; text-transform: uppercase; color: var(--mt-preco); }
h1 { margin-top: 2.4cqmin; font: 700 max(var(--mt-piso, 0cqw), calc(12.6cqmin * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.01em; text-wrap: balance; }
.apoio { margin-top: 4cqmin; font: 600 max(var(--mt-piso, 0cqw), 5cqmin)/1.3 var(--mt-fonte-texto); color: var(--mt-texto-suave); max-width: 20em; text-wrap: pretty; }
.pedir { display: flex; flex-direction: column; align-items: center; text-align: center; }
.qr { margin: 0; width: 46cqmin; padding: 2cqmin; border-radius: var(--mt-raio); background: var(--mt-superficie); box-shadow: 0 0 0 .8cqmin var(--mt-destaque); }
.qr img { width: 100%; aspect-ratio: 1; }
.pedir:has(img[data-sem-foto]) .qr { display: none; }
.cta { margin-top: 3.4cqmin; font: 700 max(var(--mt-piso, 0cqw), 4.6cqmin)/1.2 var(--mt-fonte-texto); max-width: 50cqmin; }
.contato { margin-top: 1.4cqmin; font: 700 max(var(--mt-piso, 0cqw), 5cqmin)/1.1 var(--mt-fonte-texto); color: var(--mt-preco); white-space: nowrap; }
.contato:empty { display: none; }
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 860px) {
  .mt-peca { column-gap: 5cqw; padding: 7cqmin 6cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(10.4cqmin * var(--mt-escala-titulo, 1))); }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 4.6cqmin); }
  .qr { width: 40cqmin; }
  .cta { font-size: max(var(--mt-piso, 0cqw), 4.2cqmin); }
}
/* Em pé: o caminho e o título em cima, o QR no meio, o telefone embaixo. */
@container (aspect-ratio < 1.25) {
  .mt-peca { grid-template-columns: 1fr; align-content: center; justify-items: center; row-gap: 7cqmin; padding: 8cqmin 8cqw; }
  .texto { justify-self: stretch; }
  .rota { font-size: 4cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(13cqw * var(--mt-escala-titulo, 1))); }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 5.4cqw); max-width: none; }
  .qr { width: 50cqw; }
  .cta { max-width: none; font-size: max(var(--mt-piso, 0cqw), 5cqw); }
  .contato { font-size: max(var(--mt-piso, 0cqw), 5.6cqw); }
}
@container (aspect-ratio < 0.8) and (min-width: 701px) {
  .mt-peca { row-gap: 10cqw; }
  .rota { font-size: 5cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 4.8cqw); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(15cqw * var(--mt-escala-titulo, 1))); }
  .apoio { margin-top: 5cqw; font-size: max(var(--mt-piso, 0cqw), 6.2cqw); }
  .qr { width: 56cqw; }
  .cta { margin-top: 5cqw; font-size: max(var(--mt-piso, 0cqw), 5.8cqw); }
  .contato { font-size: max(var(--mt-piso, 0cqw), 6.4cqw); }
}
/* Quase quadrada: o texto à esquerda e o QR à direita, menores. */
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { grid-template-columns: 1fr auto; justify-items: stretch; column-gap: 5cqw; padding: 7cqmin 7cqw; }
  .rota { font-size: 2.8cqmin; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 3.8cqmin); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(10cqmin * var(--mt-escala-titulo, 1))); }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 4.4cqmin); }
  .qr { width: 34cqmin; padding: 1.6cqmin; }
  .cta { max-width: 36cqmin; font-size: max(var(--mt-piso, 0cqw), 4cqmin); }
  .contato { font-size: max(var(--mt-piso, 0cqw), 4.2cqmin); }
}
/* A lateral: o título, o QR e o telefone; as condições saem. */
@container (max-width: 700px) {
  .rota { font-size: 5cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 5.8cqw); letter-spacing: .04em; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(12cqw * var(--mt-escala-titulo, 1))); }
  .apoio { display: none; }
  .qr { width: 56cqw; }
  .cta { font-size: max(var(--mt-piso, 0cqw), 6.2cqw); }
  .contato { font-size: max(var(--mt-piso, 0cqw), 6.8cqw); }
}
/* Deitada e baixa: o título e o QR; o caminho e as condições saem. */
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { padding: 5cqmin 6cqw; }
  .rota, .apoio, .cta { display: none; }
  .kicker { margin-top: 0; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(13cqmin * var(--mt-escala-titulo, 1))); }
  .qr { width: 56cqmin; }
}
/*
 * A lateral da TV com a margem contra o corte de 3,5% ou mais (a caixa
 * abaixo de 640 px): com a letra do balcão o contato passava do pé. A rota
 * desenhada encolhe e os respiros apertam; o QR não encolhe.
 */
@container (max-width: 700px) and (max-height: 640px) {
  .rota { font-size: 3.4cqw; }
  .kicker { margin-top: 1.6cqmin; }
  h1 { margin-top: 1.4cqmin; }
  .cta { margin-top: 2cqmin; line-height: 1.1; }
  .contato { margin-top: .6cqmin; }
}
</style>
<section class="mt-peca social-delivery">
  <div class="texto">
    <span class="rota" aria-hidden="true" data-entrada="esquerda"><span class="pino"></span></span>
    <p class="kicker" data-campo="kicker" data-entrada="aparecer" data-ordem="1">Delivery</p>
    <h1 data-campo="titulo" data-entrada="subir" data-ordem="2">Entregamos no bairro</h1>
    <p class="apoio" data-campo="apoio" data-entrada="aparecer" data-ordem="3">Taxa grátis acima de R$ 50 · em até 40 minutos</p>
  </div>
  <div class="pedir" data-entrada="crescer" data-ordem="4">
    <figure class="qr"><img data-campo-qr="link" alt="QR para pedir pelo WhatsApp"></figure>
    <p class="cta" data-campo="cta">Peça pelo WhatsApp</p>
    <p class="contato" data-campo="contato">(11) 99999-0000</p>
  </div>
</section>
