<!--
  Oferta com foto — família oferta. Serve no destaque e na lateral.
  Primeira peça da biblioteca-ouro: a "Oferta com foto" da amostra que o dono
  aprovou como estilo (20/10). Formato do arquivo: um <style> e uma
  <section class="mt-peca">. Lido por MTPecaHtml.doArquivo.
-->
<style>
.mt-peca { color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(120% 100% at 0% 0%, var(--mt-fundo-2), var(--mt-fundo) 62%); }
.foto { position: absolute; inset: 0 0 0 auto; width: 64%; height: 100%; object-fit: cover; object-position: 50% 28%; }
.veu { position: absolute; inset: 0; background: linear-gradient(90deg, var(--mt-fundo) 48%, var(--mt-fundo-0) 72%); }
.marca-nome { position: absolute; left: 6cqw; top: 6cqh; font: 600 max(var(--mt-piso, 0cqw), 1.25cqw)/1 var(--mt-fonte-texto); letter-spacing: .42em; text-transform: uppercase; }
/*
 * Centrado numa FAIXA abaixo do nome da marca, não no meio da peça: com
 * fonte larga o "30% OFF" quebra em duas linhas, o bloco cresce, e centrado
 * no meio ele subia por cima da marca. `safe center` deixa crescer para
 * baixo quando não cabe. Com a ótica, o texto fica onde estava (±2px).
 */
.bloco { position: absolute; left: 6cqw; top: 12cqh; bottom: 19.5cqh; width: 46cqw; display: flex; flex-direction: column; justify-content: center; justify-content: safe center; }
.kicker { display: flex; align-items: center; gap: 1.1cqw; font: 600 max(var(--mt-piso, 0cqw), 1.25cqw)/1.15 var(--mt-fonte-texto); letter-spacing: .1em; text-transform: uppercase; color: var(--mt-destaque); }
.kicker i { display: block; width: 3.6cqw; height: .14cqw; background: var(--mt-destaque); }
h1 { font: 400 max(var(--mt-piso, 0cqw), 4.4cqw)/1 var(--mt-fonte-titulo); text-transform: uppercase; margin: 1.6cqw 0 2cqw; }
h1 > span { display: block; }
h1 em { display: block; font-style: normal; font-size: max(var(--mt-piso, 0cqw), calc(2em * var(--mt-escala-titulo, 1))); line-height: .92; color: var(--mt-destaque); }
.apoio { font: 400 max(var(--mt-piso, 0cqw), 1.5cqw)/1.4 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
.preco { margin-top: 1.8cqw; padding-top: 1.8cqw; border-top: .12cqw solid var(--mt-linha); width: 40cqw; display: flex; align-items: flex-end; justify-content: space-between; }
.de { font: 500 max(var(--mt-piso, 0cqw), 1.05cqw)/1.2 var(--mt-fonte-texto); letter-spacing: .12em; text-transform: uppercase; color: var(--mt-texto-suave); }
.parc { display: block; margin-top: .6cqw; font: 500 max(var(--mt-piso, 0cqw), 1.25cqw)/1 var(--mt-fonte-texto); color: var(--mt-texto); letter-spacing: 0; text-transform: none; }
.valor { font: 400 max(var(--mt-piso, 0cqw), 6.2cqw)/.8 var(--mt-fonte-titulo); color: var(--mt-preco); white-space: nowrap; }
.valor small { font-size: max(var(--mt-piso, 0cqw), .34em); vertical-align: 1.05em; margin-right: .2em; }
.valor sup { font-size: max(var(--mt-piso, 0cqw), .38em); vertical-align: 1em; }
.cta { position: absolute; left: 6cqw; bottom: 6cqh; font: 600 max(var(--mt-piso, 0cqw), 1.2cqw)/1 var(--mt-fonte-texto); letter-spacing: .14em; text-transform: uppercase; padding-bottom: .7cqw; border-bottom: .12cqw solid var(--mt-destaque); }
@container (aspect-ratio < 1) {
  .foto { inset: 0 0 auto 0; width: 100%; height: 56%; object-position: 50% 18%; }
  /* D44: a marca fica no alto, sobre a foto — o véu de cima é o que a deixa ler com qualquer foto. */
  /* Com a letra da TV o rótulo sobe até a borda da foto: o véu de baixo sobe junto. */
  .veu { background: linear-gradient(180deg, var(--mt-fundo) 0%, var(--mt-fundo-0) 14%), linear-gradient(0deg, var(--mt-fundo) 54%, var(--mt-fundo-0) 66%); }
  .marca-nome { left: 8cqw; top: 4cqh; font-size: max(var(--mt-piso, 0cqw), 2.6cqw); }
  .bloco { display: block; left: 8cqw; right: 8cqw; width: auto; top: auto; bottom: 11cqh; transform: none; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 2.6cqw); }
  .kicker i { width: 7cqw; height: .3cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 8.4cqw); margin: 4cqw 0 3cqw; }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 3.4cqw); max-width: none; }
  .preco { width: 100%; margin-top: 5cqw; padding-top: 4.4cqw; border-top-width: .25cqw; }
  .de { font-size: max(var(--mt-piso, 0cqw), 2.3cqw); }
  .valor { font-size: max(var(--mt-piso, 0cqw), 14cqw); }
  .parc { font-size: max(var(--mt-piso, 0cqw), 2.8cqw); margin-top: 1.4cqw; }
  .cta { left: 8cqw; bottom: 5cqh; font-size: max(var(--mt-piso, 0cqw), 2.5cqw); border-bottom-width: .25cqw; }
}
/* Quase quadrada (1:1, o destaque da Vertical em pilha): foto em cima, texto embaixo. */
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  /* Com a letra da TV o texto ocupa mais: a foto fica com o terço de cima. */
  .foto { inset: 0 0 auto 0; width: 100%; height: 32%; object-position: 50% 40%; }
  .veu { background: linear-gradient(180deg, var(--mt-fundo) 0%, var(--mt-fundo-0) 18%), linear-gradient(0deg, var(--mt-fundo) 70%, var(--mt-fundo-0) 80%); }
  .marca-nome { left: 7cqw; top: 5cqh; font-size: max(var(--mt-piso, 0cqw), 1.8cqw); }
  .bloco { display: block; left: 7cqw; right: 7cqw; width: auto; top: auto; bottom: 14cqh; transform: none; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 1.9cqw); }
  .kicker i { width: 5cqw; height: .2cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 6.2cqw); margin: 2cqw 0 2cqw; }
  h1 em { font-size: max(var(--mt-piso, 0cqw), calc(2.1em * var(--mt-escala-titulo, 1))); }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 2.3cqw); max-width: none; }
  .preco { width: 100%; margin-top: 2.4cqw; padding-top: 2.2cqw; border-top-width: .18cqw; }
  .de { font-size: max(var(--mt-piso, 0cqw), 1.6cqw); }
  .valor { font-size: max(var(--mt-piso, 0cqw), 9.6cqw); }
  .parc { font-size: max(var(--mt-piso, 0cqw), 2cqw); margin-top: 1cqw; }
  .cta { left: 7cqw; bottom: 5cqh; font-size: max(var(--mt-piso, 0cqw), 1.8cqw); border-bottom-width: .18cqw; }
}
/*
 * A lateral estreita: menos texto e o que fica, maior. Ela ocupa um quarto
 * da parede — a mesma letra da tela cheia some lá de longe.
 */
@container (max-width: 700px) {
  /*
   * D44: aqui o "30% OFF" em duas linhas sobe até um terço da altura, e
   * passava por cima dos óculos da foto (o detector mediu 1,2:1). A foto
   * fica com o terço de cima e o véu cobre o resto.
   */
  .foto { height: 38%; object-position: 50% 36%; }
  .veu { background: linear-gradient(180deg, var(--mt-fundo) 0%, var(--mt-fundo-0) 12%), linear-gradient(0deg, var(--mt-fundo) 64%, var(--mt-fundo-0) 74%); }
  .apoio, .parc { display: none; }
  .marca-nome { font-size: max(var(--mt-piso, 0cqw), 3.2cqw); letter-spacing: .32em; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 3.4cqw); letter-spacing: .22em; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 10.5cqw); }
  .valor { font-size: max(var(--mt-piso, 0cqw), 17cqw); }
  .de { font-size: max(var(--mt-piso, 0cqw), 3cqw); letter-spacing: .1em; }
  /* Com a letra da TV a chamada quebra em duas linhas: o bloco sobe para dar lugar a ela. */
  .bloco { bottom: 16cqh; }
  .cta { font-size: max(var(--mt-piso, 0cqw), 3.2cqw); letter-spacing: .08em; right: 8cqw; line-height: 1.2; }
}
</style>
<section class="mt-peca oferta-foto">
  <img class="foto" data-campo-img="foto" alt="" data-entrada="aparecer">
  <div class="veu" aria-hidden="true"></div>
  <div class="marca-nome" data-campo="marca" data-repete="marca">Ótica <b>Central</b></div>
  <div class="bloco">
    <p class="kicker" data-entrada="esquerda" data-ordem="1"><i aria-hidden="true"></i><span data-campo="kicker">Semana do sol · até sábado</span></p>
    <h1 data-entrada="subir" data-ordem="2"><span data-campo="titulo">Óculos de sol</span><em data-campo="oferta">30% off</em></h1>
    <p class="apoio" data-campo="apoio" data-entrada="aparecer" data-ordem="3">Proteção UV400 e garantia de um ano em todas as armações da vitrine.</p>
    <div class="preco" data-entrada="subir" data-ordem="4">
      <span class="de"><span data-campo="preco-rotulo">a partir de</span><span class="parc" data-campo="parcelas">ou 10× de R$ 18,99</span></span>
      <span class="valor"><small aria-hidden="true">R$</small><span data-campo="preco">189</span><sup data-campo="centavos">,90</sup></span>
    </div>
  </div>
  <div class="cta" data-entrada="aparecer" data-ordem="5"><span data-campo="cta">Reserve pelo WhatsApp</span> <span aria-hidden="true">→</span></div>
</section>
