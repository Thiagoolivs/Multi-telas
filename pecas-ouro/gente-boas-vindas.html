<!--
  Boas-vindas — família gente. Destaque.
  Quem chegou, para qual time e uma curiosidade — o empurrão para alguém
  puxar conversa no café. O retrato (ou as iniciais) fica num recorte
  quadrado arredondado, o "boas-vindas" vai grande com o primeiro nome.
-->
<style>
.mt-peca { color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(100% 100% at 0% 100%, var(--mt-fundo-2), var(--mt-fundo) 62%); }
.marca-nome { position: absolute; left: 6cqw; top: 6cqh; font: 700 1.25cqw/1 var(--mt-fonte-texto); letter-spacing: .42em; text-transform: uppercase; }
.retrato { position: absolute; right: 8cqw; top: 50%; translate: 0 -50%; width: 30cqw; height: 30cqw; margin: 0; border-radius: calc(var(--mt-raio) * 2.4); overflow: hidden;
  background: var(--mt-superficie); box-shadow: 1.4cqw 1.4cqw 0 0 var(--mt-destaque); }
.retrato img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.iniciais { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 12cqw/1 var(--mt-fonte-titulo); color: var(--mt-destaque); }
.bloco { position: absolute; left: 6cqw; top: 50%; transform: translateY(-50%); width: 48cqw; }
.kicker { display: flex; align-items: center; gap: 1.1cqw; font: 700 1.3cqw/1 var(--mt-fonte-texto); letter-spacing: .3em; text-transform: uppercase; color: var(--mt-destaque); }
.kicker i { display: block; width: 3.6cqw; height: .16cqw; background: var(--mt-destaque); }
h1 { margin-top: 2.2cqw; font: 600 6.6cqw/1 var(--mt-fonte-titulo); letter-spacing: -.025em; }
h1 span, h1 em { display: block; white-space: nowrap; }
h1 em { font-style: normal; color: var(--mt-destaque); }
.cargo { margin-top: 2.4cqw; font: 600 2cqw/1.3 var(--mt-fonte-texto); }
.curioso { margin-top: 2.4cqw; padding-top: 2.2cqw; border-top: .14cqw solid var(--mt-linha); font: 400 1.6cqw/1.5 var(--mt-fonte-texto); color: var(--mt-texto-suave); text-wrap: pretty; }
.curioso b { display: block; margin-bottom: .6cqw; font: 700 1.1cqw/1 var(--mt-fonte-texto); letter-spacing: .26em; text-transform: uppercase; color: var(--mt-texto); }
@container (aspect-ratio < 0.8) {
  .marca-nome { left: 8cqw; top: 5cqh; font-size: 2.2cqw; }
  .retrato { left: 8cqw; right: auto; top: 11cqh; translate: none; width: 52cqw; height: 52cqw; box-shadow: 2.4cqw 2.4cqw 0 0 var(--mt-destaque); }
  .iniciais { font-size: 22cqw; }
  .bloco { left: 8cqw; right: 8cqw; width: auto; top: auto; bottom: 8cqh; transform: none; }
  .kicker { font-size: 2.4cqw; }
  .kicker i { width: 6cqw; height: .28cqw; }
  h1 { font-size: 12cqw; margin-top: 4cqw; }
  .cargo { font-size: 3.6cqw; margin-top: 4cqw; }
  .curioso { font-size: 3cqw; margin-top: 4.4cqw; padding-top: 4cqw; border-top-width: .25cqw; }
  .curioso b { font-size: 2.2cqw; margin-bottom: 1.2cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .marca-nome { left: 7cqw; top: 5cqh; font-size: 1.8cqw; }
  .retrato { right: 7cqw; top: 8cqh; translate: none; width: 30cqw; height: 30cqw; }
  .iniciais { font-size: 12cqw; }
  .bloco { left: 7cqw; right: 7cqw; width: auto; top: auto; bottom: 7cqh; transform: none; }
  .kicker { font-size: 2cqw; }
  .kicker i { width: 5cqw; height: .22cqw; }
  h1 { font-size: 9cqw; margin-top: 3cqw; }
  .cargo { font-size: 2.8cqw; margin-top: 3cqw; }
  .curioso { font-size: 2.3cqw; margin-top: 3cqw; padding-top: 2.8cqw; }
  .curioso b { font-size: 1.7cqw; }
}
</style>
<section class="mt-peca gente-boas-vindas">
  <div class="marca-nome" data-campo="marca" data-repete="marca">Rota Sul</div>
  <figure class="retrato" data-entrada="crescer" data-ordem="2"><span class="iniciais" data-campo="iniciais">LP</span><img data-campo-img="foto" alt=""></figure>
  <div class="bloco">
    <p class="kicker" data-entrada="esquerda"><i aria-hidden="true"></i><span data-campo="kicker">Chegou no time</span></p>
    <h1 data-entrada="subir" data-ordem="1"><span data-campo="titulo">Boas-vindas,</span><em data-campo="nome">Lucas!</em></h1>
    <p class="cargo" data-campo="cargo" data-entrada="aparecer" data-ordem="3">Analista de Compras · a partir desta segunda</p>
    <p class="curioso" data-entrada="aparecer" data-ordem="4"><b data-campo="curioso-rotulo">Puxa conversa</b><span data-campo="curioso">Já percorreu a Estrada Real inteira de bicicleta.</span></p>
  </div>
</section>
