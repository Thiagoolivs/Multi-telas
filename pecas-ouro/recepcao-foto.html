<!--
  Boas-vindas da recepção — família institucional (lote 4, arquétipos A1 + A6).
  A tela da sala de espera: "Bem-vindo" grande, uma linha de acolhida, e
  a hora e a data vivas (data-vivo) sob um filete — a TV conta sozinha.
  A foto do lugar ocupa a coluna da direita em corte seco. Sem preço:
  serve à clínica, ao escritório e à loja.
-->
<style>
.mt-peca { --f: 2.6cqw; --t: 8.4cqw; --h: 5cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo); display: grid; grid-template-columns: 56fr 44fr; }
.texto { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 8cqh 5cqw 8cqh 6cqw; }
.foto { width: 100%; height: 100%; min-height: 0; object-fit: cover; object-position: 50% 50%; }
.kicker { font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.1 var(--mt-fonte-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--mt-destaque); }
h1 { margin-top: 2cqh; font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/.98 var(--mt-fonte-titulo); letter-spacing: -.02em; }
.apoio { margin-top: 3cqh; font: 400 max(var(--mt-piso, 0cqw), var(--f))/1.3 var(--mt-fonte-texto); color: var(--mt-texto-suave); text-wrap: pretty; }
.agora { margin-top: 5cqh; padding-top: 2.4cqh; border-top: .14cqw solid var(--mt-linha); display: flex; align-items: baseline; gap: 3cqw; flex-wrap: wrap; }
.hora { font: 500 max(var(--mt-piso, 0cqw), calc(var(--h) * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); }
.data { font: 500 max(var(--mt-piso, 0cqw), var(--f))/1.2 var(--mt-fonte-texto); color: var(--mt-texto-suave); }

@container (aspect-ratio >= 1.25) and (max-height: 900px) {
  .mt-peca { --f: 3.5cqw; --t: 8cqw; --h: 5.4cqw; grid-template-columns: 60fr 40fr; }
  .texto { padding: 6cqh 4cqw 6cqh 5cqw; }
  .kicker { letter-spacing: .06em; }
  .apoio { display: none; }
  .agora { margin-top: 4cqh; }
}
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.6cqw; --t: 14cqw; --h: 9cqw; grid-template-columns: 1fr; grid-template-rows: 40fr 60fr; }
  .foto { grid-row: 1; }
  .texto { grid-row: 2; padding: 5cqh 7cqw 6cqh; }
  .agora { border-top-width: .24cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --t: 11cqw; --h: 7cqw; grid-template-columns: 58fr 42fr; grid-template-rows: 1fr; }
  .foto, .texto { grid-row: 1; }
  .texto { padding: 6cqh 4cqw 6cqh 6cqw; }
  .apoio { display: none; }
}
</style>
<section class="mt-peca recepcao-foto">
  <div class="texto">
    <p class="kicker" data-campo="kicker" data-entrada="aparecer" data-ordem="2">Recepção</p>
    <h1 data-campo="titulo" data-entrada="revelar" data-ordem="4">Bem-vindo</h1>
    <p class="apoio" data-campo="apoio" data-entrada="aparecer" data-ordem="8">Fique à vontade. Chamamos você pelo nome na hora da consulta.</p>
    <p class="agora" data-entrada="aparecer" data-ordem="11"><span class="hora" data-vivo="relogio">09:41</span><span class="data" data-vivo="data">sexta, 7 de novembro</span></p>
  </div>
  <img class="foto" data-campo-img="foto" alt="" data-entrada="aproximar" data-continua="kenburns">
</section>
