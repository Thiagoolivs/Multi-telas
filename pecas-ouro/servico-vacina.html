<!--
  Vacinação — família serviço. Destaque e lateral.
  A campanha numa olhada: qual vacina, até quando e onde. A seringa é
  desenho em CSS (corpo com a escala, êmbolo e agulha), deitada na
  diagonal dentro do círculo da cor de destaque. O "até quando" vai num
  selo, porque é o que faz a pessoa agir.
-->
<style>
.mt-peca { overflow-wrap: break-word; display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 6cqw; padding: 8cqmin 7cqw;
  color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(100% 100% at 100% 50%, var(--mt-fundo-2), var(--mt-fundo) 62%); }
.kicker { display: flex; align-items: center; gap: 2cqmin; font: 700 max(var(--mt-piso, 0cqw), 3.8cqmin)/1.15 var(--mt-fonte-texto); letter-spacing: .08em; text-transform: uppercase; color: var(--mt-preco); }
.kicker i { display: block; flex: none; width: 6cqmin; height: .9cqmin; border-radius: 1cqmin; background: var(--mt-destaque); }
h1 { margin-top: 3cqmin; font: 700 max(var(--mt-piso, 0cqw), calc(13cqmin * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.015em; text-wrap: balance; }
.apoio { margin-top: 4cqmin; font: 500 max(var(--mt-piso, 0cqw), 5cqmin)/1.3 var(--mt-fonte-texto); color: var(--mt-texto-suave); max-width: 22em; text-wrap: pretty; }
.quando { display: inline-block; margin-top: 5cqmin; padding: 1.8cqmin 3.4cqmin; border-radius: var(--mt-raio); background: var(--mt-destaque); color: var(--mt-sobre-destaque);
  font: 700 max(var(--mt-piso, 0cqw), 4.8cqmin)/1.15 var(--mt-fonte-texto); }
.onde { margin-top: 2.6cqmin; font: 600 max(var(--mt-piso, 0cqw), 4.2cqmin)/1.25 var(--mt-fonte-texto); }
/* O círculo da seringa: 10em de lado, tudo dentro medido em em. */
.selo { position: relative; flex: none; width: 10em; height: 10em; border-radius: 50%; font-size: 5.4cqmin; background: var(--mt-destaque); }
.seringa { position: absolute; left: 1.2em; top: 4.35em; width: 7.6em; height: 1.3em; transform: rotate(-45deg); }
.seringa::before { content: ''; position: absolute; left: 1.6em; top: 0; width: 4em; height: 1.3em; border-radius: .2em; background: var(--mt-sobre-destaque);
  box-shadow: inset .5em 0 0 0 var(--mt-sobre-destaque); }
.seringa::after { content: ''; position: absolute; left: 5.6em; top: .5em; width: 2em; height: .3em; border-radius: .15em; background: var(--mt-sobre-destaque); }
.seringa i { position: absolute; left: 0; top: .25em; width: 1.7em; height: .8em; background: var(--mt-sobre-destaque); border-radius: .15em;
  box-shadow: -.3em 0 0 .05em var(--mt-sobre-destaque); }
.seringa b { position: absolute; left: 2.3em; top: .15em; width: 2.8em; height: .4em; background: repeating-linear-gradient(90deg, var(--mt-destaque) 0 .12em, transparent .12em .7em); }
@container (aspect-ratio >= 1.25) and (aspect-ratio < 1.75) {
  .mt-peca { column-gap: 4cqw; padding: 7cqmin 6cqw; }
  .selo { font-size: 4.4cqmin; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(11cqmin * var(--mt-escala-titulo, 1))); }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 4.4cqmin); }
}
/* Em pé: o círculo em cima, a campanha embaixo. */
@container (aspect-ratio < 1.25) {
  .mt-peca { grid-template-columns: 1fr; align-content: center; row-gap: 7cqmin; padding: 8cqmin 8cqw; }
  .selo { grid-row: 1; justify-self: center; font-size: 5.4cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(13cqw * var(--mt-escala-titulo, 1))); }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 5.4cqw); }
  .quando { font-size: max(var(--mt-piso, 0cqw), 5cqw); }
  .onde { font-size: max(var(--mt-piso, 0cqw), 4.6cqw); }
}
@container (aspect-ratio < 0.8) and (min-width: 701px) {
  .mt-peca { row-gap: 10cqw; }
  .selo { font-size: 6.2cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 4.6cqw); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(15cqw * var(--mt-escala-titulo, 1))); }
  .apoio { margin-top: 5cqw; font-size: max(var(--mt-piso, 0cqw), 6.2cqw); }
  .quando { margin-top: 7cqw; font-size: max(var(--mt-piso, 0cqw), 5.6cqw); }
  .onde { margin-top: 3.4cqw; font-size: max(var(--mt-piso, 0cqw), 5.2cqw); }
}
/* Quase quadrada: o círculo pequeno ao lado do título. */
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { grid-template-columns: 1fr auto; align-items: start; column-gap: 0; padding: 7cqmin 7cqw; }
  /* O círculo divide a primeira linha com o kicker e o título; o resto do texto usa a largura toda. */
  .texto { grid-column: 1 / -1; grid-row: 1; }
  .selo { grid-row: 1; grid-column: 2; font-size: 2.8cqmin; }
  .kicker, h1 { margin-right: 32cqmin; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 3.6cqmin); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(10.4cqmin * var(--mt-escala-titulo, 1))); }
  .apoio { margin-top: 3cqmin; font-size: max(var(--mt-piso, 0cqw), 4.4cqmin); }
  .quando { margin-top: 4cqmin; font-size: max(var(--mt-piso, 0cqw), 4.4cqmin); }
  .onde { font-size: max(var(--mt-piso, 0cqw), 4cqmin); }
}
/* A lateral: o círculo, a vacina, o selo e o onde; o apoio sai. */
@container (max-width: 700px) {
  .selo { font-size: 5cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 5.8cqw); letter-spacing: .04em; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(12.6cqw * var(--mt-escala-titulo, 1))); }
  .apoio { display: none; }
  .quando { font-size: max(var(--mt-piso, 0cqw), 6.4cqw); }
  .onde { font-size: max(var(--mt-piso, 0cqw), 6.2cqw); }
}
/* Deitada e baixa: sem o apoio e o kicker. */
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { padding: 5cqmin 6cqw; }
  .kicker, .apoio { display: none; }
  .selo { font-size: 6.6cqmin; }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(14cqmin * var(--mt-escala-titulo, 1))); }
  .quando { margin-top: 3.4cqmin; }
}
</style>
<section class="mt-peca servico-vacina">
  <div class="texto">
    <p class="kicker" data-entrada="esquerda" data-ordem="1"><i aria-hidden="true"></i><span data-campo="kicker">Vacinação</span></p>
    <h1 data-campo="titulo" data-entrada="subir" data-ordem="2">Sua caderneta está em dia?</h1>
    <p class="apoio" data-campo="apoio" data-entrada="aparecer" data-ordem="3">Traga a caderneta: a gente confere e aplica as vacinas que faltam.</p>
    <p class="quando" data-campo="quando" data-entrada="aparecer" data-ordem="4">Sem agendamento</p>
    <p class="onde" data-campo="onde" data-entrada="aparecer" data-ordem="5">Todos os dias · das 8h às 20h</p>
  </div>
  <span class="selo" aria-hidden="true" data-entrada="crescer"><span class="seringa"><i></i><b></b></span></span>
</section>
