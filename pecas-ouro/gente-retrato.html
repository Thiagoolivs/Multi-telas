<!--
  Retrato da equipe — família gente (lote 4, arquétipo A7).
  Uma pessoa da casa, como num perfil de revista: o retrato grande em
  corte seco, o nome na letra do título, a função na cor de destaque e uma
  frase dela, curta, sob um filete. Serve para apresentar quem atende,
  o colaborador do mês, a doutora nova.
-->
<style>
.mt-peca { --f: 2.6cqw; --t: 6.4cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo); display: grid; grid-template-columns: 44fr 56fr; }
.foto { width: 100%; height: 100%; min-height: 0; object-fit: cover; object-position: 50% 30%; }
.texto { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 8cqh 6cqw 8cqh 5cqw; }
.kicker { font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.1 var(--mt-fonte-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--mt-texto-suave); }
h1 { margin-top: 3cqh; font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.01em; text-wrap: balance; }
.funcao { margin-top: 1.6cqh; font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.2 var(--mt-fonte-texto); color: var(--mt-destaque); }
.frase { margin-top: 4cqh; padding-top: 2.4cqh; border-top: .14cqw solid var(--mt-linha); font: 400 max(var(--mt-piso, 0cqw), var(--f))/1.3 var(--mt-fonte-texto); color: var(--mt-texto-suave); text-wrap: pretty; }

@container (aspect-ratio >= 1.25) and (max-height: 900px) {
  .mt-peca { --f: 3.5cqw; --t: 6.6cqw; grid-template-columns: 46fr 54fr; }
  .texto { padding: 6cqh 5cqw; }
  .kicker { letter-spacing: .06em; }
  .frase { margin-top: 3cqh; }
}
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { --f: 4.8cqw; --t: 6.4cqw; }
  .kicker, .frase { display: none; }
  h1 { margin-top: 0; }
}
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.6cqw; --t: 11cqw; grid-template-columns: 1fr; grid-template-rows: 56fr 44fr; }
  .texto { justify-content: flex-start; padding: 5cqh 7cqw 6cqh; }
  .frase { border-top-width: .24cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --t: 8.4cqw; grid-template-rows: 50fr 50fr; }
  .texto { justify-content: center; padding: 4cqh 7cqw 5cqh; }
  h1 { margin-top: 1.6cqh; }
  .frase { display: none; }
}
@container (max-width: 700px) {
  .mt-peca { --f: 9.6cqw; --t: 13cqw; grid-template-rows: 52fr 48fr; }
  .texto { justify-content: center; padding: 3cqh 8cqw 4cqh; }
  .kicker { letter-spacing: .02em; text-transform: none; }
  h1 { margin-top: 1.6cqh; }
  .frase { display: none; }
}
</style>
<section class="mt-peca gente-retrato">
  <img class="foto" data-campo-img="foto" alt="" data-entrada="aparecer">
  <div class="texto">
    <p class="kicker" data-campo="kicker" data-entrada="aparecer" data-ordem="1">Quem atende você</p>
    <h1 data-campo="nome" data-entrada="subir" data-ordem="2">Marina Duarte</h1>
    <p class="funcao" data-campo="funcao" data-entrada="aparecer" data-ordem="3">Colorista · 12 anos de salão</p>
    <p class="frase" data-campo="frase" data-entrada="aparecer" data-ordem="4">Cor boa é a que parece sua. Eu começo sempre pela conversa.</p>
  </div>
</section>
