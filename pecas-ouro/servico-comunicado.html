<!--
  Comunicado — família serviço. Destaque.
  Feriado, mudança de horário, obra: o que muda e quando. A data vira uma
  folha de calendário (o mês numa tarja, o dia grande) — o cliente entende
  "é sobre um dia" antes de ler. O texto do lado diz o que muda e quando
  volta ao normal.
-->
<style>
.mt-peca { color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(110% 110% at 0% 0%, var(--mt-fundo-2), var(--mt-fundo) 62%); }
.marca-nome { position: absolute; left: 6cqw; top: 6cqh; font: 600 max(var(--mt-piso, 0cqw), 1.25cqw)/1 var(--mt-fonte-texto); letter-spacing: .42em; text-transform: uppercase; }
.marca-nome b { font-weight: 800; }
.folha { position: absolute; left: 7cqw; top: 50%; transform: translateY(-50%); width: 30cqw; border-radius: var(--mt-raio); overflow: hidden;
  background: var(--mt-superficie); box-shadow: 0 0 0 .14cqw var(--mt-linha); text-align: center; }
.mes { display: block; padding: 1.6cqw 0; background: var(--mt-destaque); color: var(--mt-sobre-destaque); font: 700 max(var(--mt-piso, 0cqw), 1.9cqw)/1 var(--mt-fonte-texto); letter-spacing: .4em; text-transform: uppercase; }
.dia { display: block; padding: 2.4cqw 0 1cqw; font: 700 max(var(--mt-piso, 0cqw), 16cqw)/.9 var(--mt-fonte-titulo); letter-spacing: -.04em; color: var(--mt-texto); }
.semana { display: block; padding-bottom: 2.4cqw; font: 600 max(var(--mt-piso, 0cqw), 1.6cqw)/1 var(--mt-fonte-texto); letter-spacing: .3em; text-transform: uppercase; color: var(--mt-texto-suave); }
.texto { position: absolute; left: 45cqw; right: 7cqw; top: 50%; transform: translateY(-50%); }
.kicker { display: flex; align-items: center; gap: 1.1cqw; font: 600 max(var(--mt-piso, 0cqw), 1.25cqw)/1 var(--mt-fonte-texto); letter-spacing: .3em; text-transform: uppercase; color: var(--mt-destaque); }
.kicker i { display: block; width: 3.6cqw; height: .14cqw; background: var(--mt-destaque); }
h1 { font: 600 max(var(--mt-piso, 0cqw), 5.2cqw)/1.04 var(--mt-fonte-titulo); letter-spacing: -.02em; margin: 2.2cqw 0 2.4cqw; text-wrap: balance; }
.apoio { font: 400 max(var(--mt-piso, 0cqw), 1.7cqw)/1.5 var(--mt-fonte-texto); color: var(--mt-texto-suave); text-wrap: pretty; }
.volta { margin-top: 2.8cqw; padding-top: 2.2cqw; border-top: .12cqw solid var(--mt-linha); font: 600 max(var(--mt-piso, 0cqw), 1.6cqw)/1.3 var(--mt-fonte-texto); }
/*
 * A principal do Corporativo (1379×784 na TV): com a letra do balcão e a
 * fonte de título larga de uma marca, o texto passava do alto e do pé. A
 * folha do calendário fica um pouco mais estreita e o texto ganha a
 * largura; as letras espaçadas apertam e as entrelinhas ficam mais justas.
 */
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 860px) {
  .marca-nome { letter-spacing: .16em; }
  .folha { left: 6cqw; width: 28cqw; }
  .mes { letter-spacing: .16em; }
  .semana { letter-spacing: .04em; }
  .texto { left: 40cqw; right: 6cqw; }
  .kicker { gap: .8cqw; letter-spacing: .1em; }
  .kicker i { width: 2.4cqw; }
  h1 { margin: 1.4cqw 0 1.6cqw; }
  .apoio { line-height: 1.3; }
  .volta { margin-top: 1.8cqw; padding-top: 1.4cqw; line-height: 1.2; }
}
/*
 * A principal do Corporativo com a margem contra o corte (de 1321×739 a
 * 1236×674): com a letra do balcão o texto, centrado, passava do alto e do
 * pé. O título fica um pouco menor (acima do piso) e as entrelinhas
 * apertam.
 */
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 775px) {
  h1 { margin: 1.2cqw 0 1.2cqw; font-size: max(var(--mt-piso, 0cqw), 4.6cqw); line-height: 1; }
  .apoio { line-height: 1.2; }
  .volta { margin-top: 1.4cqw; padding-top: 1.2cqw; line-height: 1.1; }
}
@container (aspect-ratio < 0.8) {
  .marca-nome { left: 8cqw; top: 5cqh; font-size: max(var(--mt-piso, 0cqw), 2cqw); }
  .folha { left: 8cqw; top: 11cqh; transform: none; width: 50cqw; }
  .mes { font-size: max(var(--mt-piso, 0cqw), 3.2cqw); padding: 2.6cqw 0; }
  .dia { font-size: max(var(--mt-piso, 0cqw), 27cqw); padding-top: 4cqw; }
  .semana { font-size: max(var(--mt-piso, 0cqw), 2.6cqw); padding-bottom: 4cqw; }
  .texto { left: 8cqw; right: 8cqw; top: auto; bottom: 9cqh; transform: none; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 2.2cqw); }
  .kicker i { width: 6cqw; height: .25cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 9.4cqw); margin: 3.6cqw 0 3.6cqw; }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 3.2cqw); }
  .volta { font-size: max(var(--mt-piso, 0cqw), 3cqw); margin-top: 4.4cqw; padding-top: 3.6cqw; border-top-width: .25cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  /* Quadrada: a folha no canto de cima, à direita; o texto ocupa a largura toda embaixo. Com a letra da TV, a folha à esquerda empurrava o texto para cima dela. */
  .marca-nome { left: 7cqw; top: 6cqh; right: 50cqw; font-size: max(var(--mt-piso, 0cqw), 1.8cqw); letter-spacing: .24em; line-height: 1.15; }
  .folha { left: auto; right: 7cqw; top: 6cqh; transform: none; width: 40cqw; }
  .mes { font-size: max(var(--mt-piso, 0cqw), 2.2cqw); padding: 1.6cqw 0; letter-spacing: .2em; }
  .dia { font-size: max(var(--mt-piso, 0cqw), 15cqw); padding-top: 2.2cqw; }
  .semana { font-size: max(var(--mt-piso, 0cqw), 1.8cqw); padding-bottom: 2.2cqw; letter-spacing: .1em; }
  .texto { left: 7cqw; right: 7cqw; top: auto; bottom: 8cqh; transform: none; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 1.9cqw); }
  .kicker i { width: 5cqw; height: .2cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 6.6cqw); margin: 2.6cqw 0 2.6cqw; }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 2.4cqw); }
  .volta { font-size: max(var(--mt-piso, 0cqw), 2.3cqw); margin-top: 3cqw; padding-top: 2.6cqw; border-top-width: .2cqw; }
}
</style>
<section class="mt-peca servico-comunicado">
  <div class="marca-nome" data-campo="marca" data-repete="marca">Clínica <b>Vida</b></div>
  <div class="folha" data-entrada="crescer" data-ordem="1">
    <span class="mes" data-campo="mes">Nesta</span>
    <span class="dia" data-campo="dia">sexta</span>
    <span class="semana" data-campo="semana">feira</span>
  </div>
  <div class="texto">
    <p class="kicker" data-entrada="esquerda" data-ordem="2"><i aria-hidden="true"></i><span data-campo="kicker">Feriado</span></p>
    <h1 data-campo="titulo" data-entrada="subir" data-ordem="3">Não haverá atendimento</h1>
    <p class="apoio" data-campo="apoio" data-entrada="aparecer" data-ordem="4">Resultados de exame continuam saindo pelo WhatsApp. Em urgência, procure o pronto-socorro mais próximo.</p>
    <p class="volta" data-campo="volta" data-entrada="aparecer" data-ordem="5">Voltamos no sábado, às 8h.</p>
  </div>
</section>
