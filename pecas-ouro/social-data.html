<!--
  Data comemorativa — família social. Destaque.
  O nome da data é a imagem: grande, em duas linhas decididas, com a
  segunda na cor de destaque. Atrás, o número do mês (ou do dia) em
  contorno, só desenho — a peça não precisa de foto para ter profundidade.
  O número é campo (o cliente troca), então cabe inteiro na peça.
  Serve para Outubro Rosa, Dia das Mães, aniversário da loja.
-->
<style>
.mt-peca { color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(90% 120% at 100% 50%, var(--mt-fundo-2), var(--mt-fundo) 60%); }
/*
 * O número de fundo: contorno fino, sem preenchimento. Entrelinha 1.5 para a
 * caixa do número ser a do desenho (o número é campo: a caixa dele não pode
 * encostar no texto). Ele mora à direita, no vão que o texto deixa.
 */
.fundo-num { position: absolute; right: 5cqw; top: 3.6cqh; font: 700 max(var(--mt-piso, 0cqw), 38cqh)/1.5 var(--mt-fonte-titulo); letter-spacing: -.04em;
  color: var(--mt-fundo-0); -webkit-text-stroke: .16cqw var(--mt-linha); white-space: nowrap; }
.marca-nome { position: absolute; left: 6cqw; top: 5cqh; font: 600 max(var(--mt-piso, 0cqw), 1.25cqw)/1 var(--mt-fonte-texto); letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; }
.marca-nome b { font-weight: 800; }
/* O bloco assenta embaixo: a altura dele é a do texto, que cresce para cima, longe da borda. */
.bloco { position: absolute; left: 6cqw; bottom: 6cqh; width: 68cqw; }
.kicker { display: flex; align-items: center; gap: 1.1cqw; font: 600 max(var(--mt-piso, 0cqw), 1.25cqw)/1 var(--mt-fonte-texto); letter-spacing: .16em; text-transform: uppercase; color: var(--mt-destaque); }
.kicker i { display: block; flex: none; width: 3.6cqw; height: .14cqw; background: var(--mt-destaque); }
/* Margens em em: a caixa da letra do título passa da linha em cima e embaixo, e a folga acompanha o tamanho dele. */
h1 { font: 600 max(var(--mt-piso, 0cqw), 14.5cqh)/.95 var(--mt-fonte-titulo); letter-spacing: -.02em; margin: .36em 0 .34em; }
h1 span, h1 em { display: block; white-space: nowrap; }
h1 em { font-style: normal; color: var(--mt-destaque); }
.apoio { font: 400 max(var(--mt-piso, 0cqw), 1.6cqw)/1.45 var(--mt-fonte-texto); color: var(--mt-texto-suave); max-width: 20em; }
.cta { display: inline-block; margin-top: .8em; font: 600 max(var(--mt-piso, 0cqw), 1.2cqw)/1 var(--mt-fonte-texto); letter-spacing: .14em; text-transform: uppercase; padding-bottom: .7cqw; border-bottom: .12cqw solid var(--mt-destaque); }
/* A TV inteira deitada: sobra altura — o título e o número crescem. */
@container (aspect-ratio >= 1.74) {
  .fundo-num { top: 50%; transform: translateY(-50%); font-size: max(var(--mt-piso, 0cqw), 60cqh); }
  .marca-nome { top: 6cqh; }
  .bloco { bottom: 8cqh; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 17.5cqh); }
}
@container (aspect-ratio < 0.8) {
  .fundo-num { right: 8cqw; top: 9cqh; transform: none; font-size: max(var(--mt-piso, 0cqw), 47cqw); -webkit-text-stroke-width: .3cqw; }
  .marca-nome { left: 8cqw; top: 5cqh; font-size: max(var(--mt-piso, 0cqw), 2cqw); }
  .bloco { left: 8cqw; right: 8cqw; width: auto; bottom: 8cqh; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 2.2cqw); }
  .kicker i { width: 6cqw; height: .25cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 18cqw); }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 3cqw); max-width: none; }
  .cta { font-size: max(var(--mt-piso, 0cqw), 2.2cqw); border-bottom-width: .25cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .fundo-num { right: 6cqw; top: 11cqh; font-size: max(var(--mt-piso, 0cqw), 30cqw); -webkit-text-stroke-width: .22cqw; }
  .marca-nome { left: 7cqw; top: 5cqh; font-size: max(var(--mt-piso, 0cqw), 1.8cqw); }
  .bloco { left: 7cqw; right: 7cqw; width: auto; bottom: 7cqh; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 1.9cqw); letter-spacing: .08em; }
  .kicker i { display: none; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 14cqw); }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 2.4cqw); max-width: none; }
  .cta { font-size: max(var(--mt-piso, 0cqw), 1.9cqw); border-bottom-width: .2cqw; }
}
</style>
<section class="mt-peca social-data">
  <span class="fundo-num" data-campo="numero" aria-hidden="true" data-entrada="aparecer">10</span>
  <div class="marca-nome" data-campo="marca" data-repete="marca">Clínica <b>Vida</b></div>
  <div class="bloco">
    <p class="kicker" data-entrada="esquerda" data-ordem="1"><i aria-hidden="true"></i><span data-campo="kicker">Mês de prevenção</span></p>
    <h1 data-entrada="subir" data-ordem="2"><span data-campo="titulo">Outubro</span><em data-campo="titulo2">Rosa</em></h1>
    <p class="apoio" data-campo="apoio" data-entrada="aparecer" data-ordem="3">Mamografia para mulheres a partir de 40 anos, com resultado em dois dias.</p>
    <p class="cta" data-entrada="aparecer" data-ordem="4"><span data-campo="cta">Agende na recepção</span> <span aria-hidden="true">→</span></p>
  </div>
</section>
