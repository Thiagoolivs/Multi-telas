<!--
  Rodapé com selo — papel rodapé (PLANO §4.7: "o resto": horário,
  pagamento, contato). O selo na cor de destaque com a ponta cortada, e as
  mensagens rolando à direita (`data-vivo="mensagens"`: quem rola é o
  desenhista, a peça só diz onde). Medidas em cqh: a faixa tem ~120px de
  altura, e é a altura que decide a letra.
-->
<style>
.mt-peca { display: flex; align-items: stretch; color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: var(--mt-fundo); border-top: 1.2cqh solid var(--mt-linha); }
.selo { flex: none; display: flex; align-items: center; padding: 0 30cqh 0 3cqw; background: var(--mt-destaque); color: var(--mt-sobre-destaque);
  clip-path: polygon(0 0, 100% 0, calc(100% - 22cqh) 100%, 0 100%);
  font: 700 22cqh/1 var(--mt-fonte-texto); letter-spacing: .32em; text-transform: uppercase; white-space: nowrap; }
.trilho { position: relative; flex: 1; min-width: 0; overflow: hidden; display: flex; align-items: center; padding-left: 4cqh; }
.trilho [data-vivo] { font: 500 34cqh/1 var(--mt-fonte-texto); letter-spacing: .02em; }
/* As mensagens somem nas pontas em vez de serem cortadas a seco. */
.trilho::before, .trilho::after { content: ''; position: absolute; top: 0; bottom: 0; width: 8cqw; z-index: 1; }
.trilho::before { left: 0; background: linear-gradient(90deg, var(--mt-fundo), var(--mt-fundo-0)); }
.trilho::after { right: 0; background: linear-gradient(270deg, var(--mt-fundo), var(--mt-fundo-0)); }
/* Faixa em pé: o selo encolhe para a mensagem ter onde passar. */
@container (aspect-ratio < 9) {
  .selo { font-size: 18cqh; letter-spacing: .24em; padding-right: 24cqh; }
  .trilho [data-vivo] { font-size: 30cqh; }
}
</style>
<section class="mt-peca rodape-selo">
  <div class="selo" data-entrada="esquerda"><span data-campo="selo">Ótica Central</span></div>
  <div class="trilho"><span data-vivo="mensagens">10x sem juros · Proteção UV400 · Aberto até 19h</span></div>
</section>
