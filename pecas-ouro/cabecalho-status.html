<!--
  Cabeçalho com status — papel cabeçalho (PLANO §4.7: "quem e agora").
  A marca no centro, como assinatura; à esquerda, se a casa está aberta e
  até que horas; à direita, clima, hora e data. É o cabeçalho de quem
  atende no balcão: padaria, lanchonete, farmácia. O ponto do status pisca
  devagar — o único movimento da faixa. Medidas em cqh, como o clássico:
  a altura da faixa decide a letra.
-->
<style>
/* Fase 10: no piso da TV o espaço entre as letras (em em) crescia com a letra, e o status passava por cima da marca na faixa em pé. Agora ele é fixo, e nada sai da coluna dele. */
.mt-peca { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 6cqh; padding: 0 3cqw;
  color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: linear-gradient(180deg, var(--mt-fundo-2), var(--mt-fundo)); border-bottom: 1.2cqh solid var(--mt-linha); }
.status { display: flex; align-items: center; gap: 9cqh; min-width: 0; }
.ponto { flex: none; width: 13cqh; height: 13cqh; border-radius: 50%; background: var(--mt-destaque);
  box-shadow: 0 0 0 4.5cqh var(--mt-fundo-2), 0 0 0 5.7cqh var(--mt-destaque); }
.estado { display: flex; flex-direction: column; gap: 7cqh; min-width: 0; }
.aberto { font: 700 max(var(--mt-piso, 0cqw), 17cqh)/1.1 var(--mt-fonte-texto); letter-spacing: 5.1cqh; text-transform: uppercase; color: var(--mt-destaque); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ate { font: 500 max(var(--mt-piso, 0cqw), 19cqh)/1.1 var(--mt-fonte-texto); color: var(--mt-texto-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.marca { display: flex; flex-direction: column; align-items: center; gap: 8cqh; min-width: 0; max-width: 52cqw; }
.logo { height: 58cqh; width: auto; max-width: 30cqw; object-fit: contain; }
.logo[data-sem-foto] { display: none; }
.logo:not([data-sem-foto]) + .nome { display: none; }
.nome { max-width: 100%; font: 400 max(var(--mt-piso, 0cqw), 40cqh)/.9 var(--mt-fonte-titulo); letter-spacing: 4.8cqh; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nome b { font-weight: inherit; color: var(--mt-destaque); }
.desde { display: flex; align-items: center; gap: 4cqh; max-width: 100%; font: 600 max(var(--mt-piso, 0cqw), 11cqh)/1 var(--mt-fonte-texto); letter-spacing: 5.5cqh; text-transform: uppercase; color: var(--mt-texto-suave); white-space: nowrap; overflow: hidden; }
.desde i { display: block; width: 18cqh; height: 1cqh; background: var(--mt-linha); }
.agora { justify-self: end; display: flex; align-items: center; gap: 5cqh; min-width: 0; }
.clima { font: 500 max(var(--mt-piso, 0cqw), 26cqh)/1 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
.sep { display: block; width: 1.2cqh; height: 44cqh; background: var(--mt-linha); }
.tempo { display: flex; flex-direction: column; align-items: flex-end; gap: 4cqh; }
.hora { font: 400 max(var(--mt-piso, 0cqw), 46cqh)/.9 var(--mt-fonte-titulo); letter-spacing: .02em; }
.data { font: 600 max(var(--mt-piso, 0cqw), 15cqh)/1 var(--mt-fonte-texto); letter-spacing: 3.6cqh; text-transform: uppercase; color: var(--mt-texto-suave); white-space: nowrap; }
/*
 * Faixa mais curta (TV em pé e quadrada): o "desde", o clima e o horário
 * saem; o status, a marca e a hora ficam. Reteste 2 (09/11): com a letra do
 * balcão, os três lado a lado não cabiam em 1080 px e o piso cedia até a
 * metade (o "ABERTO A…" e o "Hoje até as …" em reticências). Agora o status
 * quebra em duas linhas ("ABERTO / AGORA") e a marca também, se for longa:
 * a faixa tem altura para duas linhas na letra do balcão, e não largura
 * para uma.
 */
@container (aspect-ratio < 9) {
  .mt-peca { gap: 7cqh; grid-template-columns: auto minmax(0, 1fr) auto; }
  .desde, .clima, .sep, .data, .ate { display: none; }
  .status { gap: 6cqh; max-width: 31cqw; }
  .ponto { width: 10cqh; height: 10cqh; box-shadow: 0 0 0 3.5cqh var(--mt-fundo-2), 0 0 0 4.5cqh var(--mt-destaque); }
  .estado { gap: 6cqh; }
  .aberto { font-size: max(var(--mt-piso, 0cqw), 15cqh); letter-spacing: 1.4cqh; line-height: 1.04; white-space: normal; text-overflow: clip;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .marca { max-width: none; }
  .nome { font-size: max(var(--mt-piso, 0cqw), 30cqh); letter-spacing: 1.6cqh; line-height: 1.04; white-space: normal; text-overflow: clip; text-align: center;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; text-wrap: balance; }
  .hora { font-size: max(var(--mt-piso, 0cqw), 38cqh); }
}
/*
 * A faixa deitada (16:9) com a letra do balcão (4,5%, 48,6 px): as linhas
 * empilhadas (o status e o horário, o nome e o "desde", a hora e a data)
 * chegavam a 0–5 px da borda. O vão entre elas encolhe o quanto a letra
 * cresceu acima do desenho, a entrelinha das linhas de apoio não passa de
 * 30% da faixa e, acima de 30% da faixa de letra, a hora encolhe o mesmo
 * tanto. Sem piso (a letra do desenho) fica como era; a faixa em pé não muda.
 */
@container (aspect-ratio >= 9) {
  .estado { gap: max(0cqh, calc(7cqh - (max(var(--mt-piso, 0cqw), 17cqh) - 17cqh))); }
  .marca { gap: max(0cqh, calc(8cqh - (max(var(--mt-piso, 0cqw), 11cqh) - 11cqh))); }
  .tempo { gap: max(0cqh, calc(4cqh - (max(var(--mt-piso, 0cqw), 15cqh) - 15cqh))); }
  /* Reteste 2: 30cqh de entrelinha para a letra de 37cqh cortava o acento e grudava as duas linhas; 40cqh é a linha inteira. */
  .aberto, .ate { line-height: min(1.08em, 40cqh); }
  .desde, .data { line-height: min(1.05em, 40cqh); }
  .hora { font-size: max(var(--mt-piso, 0cqw), calc(46cqh - (max(var(--mt-piso, 0cqw), 30cqh) - 30cqh))); }
}
</style>
<section class="mt-peca cabecalho-status">
  <div class="status" data-entrada="aparecer" data-ordem="1">
    <span class="ponto" aria-hidden="true" data-continua="brilhar"></span>
    <span class="estado"><span class="aberto" data-campo="status">Aberto agora</span><span class="ate" data-campo="horario">Hoje até as 20h</span></span>
  </div>
  <div class="marca" data-entrada="aparecer">
    <img class="logo" data-campo-img="logo" alt="">
    <span class="nome" data-campo="marca">Padaria <b>do Bairro</b></span>
    <span class="desde"><i aria-hidden="true"></i><span data-campo="desde">Desde 1987</span><i aria-hidden="true"></i></span>
  </div>
  <div class="agora" data-entrada="aparecer" data-ordem="2">
    <span class="clima" data-vivo="clima">22°</span>
    <span class="sep" aria-hidden="true"></span>
    <span class="tempo"><span class="hora" data-vivo="relogio">07:15</span><span class="data" data-vivo="data">Terça · 20 out</span></span>
  </div>
</section>
