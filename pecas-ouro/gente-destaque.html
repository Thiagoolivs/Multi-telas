<!--
  Destaque do mês — família gente. Destaque e lateral.
  Reconhecimento com formato fixo (Appspace Recognition): a pessoa, o
  setor e a conquista numa frase. O retrato é um círculo com as iniciais
  na cor da marca; com foto no campo, a foto cobre as iniciais. A estrela
  é desenho (clip-path), o selo de quem foi escolhido.
-->
<style>
.mt-peca { overflow-wrap: break-word; display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 7cqmin; padding: 8cqmin 7cqw;
  color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(90% 120% at 0% 50%, var(--mt-fundo-2), var(--mt-fundo) 66%); }
.retrato { position: relative; width: 52cqmin; height: 52cqmin; }
.circulo { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: var(--mt-destaque);
  box-shadow: 0 0 0 1.6cqmin var(--mt-fundo), 0 0 0 2.4cqmin var(--mt-destaque); display: flex; align-items: center; justify-content: center; }
.iniciais { font: 700 18cqmin/1 var(--mt-fonte-titulo); color: var(--mt-sobre-destaque); letter-spacing: .02em; }
.circulo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.estrela { position: absolute; right: -1cqmin; top: -1cqmin; width: 15cqmin; height: 15cqmin; background: var(--mt-texto);
  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.texto { min-width: 0; }
.kicker { display: flex; align-items: center; gap: 2cqmin; font: 700 max(var(--mt-piso, 0cqw), 3.6cqmin)/1.15 var(--mt-fonte-texto); letter-spacing: .12em; text-transform: uppercase; color: var(--mt-preco); }
/* O fio do kicker fica na altura da primeira linha, mesmo quando o kicker quebra. */
.kicker { align-items: flex-start; }
.kicker i { display: block; flex: none; align-self: flex-start; width: 6cqmin; height: .9cqmin; margin-top: .52em; border-radius: 1cqmin; background: var(--mt-destaque); }
h1 { margin-top: 2.6cqmin; font: 600 max(var(--mt-piso, 0cqw), calc(13cqmin * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.01em; text-wrap: balance; }
.setor { margin-top: 2cqmin; font: 600 max(var(--mt-piso, 0cqw), 4.8cqmin)/1.25 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
.conquista { margin-top: 5cqmin; padding-left: 3.4cqmin; border-left: .9cqmin solid var(--mt-destaque); font: 500 max(var(--mt-piso, 0cqw), 5.8cqmin)/1.3 var(--mt-fonte-texto); max-width: 22em; text-wrap: pretty; }
.assinatura { margin-top: 4cqmin; font: 600 max(var(--mt-piso, 0cqw), 3.6cqmin)/1.2 var(--mt-fonte-texto); letter-spacing: .06em; color: var(--mt-texto-suave); }
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 860px) {
  .retrato { width: 44cqmin; height: 44cqmin; }
  .iniciais { font-size: 15cqmin; }
  .estrela { width: 13cqmin; height: 13cqmin; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(11cqmin * var(--mt-escala-titulo, 1))); }
  .conquista { font-size: max(var(--mt-piso, 0cqw), 5.2cqmin); }
}
/* Em pé: o retrato em cima, o texto centrado embaixo. */
@container (aspect-ratio < 1.25) {
  .mt-peca { grid-template-columns: 1fr; justify-items: center; align-content: center; text-align: center; row-gap: 6cqmin; padding: 8cqmin 8cqw; }
  .retrato { width: 46cqw; height: 46cqw; }
  .iniciais { font-size: 16cqw; }
  .estrela { width: 13cqw; height: 13cqw; }
  .kicker { justify-content: center; }
  .kicker i { display: none; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(11cqw * var(--mt-escala-titulo, 1))); }
  .setor { font-size: max(var(--mt-piso, 0cqw), 4.6cqw); }
  .conquista { margin: 5cqmin auto 0; padding: 3.4cqmin 0 0; border-left: 0; border-top: .7cqmin solid var(--mt-destaque); font-size: max(var(--mt-piso, 0cqw), 5.4cqw); }
  .assinatura { font-size: max(var(--mt-piso, 0cqw), 3.8cqw); }
}
/* Em pé na tela inteira: tudo maior, o retrato domina a parte de cima. */
@container (aspect-ratio < 0.8) and (min-width: 701px) {
  .mt-peca { row-gap: 8cqmin; }
  .retrato { width: 60cqw; height: 60cqw; }
  .iniciais { font-size: 21cqw; }
  .estrela { width: 16cqw; height: 16cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 4.6cqw); }
  h1 { margin-top: 3cqw; font-size: max(var(--mt-piso, 0cqw), calc(14cqw * var(--mt-escala-titulo, 1))); }
  .setor { font-size: max(var(--mt-piso, 0cqw), 5.6cqw); }
  .conquista { margin-top: 7cqw; padding-top: 5cqw; font-size: max(var(--mt-piso, 0cqw), 6.6cqw); }
  .assinatura { margin-top: 5cqw; font-size: max(var(--mt-piso, 0cqw), 4.6cqw); }
}
/* Quase quadrada: o retrato ao lado, como deitada, mas menor. */
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { grid-template-columns: auto 1fr; justify-items: start; text-align: left; row-gap: 0; column-gap: 5cqmin; padding: 7cqmin 7cqw; }
  .retrato { width: 30cqmin; height: 30cqmin; align-self: start; margin-top: 4cqmin; }
  .iniciais { font-size: 11cqmin; }
  .estrela { width: 10cqmin; height: 10cqmin; }
  .kicker { justify-content: flex-start; font-size: max(var(--mt-piso, 0cqw), 3.4cqmin); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(9cqmin * var(--mt-escala-titulo, 1))); }
  .setor { font-size: max(var(--mt-piso, 0cqw), 4cqmin); }
  .conquista { grid-column: 1 / -1; margin: 6cqmin 0 0; padding: 0 0 0 3.4cqmin; border-top: 0; border-left: .9cqmin solid var(--mt-destaque); font-size: max(var(--mt-piso, 0cqw), 5.2cqmin); }
  .assinatura { grid-column: 1 / -1; font-size: max(var(--mt-piso, 0cqw), 3.6cqmin); }
  .texto { display: contents; }
  .kicker, h1, .setor { grid-column: 2; }
  .retrato { grid-row: 1 / span 3; }
}
/* A lateral: retrato, nome, setor e a conquista; a assinatura sai. */
@container (max-width: 700px) {
  /* Com a letra do balcão a conquista passava do pé: o retrato um pouco menor e o respiro mais justo. */
  .mt-peca { row-gap: 4.4cqmin; padding: 6cqmin 7cqw; }
  .retrato { width: 44cqw; height: 44cqw; }
  .iniciais { font-size: 15cqw; }
  .estrela { width: 11cqw; height: 11cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 6cqw); letter-spacing: .06em; line-height: 1.1; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(12cqw * var(--mt-escala-titulo, 1))); }
  .setor { font-size: max(var(--mt-piso, 0cqw), 6.4cqw); }
  .conquista { margin-top: 3.6cqmin; padding-top: 2.6cqmin; font-size: max(var(--mt-piso, 0cqw), 7cqw); line-height: 1.22; }
  .assinatura { display: none; }
}
/* Deitada e baixa: o retrato menor, sem a assinatura nem o kicker. */
/*
 * A lateral no tamanho da TV (504×782 sem margem, 452×674 com a margem
 * contra o corte de 5%; a caixa sem o padding abaixo de 740 px): com a
 * letra do balcão a conquista passava do pé. O retrato encolhe e os
 * respiros apertam; mais baixa (a margem de 3,5% para cima), o setor sai.
 */
@container (max-width: 700px) and (max-height: 800px) {
  .mt-peca { row-gap: 3cqmin; }
}
@container (max-width: 700px) and (max-height: 740px) {
  .retrato { width: 34cqw; height: 34cqw; }
  .iniciais { font-size: 12cqw; }
  .estrela { width: 9cqw; height: 9cqw; }
  h1 { margin-top: 1.4cqw; }
  .conquista { margin-top: 2.6cqw; padding-top: 0; line-height: 1.14; }
}
@container (max-width: 700px) and (max-height: 655px) {
  .setor { display: none; }
}
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { padding: 6cqmin 6cqw; column-gap: 6cqmin; }
  .retrato { width: 62cqmin; height: 62cqmin; }
  .iniciais { font-size: 22cqmin; }
  .kicker, .assinatura { display: none; }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(13cqmin * var(--mt-escala-titulo, 1))); }
  .conquista { margin-top: 3.6cqmin; }
}
</style>
<section class="mt-peca gente-destaque">
  <div class="retrato" data-entrada="crescer">
    <div class="circulo"><span class="iniciais" data-campo="iniciais">JP</span><img data-campo-img="foto" alt="Foto de quem é o destaque"></div>
    <span class="estrela" aria-hidden="true" data-entrada="estourar" data-ordem="3"></span>
  </div>
  <div class="texto">
    <p class="kicker" data-entrada="esquerda" data-ordem="1"><i aria-hidden="true"></i><span data-campo="kicker">Destaque de outubro</span></p>
    <h1 data-campo="nome" data-entrada="subir" data-ordem="2">Juliana Prado</h1>
    <p class="setor" data-campo="setor" data-entrada="aparecer" data-ordem="3">Expedição · turno A</p>
    <p class="conquista" data-campo="conquista" data-entrada="aparecer" data-ordem="4">Zerou os atrasos de entrega da linha 3 em outubro.</p>
    <p class="assinatura" data-campo="assinatura" data-entrada="aparecer" data-ordem="5">Escolhida pelos colegas do setor</p>
  </div>
</section>
