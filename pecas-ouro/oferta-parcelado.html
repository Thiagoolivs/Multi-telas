<!--
  Parcelado — família oferta. Destaque.
  Quando a parcela vende mais que o preço cheio, ela é que domina: o "10×"
  enorme, a parcela embaixo, e o total pequeno, para quem quiser saber.
  Do outro lado, o que está incluído — três itens, separados por filete.
-->
<style>
.mt-peca { color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(100% 110% at 0% 100%, var(--mt-fundo-2), var(--mt-fundo) 60%); }
.marca-nome { position: absolute; left: 6cqw; top: 6cqh; font: 600 max(var(--mt-piso, 0cqw), 1.25cqw)/1 var(--mt-fonte-texto); letter-spacing: .42em; text-transform: uppercase; }
.marca-nome b { font-weight: 800; }
.bloco { position: absolute; left: 6cqw; top: 50%; transform: translateY(-50%); width: 44cqw; }
.kicker { display: flex; align-items: center; gap: 1.1cqw; font: 600 max(var(--mt-piso, 0cqw), 1.25cqw)/1 var(--mt-fonte-texto); letter-spacing: .3em; text-transform: uppercase; color: var(--mt-destaque); }
.kicker i { display: block; width: 3.6cqw; height: .14cqw; background: var(--mt-destaque); }
h1 { font: 600 max(var(--mt-piso, 0cqw), 5.4cqw)/1.02 var(--mt-fonte-titulo); letter-spacing: -.02em; margin: 2.2cqw 0 3cqw; text-wrap: balance; }
.inclui { list-style: none; margin: 0; padding: 0; }
.inclui li { display: flex; align-items: center; gap: 1.4cqw; padding: 1.3cqw 0; border-top: .12cqw solid var(--mt-linha); font: 500 max(var(--mt-piso, 0cqw), 1.6cqw)/1.2 var(--mt-fonte-texto); }
.inclui li:last-child { border-bottom: .12cqw solid var(--mt-linha); }
.inclui li::before { content: ''; flex: none; width: .9cqw; height: .9cqw; border-radius: 50%; background: var(--mt-destaque); }
.parcela { position: absolute; right: 7cqw; top: 50%; transform: translateY(-50%); text-align: right; }
.vezes { display: block; font: 700 max(var(--mt-piso, 0cqw), 21cqw)/.78 var(--mt-fonte-titulo); letter-spacing: -.05em; color: var(--mt-preco); white-space: nowrap; }
.vezes small { font-size: max(var(--mt-piso, 0cqw), .5em); font-weight: 400; margin-left: .04em; }
.de { display: block; margin-top: 2.4cqw; font: 600 max(var(--mt-piso, 0cqw), 1.25cqw)/1 var(--mt-fonte-texto); letter-spacing: .3em; text-transform: uppercase; color: var(--mt-texto-suave); }
.valor { display: block; margin-top: 1cqw; font: 600 max(var(--mt-piso, 0cqw), 4.8cqw)/1 var(--mt-fonte-titulo); letter-spacing: -.02em; white-space: nowrap; }
.valor small { font-size: max(var(--mt-piso, 0cqw), .4em); font-weight: 500; vertical-align: .95em; margin-right: .2em; }
.valor sup { font-size: max(var(--mt-piso, 0cqw), .42em); vertical-align: .9em; }
.total { display: block; margin-top: 1.4cqw; font: 500 max(var(--mt-piso, 0cqw), 1.3cqw)/1.3 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
/*
 * A principal do Corporativo (1379×784 na TV): com a letra do balcão o
 * total, numa linha só, entrava na lista do lado, e o rótulo espaçado
 * quebrava. O total vai em duas linhas, à direita; as letras espaçadas
 * apertam e os itens ficam mais juntos.
 */
/* Sem mensagem no rodapé, a principal do Corporativo cresce (1377×913): o mesmo desenho, até 940 px de altura. */
@container ((aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 860px)) or ((aspect-ratio >= 1.25) and (aspect-ratio < 1.6) and (min-height: 860px) and (max-height: 940px)) {
  .marca-nome { letter-spacing: .16em; }
  .bloco { width: 46cqw; }
  .kicker { gap: .8cqw; letter-spacing: .08em; }
  .kicker i { width: 2.4cqw; }
  h1 { margin: 1.6cqw 0 1.8cqw; }
  .inclui li { gap: 1cqw; padding: .9cqw 0; line-height: 1.15; }
  .de { letter-spacing: .1em; }
  .total { max-width: 34cqw; margin-left: auto; line-height: 1.2; }
}
/*
 * A principal do Corporativo com a margem contra o corte (de 1321×739 a
 * 1236×674): com a letra do balcão cada item do que está incluído ia em
 * duas linhas e o bloco, centrado, subia no nome da loja. O bloco alarga
 * (um item por linha) e desce um pouco.
 */
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 775px) {
  .bloco { top: 54%; width: 51cqw; }
  .inclui li { padding: .7cqw 0; line-height: 1.1; }
}
@container (aspect-ratio < 0.8) {
  .marca-nome { left: 8cqw; top: 5cqh; font-size: max(var(--mt-piso, 0cqw), 2cqw); }
  .parcela { left: 8cqw; right: 8cqw; top: 9cqh; transform: none; text-align: left; }
  .vezes { font-size: max(var(--mt-piso, 0cqw), 46cqw); }
  .de { font-size: max(var(--mt-piso, 0cqw), 2.2cqw); margin-top: 4cqw; }
  .valor { font-size: max(var(--mt-piso, 0cqw), 10cqw); margin-top: 1.6cqw; }
  .total { font-size: max(var(--mt-piso, 0cqw), 2.6cqw); margin-top: 2cqw; }
  .bloco { left: 8cqw; right: 8cqw; width: auto; top: auto; bottom: 8cqh; transform: none; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 2.2cqw); }
  .kicker i { width: 6cqw; height: .25cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 9cqw); margin: 3.6cqw 0 4.4cqw; }
  .inclui li { font-size: max(var(--mt-piso, 0cqw), 3cqw); padding: 2.4cqw 0; gap: 2.4cqw; border-top-width: .25cqw; }
  .inclui li:last-child { border-bottom-width: .25cqw; }
  .inclui li::before { width: 1.6cqw; height: 1.6cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  /* Quadrada: o "10×" no canto de cima, à direita, um pouco menor; o texto embaixo com a largura toda. Com a letra da TV, o total encostava no título. */
  .marca-nome { left: 7cqw; top: 5cqh; font-size: max(var(--mt-piso, 0cqw), 1.8cqw); letter-spacing: .24em; }
  .parcela { right: 7cqw; top: 9cqh; transform: none; }
  .vezes { font-size: max(var(--mt-piso, 0cqw), 20cqw); }
  .de { font-size: max(var(--mt-piso, 0cqw), 1.7cqw); margin-top: 2.4cqw; }
  .valor { font-size: max(var(--mt-piso, 0cqw), 7.4cqw); margin-top: 2cqw; }
  .valor small, .valor sup { vertical-align: text-top; }
  .total { font-size: max(var(--mt-piso, 0cqw), 1.8cqw); margin-top: 1cqw; }
  .bloco { left: 7cqw; right: 7cqw; width: auto; top: auto; bottom: 6cqh; transform: none; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 1.9cqw); letter-spacing: .16em; }
  .kicker i { width: 5cqw; height: .2cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 6.6cqw); margin: 2.2cqw 0 2.4cqw; }
  .inclui li { font-size: max(var(--mt-piso, 0cqw), 2.3cqw); padding: 1.1cqw 0; border-top-width: .2cqw; }
  .inclui li:last-child { border-bottom-width: .2cqw; }
  .inclui li::before { width: 1.2cqw; height: 1.2cqw; }
}
/* Na TV (1377×782 e menor), a caixa da letra do "10×" chegava a 8 px do alto da peça: o número fica um pouco menor. */
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 790px) {
  .vezes { font-size: max(var(--mt-piso, 0cqw), 18.6cqw); }
}
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 730px) {
  .vezes { font-size: max(var(--mt-piso, 0cqw), 17cqw); }
}
</style>
<section class="mt-peca oferta-parcelado">
  <div class="marca-nome" data-campo="marca" data-repete="marca">Clínica <b>Vida</b></div>
  <div class="bloco">
    <p class="kicker" data-entrada="esquerda" data-ordem="2"><i aria-hidden="true"></i><span data-campo="kicker">Check-up anual</span></p>
    <h1 data-campo="titulo" data-entrada="subir" data-ordem="3">Exames de rotina num dia só</h1>
    <ul class="inclui">
      <li data-campo="item1" data-entrada="aparecer" data-ordem="4">Consulta com clínico geral</li>
      <li data-campo="item2" data-entrada="aparecer" data-ordem="5">Exames de sangue e urina</li>
      <li data-campo="item3" data-entrada="aparecer" data-ordem="6">Eletrocardiograma</li>
    </ul>
  </div>
  <div class="parcela" data-entrada="crescer" data-ordem="1">
    <span class="vezes"><span data-campo="vezes">10</span><small aria-hidden="true">×</small></span>
    <span class="de" data-campo="de">sem juros, de</span>
    <span class="valor"><small aria-hidden="true">R$</small><span data-campo="parcela">39</span><sup data-campo="centavos">,90</sup></span>
    <span class="total" data-campo="total">Total de R$ 399,00 no cartão</span>
  </div>
</section>
