<!--
  Cardápio da semana — família cardápio. Destaque e lateral.
  O refeitório (ou o prato feito de cada dia): uma linha por dia, o dia
  numa etiqueta na cor de destaque e o prato em letra grande. Sem preço:
  quem tem preço usa os cardápios com coluna de valor. Dia com o prato em
  branco some. A nota do pé é o que vale todo dia (sobremesa, suco).
-->
<style>
.mt-peca { overflow-wrap: break-word; display: flex; flex-direction: column; justify-content: center; padding: 7cqmin 7cqw;
  color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(120% 100% at 100% 0%, var(--mt-fundo-2), var(--mt-fundo) 60%); }
.cabeca { display: flex; align-items: flex-end; justify-content: space-between; gap: 5cqw; }
.kicker { display: flex; align-items: center; gap: 2cqmin; font: 700 max(var(--mt-piso, 0cqw), 3.6cqmin)/1.15 var(--mt-fonte-texto); letter-spacing: .08em; text-transform: uppercase; color: var(--mt-preco); }
/* O fio do kicker fica na altura da primeira linha, mesmo quando o kicker quebra. */
.kicker { align-items: flex-start; }
.kicker i { display: block; flex: none; align-self: flex-start; width: 6cqmin; height: .9cqmin; margin-top: .52em; border-radius: 1cqmin; background: var(--mt-destaque); }
h1 { margin-top: 2cqmin; font: 600 max(var(--mt-piso, 0cqw), calc(12cqmin * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.01em; }
.quando { flex: none; margin-bottom: 1cqmin; font: 600 max(var(--mt-piso, 0cqw), 4.4cqmin)/1.2 var(--mt-fonte-texto); color: var(--mt-texto-suave); text-align: right; }
.dias { list-style: none; margin: 4.4cqmin 0 0; padding: 0; }
.dias li { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 4cqmin; padding: 2cqmin 0; border-top: .4cqmin solid var(--mt-linha); }
.dias li:last-child { border-bottom: .4cqmin solid var(--mt-linha); }
.dias li:has(.prato:empty) { display: none; }
/* A etiqueta do dia: largura em em, a mesma para os cinco, e cresce com a letra. */
.dia { justify-self: start; min-width: 3.6em; padding: .25em .5em; border-radius: var(--mt-raio); background: var(--mt-destaque); color: var(--mt-sobre-destaque); text-align: center;
  font: 700 max(var(--mt-piso, 0cqw), 4cqmin)/1.1 var(--mt-fonte-texto); letter-spacing: .08em; text-transform: uppercase; }
.prato { font: 600 max(var(--mt-piso, 0cqw), 6.2cqmin)/1.15 var(--mt-fonte-texto); text-wrap: balance; }
.nota { margin-top: 3.6cqmin; font: 500 max(var(--mt-piso, 0cqw), 4.4cqmin)/1.3 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
/* A principal ao lado da lateral: sem o kicker (o título já diz), linhas mais justas. */
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 860px) {
  .mt-peca { padding: 6cqmin 6cqw; }
  .kicker { display: none; }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(9.4cqmin * var(--mt-escala-titulo, 1))); }
  .dias { margin-top: 3cqmin; }
  .dias li { padding: 1.3cqmin 0; }
  .dia { font-size: max(var(--mt-piso, 0cqw), 3.6cqmin); }
  .prato { font-size: max(var(--mt-piso, 0cqw), 5.2cqmin); }
  .nota { margin-top: 2.6cqmin; font-size: max(var(--mt-piso, 0cqw), 3.8cqmin); }
}
/* Em pé: a mesma lista, mais alta; o horário vai para baixo do título. */
@container (aspect-ratio < 1.25) {
  .mt-peca { padding: 8cqmin 8cqw; }
  .cabeca { flex-direction: column; align-items: flex-start; gap: 2cqmin; }
  .quando { text-align: left; margin-bottom: 0; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(11cqw * var(--mt-escala-titulo, 1))); }
  .dias { margin-top: 6cqmin; }
}
@container (aspect-ratio < 0.8) and (min-width: 701px) {
  .kicker { font-size: max(var(--mt-piso, 0cqw), 4.4cqw); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(13.4cqw * var(--mt-escala-titulo, 1))); }
  .quando { font-size: max(var(--mt-piso, 0cqw), 5.2cqw); }
  .dias { margin-top: 8cqw; }
  .dias li { column-gap: 4.4cqw; padding: 4cqw 0; }
  .dia { font-size: max(var(--mt-piso, 0cqw), 4.6cqw); }
  .prato { font-size: max(var(--mt-piso, 0cqw), 6.8cqw); }
  .nota { margin-top: 6cqw; font-size: max(var(--mt-piso, 0cqw), 5cqw); }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { padding: 6cqmin 7cqw; }
  .cabeca { flex-direction: row; align-items: flex-end; }
  .kicker { display: none; }
  .quando { text-align: right; }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(8.4cqmin * var(--mt-escala-titulo, 1))); }
  .dias { margin-top: 3cqmin; }
  .dias li { padding: .9cqmin 0; }
  .dia { padding: .15em .5em; font-size: max(var(--mt-piso, 0cqw), 3.4cqmin); }
  .prato { font-size: max(var(--mt-piso, 0cqw), 4.6cqmin); line-height: 1.1; }
  /* Quadrada: cinco linhas com a letra da TV já enchem a peça — a nota do pé sai (o "todo dia" fica para a lateral e a deitada). */
  .nota { display: none; }
}
/* A lateral: o dia em cima do prato; sem o horário e a nota. */
@container (max-width: 700px) {
  .kicker { font-size: max(var(--mt-piso, 0cqw), 6cqw); letter-spacing: .06em; }
  .kicker i, .quando, .nota { display: none; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(12cqw * var(--mt-escala-titulo, 1))); }
  .dias { margin-top: 5cqw; }
  .dias li { grid-template-columns: 1fr; row-gap: 1.2cqw; padding: 2.4cqw 0; }
  .dia { font-size: max(var(--mt-piso, 0cqw), 5cqw); }
  .prato { font-size: max(var(--mt-piso, 0cqw), 7cqw); }
}
/* Deitada e baixa: o título e os cinco dias, sem o resto. */
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { padding: 5cqmin 6cqw; }
  .kicker, .quando, .nota { display: none; }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(10cqmin * var(--mt-escala-titulo, 1))); }
  .dias { margin-top: 2.4cqmin; }
  .dias li { padding: .8cqmin 0; border-top-width: .3cqmin; }
  .dia { padding: .1em .5em; }
}
</style>
<section class="mt-peca cardapio-semana">
  <div class="cabeca">
    <div>
      <p class="kicker" data-entrada="esquerda"><i aria-hidden="true"></i><span data-campo="kicker">Refeitório</span></p>
      <h1 data-campo="titulo" data-entrada="subir" data-ordem="1">Cardápio da semana</h1>
    </div>
    <p class="quando" data-campo="quando" data-entrada="aparecer" data-ordem="2">Almoço das 11h às 14h</p>
  </div>
  <ul class="dias">
    <li data-entrada="subir" data-ordem="2"><span class="dia" data-campo="dia1">Seg</span><span class="prato" data-campo="prato1">Frango assado com polenta</span></li>
    <li data-entrada="subir" data-ordem="3"><span class="dia" data-campo="dia2">Ter</span><span class="prato" data-campo="prato2">Carne de panela com batata</span></li>
    <li data-entrada="subir" data-ordem="4"><span class="dia" data-campo="dia3">Qua</span><span class="prato" data-campo="prato3">Feijoada com couve</span></li>
    <li data-entrada="subir" data-ordem="5"><span class="dia" data-campo="dia4">Qui</span><span class="prato" data-campo="prato4">Strogonoff de frango</span></li>
    <li data-entrada="subir" data-ordem="6"><span class="dia" data-campo="dia5">Sex</span><span class="prato" data-campo="prato5">Peixe empanado com purê</span></li>
  </ul>
  <p class="nota" data-campo="nota" data-entrada="aparecer" data-ordem="7">Todo dia: arroz, feijão, salada e fruta</p>
</section>
