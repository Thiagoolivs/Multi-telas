<!--
  Depoimento com o laço — família social (lote 5, arquétipo A7, docs/design/SISTEMA-VISUAL.md).
  O ofício em vídeo (o corte, a solda, a massa) numa metade; na outra, em
  fundo cheio, a aspa grande, a frase de quem viveu e o nome. A frase se
  revela por linha; um fio curto da cor de destaque se desenha antes do nome.
-->
<style>
.mt-peca { --f: 2.6cqw; --t: 5.2cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo); display: grid; grid-template-columns: 1fr 1fr; }
.foto { grid-row: 1; grid-column: 1; width: 100%; height: 100%; min-height: 0; object-fit: cover; object-position: 50% 50%; }
.texto { grid-row: 1; grid-column: 2; min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 8cqh 6cqw 8cqh 5cqw; }
.aspa { height: .5em; font: 500 max(var(--mt-piso, 0cqw), calc(16cqw * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); color: var(--mt-destaque); }
.frase { margin-top: 2cqh; font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/1.12 var(--mt-fonte-titulo); letter-spacing: -.005em; text-wrap: pretty; }
.quem { margin-top: 5cqh; }
.quem i { display: block; width: 4cqw; height: .2cqw; background: var(--mt-destaque); }
.quem p { margin-top: 2cqh; font: 400 max(var(--mt-piso, 0cqw), var(--f))/1.25 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
.quem b { display: block; font-weight: 600; color: var(--mt-texto); }

@container ((aspect-ratio >= 1.25) and (max-height: 900px)) or ((aspect-ratio >= 1.25) and (aspect-ratio < 1.6) and (max-height: 940px)) {
  .mt-peca { --f: 3.5cqw; --t: 4.6cqw; }
  .texto { padding: 5cqh 4cqw 5cqh 4cqw; }
  .aspa { font-size: max(var(--mt-piso, 0cqw), calc(10cqw * var(--mt-escala-titulo, 1))); }
  .frase { margin-top: 1.4cqh; }
  .quem { margin-top: 3cqh; }
  .quem p { margin-top: 1.4cqh; }
}
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { --f: 4.8cqw; --t: 5cqw; grid-template-columns: 44fr 56fr; }
  .texto { padding: 4cqh 4cqw; }
  .aspa, .quem i, .quem span { display: none; }
  .frase { margin-top: 0; }
  .quem { margin-top: 2cqh; }
  .quem p { margin-top: 0; }
}
/* Em pé: o vídeo em cima, a frase embaixo. */
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 5.2cqw; --t: 9.4cqw; grid-template-columns: 1fr; grid-template-rows: 46fr 54fr; }
  .foto { grid-row: 1; grid-column: 1; }
  .texto { grid-row: 2; grid-column: 1; padding: 4cqh 7cqw 6cqh; }
  .aspa { font-size: max(var(--mt-piso, 0cqw), calc(22cqw * var(--mt-escala-titulo, 1))); }
  .quem i { width: 7cqw; height: .36cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.6cqw; --t: 6.6cqw; grid-template-rows: 44fr 56fr; }
  .texto { padding: 3.4cqh 7cqw 5cqh; }
  .aspa { display: none; }
  .frase { margin-top: 0; }
  .quem { margin-top: 3cqh; }
}
@container (max-width: 700px) {
  .mt-peca { --f: 9.6cqw; --t: 9.6cqw; grid-template-rows: 36fr 64fr; }
  .texto { padding: 3cqh 8cqw 4cqh; }
  .aspa, .quem i, .quem span { display: none; }
  .frase { margin-top: 0; line-height: 1.1; }
  .quem { margin-top: 2.4cqh; }
  .quem p { margin-top: 0; }
}
</style>
<section class="mt-peca cena-depoimento">
  <img class="foto" data-campo-img="foto" alt="" data-entrada="aproximar" data-continua="kenburns">
  <div class="texto">
    <p class="aspa" aria-hidden="true" data-entrada="aproximar" data-ordem="2">“</p>
    <p class="frase" data-campo="citacao" data-entrada="revelar" data-ordem="3">Saio daqui outra pessoa. E o corte dura o mês inteiro.</p>
    <div class="quem">
      <i aria-hidden="true" data-entrada="desenhar" data-ordem="8"></i>
      <p data-entrada="aparecer" data-ordem="9"><b data-campo="nome">Rafael Lima</b><span data-campo="detalhe">Cliente há três anos</span></p>
    </div>
  </div>
</section>
