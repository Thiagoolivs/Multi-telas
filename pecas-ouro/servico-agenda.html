<!--
  Serviço com preço e QR para agendar — família serviço. Destaque e lateral.
  O que é, quanto tempo leva, quanto custa — e o QR que já abre a conversa
  para marcar. O QR é desenhado pelo nosso servidor a partir do link
  (`data-campo-qr`) e tem fundo próprio: lê em qualquer modo. A peça é um
  fluxo só: em pé, um bloco embaixo do outro; deitada, o QR vai para a
  direita. Medidas em cqmin, como as outras peças de lateral.
-->
<style>
.mt-peca { display: flex; flex-direction: column; justify-content: center; gap: 6cqmin; padding: 9cqmin;
  color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(110% 80% at 0% 0%, var(--mt-fundo-2), var(--mt-fundo) 66%); }
.kicker { display: flex; align-items: center; gap: 2.4cqmin; font: 600 max(var(--mt-piso, 0cqw), 3.6cqmin)/1 var(--mt-fonte-texto); letter-spacing: .28em; text-transform: uppercase; color: var(--mt-destaque); }
.kicker i { display: block; width: 6cqmin; height: .5cqmin; background: var(--mt-destaque); }
h1 { font: 400 max(var(--mt-piso, 0cqw), 11cqmin)/1.02 var(--mt-fonte-titulo); margin-top: 4.4cqmin; }
h1 span, h1 em { display: block; white-space: nowrap; }
h1 em { font-style: italic; color: var(--mt-destaque); }
.meta { margin-top: 4cqmin; font: 500 max(var(--mt-piso, 0cqw), 3.8cqmin)/1.4 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
.preco { margin-top: 5cqmin; padding-top: 5cqmin; border-top: .5cqmin solid var(--mt-linha); }
.valor { font: 400 max(var(--mt-piso, 0cqw), 17cqmin)/.8 var(--mt-fonte-titulo); color: var(--mt-preco); white-space: nowrap; }
.valor small { font-size: max(var(--mt-piso, 0cqw), .3em); vertical-align: 1.5em; margin-right: .25em; }
.valor sup { font-size: max(var(--mt-piso, 0cqw), .36em); vertical-align: 1.15em; }
.agendar { display: flex; align-items: center; gap: 4cqmin; }
.qr { flex: none; margin: 0; width: 34cqmin; height: 34cqmin; padding: 1.4cqmin; border-radius: var(--mt-raio); background: var(--mt-superficie);
  box-shadow: 0 0 0 .6cqmin var(--mt-destaque); }
.qr img { width: 100%; height: 100%; border-radius: calc(var(--mt-raio) * .6); }
.pedido { font: 600 max(var(--mt-piso, 0cqw), 3.6cqmin)/1.35 var(--mt-fonte-texto); letter-spacing: .16em; text-transform: uppercase; }
.pedido small { display: block; margin-top: 2cqmin; font: 500 max(var(--mt-piso, 0cqw), 3.4cqmin)/1.3 var(--mt-fonte-texto); letter-spacing: .02em; text-transform: none; color: var(--mt-texto-suave); }
/* Deitada: o serviço à esquerda, o QR grande à direita. */
@container (aspect-ratio >= 1.25) {
  .mt-peca { flex-direction: row; align-items: center; justify-content: space-between; padding: 0 8cqw 0 6cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 3cqmin); }
  h1 { font-size: max(var(--mt-piso, 0cqw), 12cqmin); }
  .meta { font-size: max(var(--mt-piso, 0cqw), 3.2cqmin); }
  .preco { width: 40cqw; }
  .agendar { flex-direction: column; gap: 5cqmin; text-align: center; }
  .qr { width: 52cqmin; height: 52cqmin; }
  .pedido { font-size: max(var(--mt-piso, 0cqw), 3cqmin); }
  .pedido small { font-size: max(var(--mt-piso, 0cqw), 3cqmin); }
}
/* Em pé numa tela inteira: tudo maior, e o QR com espaço em volta. */
@container (aspect-ratio < 0.8) and (min-width: 701px) {
  .mt-peca { gap: 12cqmin; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 3.4cqmin); }
  h1 { font-size: max(var(--mt-piso, 0cqw), 15cqmin); margin-top: 6cqmin; }
  .meta { font-size: max(var(--mt-piso, 0cqw), 4cqmin); margin-top: 5cqmin; }
  .valor { font-size: max(var(--mt-piso, 0cqw), 24cqmin); }
  .preco { margin-top: 8cqmin; padding-top: 8cqmin; }
  .agendar { gap: 6cqmin; }
  .qr { width: 40cqmin; height: 40cqmin; }
  .pedido { font-size: max(var(--mt-piso, 0cqw), 4cqmin); }
  .pedido small { font-size: max(var(--mt-piso, 0cqw), 3.8cqmin); }
}
/* Quase quadrada: tudo um pouco menor, para a coluna caber. */
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { gap: 5cqmin; padding: 8cqmin; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 3cqmin); }
  h1 { font-size: max(var(--mt-piso, 0cqw), 10cqmin); margin-top: 3.6cqmin; }
  .meta { font-size: max(var(--mt-piso, 0cqw), 3.2cqmin); margin-top: 3cqmin; }
  .preco { margin-top: 4cqmin; padding-top: 4cqmin; }
  .valor { font-size: max(var(--mt-piso, 0cqw), 15cqmin); }
  .qr { width: 26cqmin; height: 26cqmin; }
  .pedido, .pedido small { font-size: max(var(--mt-piso, 0cqw), 3cqmin); }
}
/* A coluna estreita: o que fica, maior; o pedido fica só o rótulo. */
@container (max-width: 700px) {
  /* Com a letra do balcão: o espaçado do kicker e do pedido quebrava em três linhas; menos espaço entre as letras e entre os blocos. */
  .mt-peca { gap: 6cqmin; padding: 7cqmin 8cqw; }
  .kicker { letter-spacing: .1em; line-height: 1.1; }
  .kicker i { display: none; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 12.6cqmin); margin-top: 3.4cqmin; }
  .meta { margin-top: 3cqmin; font-size: max(var(--mt-piso, 0cqw), 4cqmin); line-height: 1.22; }
  .preco { margin-top: 3.6cqmin; padding-top: 3.6cqmin; }
  .valor { font-size: max(var(--mt-piso, 0cqw), 21cqmin); }
  .qr { width: 42cqmin; height: 42cqmin; }
  .pedido { font-size: max(var(--mt-piso, 0cqw), 4cqmin); letter-spacing: .04em; line-height: 1.15; }
  .pedido small { display: none; }
}
/*
 * A lateral no tamanho da TV com a margem contra o corte de 2,5% ou mais
 * (473×717 e menor; a caixa sem o padding abaixo de 690 px): com a letra
 * do balcão o kicker passava do alto e o pedido do pé, e o QR, medido pela
 * caixa, ficava abaixo dos 160 px que o celular lê. O QR fica com 160 px
 * ou mais; o preço encolhe um pouco e os respiros apertam; bem baixa (4%
 * para cima), o kicker sai.
 */
@container (max-width: 700px) and (max-height: 745px) {
  .mt-peca { gap: 3.6cqmin; }
}
@container (max-width: 700px) and (max-height: 690px) {
  h1 { margin-top: 2cqmin; line-height: 1; }
  .meta { margin-top: 1.6cqmin; line-height: 1.12; }
  .preco { margin-top: 2.4cqmin; padding-top: 2.4cqmin; }
  .valor { font-size: max(var(--mt-piso, 0cqw), 18cqmin); }
  .qr { width: 46cqmin; height: 46cqmin; padding: 1.2cqmin; }
}
@container (max-width: 700px) and (max-height: 640px) {
  .kicker { display: none; }
  h1 { margin-top: 0; }
}
/*
 * A principal do Corporativo com a margem contra o corte (de 1321×739 a
 * 1236×674): o preço descia até 2 px da borda. O kicker e o pedido apertam
 * o espaçado (uma linha a menos cada), a meta, a entrelinha, e o preço fica
 * um pouco menor.
 */
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 775px) {
  .kicker { letter-spacing: .08em; }
  .meta { line-height: 1.2; }
  .preco { margin-top: 3.4cqmin; padding-top: 3.4cqmin; }
  .valor { font-size: max(var(--mt-piso, 0cqw), 15cqmin); }
  .pedido { letter-spacing: .06em; }
}
/*
 * A lateral com a margem contra o corte de 5% (452×674; a caixa sem o
 * padding abaixo de 620 px): o "Agende pelo QR" passava da borda direita.
 * O vão entre o QR e o pedido aperta e o QR fica com 44% (167 px).
 */
@container (max-width: 700px) and (max-height: 620px) {
  .agendar { gap: 3cqmin; }
  .qr { width: 44cqmin; height: 44cqmin; }
}
</style>
<section class="mt-peca servico-agenda">
  <div class="servico">
    <p class="kicker" data-entrada="esquerda" data-ordem="1"><i aria-hidden="true"></i><span data-campo="kicker">Serviço da semana</span></p>
    <h1 data-entrada="subir" data-ordem="2"><span data-campo="titulo">Escova</span><em data-campo="titulo2">e hidratação</em></h1>
    <p class="meta" data-campo="meta" data-entrada="aparecer" data-ordem="3">1h30 · com a Ana ou a Bia</p>
    <div class="preco" data-entrada="subir" data-ordem="4">
      <span class="valor"><small aria-hidden="true">R$</small><span data-campo="preco">89</span><sup data-campo="centavos">,90</sup></span>
    </div>
  </div>
  <div class="agendar" data-entrada="crescer" data-ordem="5">
    <figure class="qr"><img data-campo-qr="link" alt="QR para agendar pelo WhatsApp"></figure>
    <p class="pedido"><span data-campo="pedido">Agende pelo QR</span><small data-campo="pedido-apoio">Abre a conversa no WhatsApp</small></p>
  </div>
</section>
