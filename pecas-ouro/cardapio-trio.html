<!--
  Vitrine de três — família cardápio (lote 4, arquétipos A5 + A9).
  Três produtos em foto, cada um com o nome e o preço embaixo, sob um
  título curto: a vitrine da padaria, os doces do dia, os sanduíches.
  Deitada são três colunas iguais; em pé e quadrada, três linhas (a foto à
  esquerda, o texto à direita). Fotos do mesmo papel (produto) para a grade
  ficar uniforme.
-->
<style>
.mt-peca { --f: 2.6cqw; --t: 5cqw; --p: 4.4cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo);
  display: flex; flex-direction: column; padding: 6cqh 6cqw 6cqh; }
.cabeca { flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 3cqw; padding-bottom: 2cqh; border-bottom: .14cqw solid var(--mt-linha); }
h1 { font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.01em; }
.kicker { font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.1 var(--mt-fonte-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--mt-destaque); }
.grade { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3cqw; margin-top: 4cqh; }
.item { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.item img { flex: 1 1 auto; width: 100%; min-height: 0; object-fit: cover; object-position: 50% 50%; }
.item p { flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 1.4cqw; margin-top: 2cqh; }
.item span { min-width: 0; font: 500 max(var(--mt-piso, 0cqw), var(--f))/1.15 var(--mt-fonte-texto); text-wrap: balance; }
.item b { flex: none; font: 500 max(var(--mt-piso, 0cqw), calc(var(--p) * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); color: var(--mt-preco); white-space: nowrap; }

@container (aspect-ratio >= 1.25) and (max-height: 900px) {
  .mt-peca { --f: 3.5cqw; --t: 4.8cqw; --p: 4.6cqw; padding: 5.4cqh 4cqw 5cqh; }
  .kicker { display: none; }
  .grade { gap: 2.4cqw; margin-top: 3cqh; }
  .item p { flex-direction: column; gap: .6cqh; margin-top: 1.4cqh; }
}
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.6cqw; --t: 9cqw; --p: 8cqw; padding: 5cqh 7cqw 5cqh; }
  .cabeca { flex-direction: column; align-items: flex-start; gap: 1.4cqh; border-bottom-width: .24cqw; }
  .kicker { order: -1; }
  .grade { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 3cqh; margin-top: 3cqh; }
  .item { display: grid; grid-template-columns: 46fr 54fr; gap: 5cqw; align-items: center; }
  .item img { height: 100%; }
  .item p { flex-direction: column; align-items: flex-start; gap: 1.4cqh; margin-top: 0; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --t: 7cqw; --p: 6.4cqw; padding: 4cqh 6cqw 4cqh; }
  .kicker { display: none; }
  .grade { gap: 2.4cqh; margin-top: 2.4cqh; }
  .item { grid-template-columns: 40fr 60fr; }
  .item p { flex-direction: row; align-items: baseline; justify-content: space-between; width: 100%; }
}
</style>
<section class="mt-peca cardapio-trio">
  <header class="cabeca">
    <h1 data-campo="titulo" data-entrada="revelar" data-ordem="1">Da vitrine de hoje</h1>
    <p class="kicker" data-campo="kicker" data-entrada="aparecer" data-ordem="3">Saídos do forno</p>
  </header>
  <div class="grade">
    <figure class="item" data-entrada="subir" data-ordem="3"><img data-campo-img="foto" alt="" data-entrada="aproximar" data-ordem="3"><p><span data-campo="nome1">Croissant de manteiga</span><b data-campo="preco1" data-entrada="contar" data-ordem="5">9,50</b></p></figure>
    <figure class="item" data-entrada="subir" data-ordem="4"><img data-campo-img="foto2" alt="" data-entrada="aproximar" data-ordem="4"><p><span data-campo="nome2">Bolo de café</span><b data-campo="preco2" data-entrada="contar" data-ordem="6">12</b></p></figure>
    <figure class="item" data-entrada="subir" data-ordem="5"><img data-campo-img="foto3" alt="" data-entrada="aproximar" data-ordem="5"><p><span data-campo="nome3">Pão rústico</span><b data-campo="preco3" data-entrada="contar" data-continua="reflexo" data-ordem="7">22</b></p></figure>
  </div>
</section>
