<!--
  Frase grande — família institucional (lote 4, arquétipo A6, docs/design/SISTEMA-VISUAL.md).
  A tipografia é a peça: uma frase curta na letra do título, enorme, sobre
  o fundo cheio da marca, e uma coluna estreita de foto (textura ou
  ambiente) em corte seco, como a lombada de um livro. O kicker e a
  assinatura ficam pequenos e longe da frase. --f é a letra de leitura e
  --t a da frase; cada formato redefine as duas acima do piso da TV.
-->
<style>
.mt-peca { --f: 2.6cqw; --t: 7.6cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo); display: grid; grid-template-columns: 74fr 26fr; }
.texto { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 8cqh 6cqw 8cqh 6cqw; }
.foto { width: 100%; height: 100%; min-height: 0; object-fit: cover; object-position: 50% 50%; }
.kicker { display: flex; align-items: center; gap: 1.2cqw; font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.1 var(--mt-fonte-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--mt-destaque); }
.kicker i { flex: none; display: block; width: 3.2cqw; height: .16cqw; background: var(--mt-destaque); }
h1 { margin: 4cqh 0; font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/1.02 var(--mt-fonte-titulo); letter-spacing: -.015em; text-wrap: balance; }
h1 span, h1 em { display: block; }
h1 em { font-style: normal; color: var(--mt-destaque); }
.assina { padding-top: 2cqh; border-top: .14cqw solid var(--mt-linha); display: flex; flex-wrap: wrap; gap: .6cqh 2.4cqw; align-items: baseline; font: 500 max(var(--mt-piso, 0cqw), var(--f))/1.2 var(--mt-fonte-texto); }
.assina b { font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.assina span { color: var(--mt-texto-suave); }

@container (aspect-ratio >= 1.25) and (max-height: 900px) {
  .mt-peca { --f: 3.5cqw; --t: 7.4cqw; grid-template-columns: 76fr 24fr; }
  .texto { padding: 6cqh 5cqw; }
  .kicker { letter-spacing: .06em; }
  .kicker i { display: none; }
  h1 { margin: 3cqh 0; }
}
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { --f: 4.8cqw; --t: 6.2cqw; }
  .kicker, .assina { display: none; }
  .texto { justify-content: center; }
  h1 { margin: 0; }
}
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.6cqw; --t: 12.4cqw; grid-template-columns: 1fr; grid-template-rows: 24fr 76fr; }
  .foto { grid-row: 1; }
  .texto { grid-row: 2; padding: 6cqh 7cqw 7cqh; }
  .kicker i { width: 5cqw; height: .26cqw; }
  .assina { border-top-width: .24cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --t: 9.6cqw; grid-template-columns: 74fr 26fr; grid-template-rows: 1fr; }
  .foto, .texto { grid-row: 1; }
  .texto { padding: 7cqh 6cqw; }
}
@container (max-width: 700px) {
  .mt-peca { --f: 9.6cqw; --t: 14cqw; grid-template-rows: 22fr 78fr; }
  .texto { padding: 4cqh 8cqw 5cqh; }
  .kicker { letter-spacing: .02em; text-transform: none; }
  .kicker i, .assina span { display: none; }
  .assina b { letter-spacing: .04em; }
}
/* A lateral com a margem contra o corte de 3,5% ou mais (468×707 e menor): a assinatura descia até a borda de baixo. A faixa da foto fica mais baixa e o título respira menos. */
@container (max-width: 700px) and (max-height: 715px) {
  .mt-peca { grid-template-rows: 16fr 84fr; }
  .texto { padding: 3cqh 8cqw 4cqh; }
  h1 { margin: 2.4cqh 0; }
}
</style>
<section class="mt-peca frase-faixa">
  <div class="texto">
    <p class="kicker" data-entrada="esquerda" data-ordem="1"><i aria-hidden="true"></i><span data-campo="kicker">O que nos move</span></p>
    <h1 data-entrada="subir" data-ordem="2"><span data-campo="titulo">Pão bom leva tempo.</span><em data-campo="titulo2">A gente espera.</em></h1>
    <p class="assina" data-entrada="aparecer" data-ordem="3"><b data-campo="marca" data-repete="marca">Padaria do Bairro</b><span data-campo="detalhe">Fermentação de 24 horas</span></p>
  </div>
  <img class="foto" data-campo-img="foto" alt="" data-entrada="aparecer">
</section>
