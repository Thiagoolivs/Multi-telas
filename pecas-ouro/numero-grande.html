<!--
  Número grande — família institucional. Destaque e lateral.
  Um número que prova algo ("25 anos", "12 mil clientes") ocupando metade
  da peça, e a frase que o explica do outro lado de um filete. Sem foto:
  a tipografia é a imagem.
-->
<style>
.mt-peca { color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(110% 120% at 0% 100%, var(--mt-fundo-2), var(--mt-fundo) 58%); }
.marca-nome { position: absolute; left: 6cqw; top: 6cqh; font: 600 max(var(--mt-piso, 0cqw), 1.25cqw)/1 var(--mt-fonte-texto); letter-spacing: .42em; text-transform: uppercase; }
.marca-nome b { font-weight: 800; }
.numero { position: absolute; left: 5cqw; top: 50%; transform: translateY(-54%); width: 36cqw; }
.numero > span { display: block; font: 400 max(var(--mt-piso, 0cqw), 25cqw)/.78 var(--mt-fonte-titulo); color: var(--mt-destaque); letter-spacing: -.01em; }
.numero small { display: block; margin: 1.6cqw 0 0 .6cqw; font: 600 max(var(--mt-piso, 0cqw), 1.6cqw)/1 var(--mt-fonte-texto); letter-spacing: .5em; text-transform: uppercase; }
.texto { position: absolute; left: 45cqw; right: 8cqw; top: 50%; transform: translateY(-50%); padding-left: 4cqw; border-left: .12cqw solid var(--mt-linha); }
.kicker { display: flex; align-items: center; gap: 1.1cqw; font: 600 max(var(--mt-piso, 0cqw), 1.25cqw)/1 var(--mt-fonte-texto); letter-spacing: .3em; text-transform: uppercase; color: var(--mt-destaque); }
.kicker i { display: block; width: 3.6cqw; height: .14cqw; background: var(--mt-destaque); }
h1 { font: 400 max(var(--mt-piso, 0cqw), 4.6cqw)/1.02 var(--mt-fonte-titulo); text-transform: uppercase; margin: 2.2cqw 0 2.2cqw; text-wrap: balance; }
.apoio { font: 400 max(var(--mt-piso, 0cqw), 1.5cqw)/1.55 var(--mt-fonte-texto); color: var(--mt-texto-suave); max-width: 36cqw; }
.assinatura { position: absolute; right: 8cqw; bottom: 6cqh; font: 600 max(var(--mt-piso, 0cqw), 1.05cqw)/1 var(--mt-fonte-texto); letter-spacing: .3em; text-transform: uppercase; color: var(--mt-texto-suave); }
/* Em pé e quase quadrada: o número em cima, a frase embaixo. */
@container (aspect-ratio < 1.25) {
  .marca-nome { left: 8cqw; top: 5cqh; font-size: max(var(--mt-piso, 0cqw), 2cqw); }
  .numero { left: 7cqw; right: 8cqw; width: auto; top: 13cqh; transform: none; }
  .numero > span { font-size: max(var(--mt-piso, 0cqw), calc(46cqw * var(--mt-escala-titulo, 1))); }
  .numero small { font-size: max(var(--mt-piso, 0cqw), 3cqw); margin-top: 2.6cqw; }
  .texto { left: 8cqw; right: 8cqw; top: auto; bottom: 14cqh; transform: none; padding: 4cqw 0 0; border-left: 0; border-top: .2cqw solid var(--mt-linha); }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 2cqw); }
  .kicker i { width: 5.5cqw; height: .22cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 7.6cqw); margin: 3cqw 0 2.6cqw; }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 2.7cqw); max-width: none; }
  .assinatura { left: 8cqw; right: auto; bottom: 5cqh; font-size: max(var(--mt-piso, 0cqw), 1.9cqw); }
}
/* Quadrada: o número (menor, ~1/3 do lado) no canto de cima, à direita; a frase com a largura toda embaixo. Com a letra da TV, o número de 46% empurrava a frase para cima dele. */
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .marca-nome { letter-spacing: .24em; }
  .numero { left: auto; top: 6cqh; text-align: right; }
  .numero > span { font-size: max(var(--mt-piso, 0cqw), calc(32cqw * var(--mt-escala-titulo, 1))); }
  .numero small { letter-spacing: .24em; margin-right: -.24em; }
  .texto { bottom: 12cqh; padding-top: 3cqw; }
  .apoio { line-height: 1.4; }
  .assinatura { right: 8cqw; letter-spacing: .04em; }
}
/*
 * A principal do Corporativo com a margem contra o corte (de 1321×739 a
 * 1236×674): com a letra do balcão o nome da loja espaçado encostava no
 * kicker, o endereço quebrava por cima do apoio e o apoio passava do pé. O
 * espaçado largo aperta (o endereço numa linha), o apoio usa a largura da
 * coluna e a entrelinha fica mais justa.
 */
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 775px) {
  .marca-nome { letter-spacing: .14em; }
  .numero small { letter-spacing: .2em; }
  .texto { right: 6cqw; }
  .kicker { letter-spacing: .08em; }
  h1 { margin: 1.4cqw 0; }
  .apoio { max-width: none; line-height: 1.25; }
  .assinatura { right: 6cqw; letter-spacing: .06em; }
}
/* A lateral: o número e a frase; o resto sai. */
@container (max-width: 700px) {
  /* Com a letra do balcão os blocos presos no alto, no meio e no pé se encontravam: aqui eles vão um embaixo
     do outro, centrados, e o espaçado das letras diminui. */
  .mt-peca { display: flex; flex-direction: column; justify-content: center; gap: 4.4cqw; padding: 6cqmin 7cqw; }
  .marca-nome, .numero, .texto, .assinatura { position: static; width: auto; transform: none; }
  .apoio, .kicker i { display: none; }
  .marca-nome { font-size: max(var(--mt-piso, 0cqw), 3.2cqw); letter-spacing: .08em; line-height: 1.1; }
  .numero small { margin-top: 4cqw; font-size: max(var(--mt-piso, 0cqw), 4.4cqw); letter-spacing: .14em; }
  .texto { padding-top: 3.6cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 3.4cqw); letter-spacing: .06em; }
  h1 { margin: 2cqw 0 0; font-size: max(var(--mt-piso, 0cqw), 9.6cqw); }
  /* Com a letra da TV, o endereço espaçado passava da margem na lateral: fica justo e pode quebrar.
     3,4cqw: o cqw aqui é da peça sem o respiro dela (o padding acima), e sem piso (a miniatura) ele não pode ficar abaixo de 14px. */
  .assinatura { font-size: max(var(--mt-piso, 0cqw), 3.4cqw); letter-spacing: .04em; line-height: 1.2; }
}
/*
 * A lateral no tamanho da TV (504×782 sem margem, 452×674 com a margem
 * contra o corte de 5%; a caixa sem o padding abaixo de 740 px): com a
 * letra do balcão o nome da loja e o endereço passavam do alto e do pé. Os
 * dois vão em caixa baixa (uma linha a menos cada), o número encolhe um
 * pouco e os blocos chegam mais perto.
 */
@container (max-width: 700px) and (max-height: 800px) {
  .mt-peca { gap: 3cqw; }
}
@container (max-width: 700px) and (max-height: 740px) {
  .marca-nome, .assinatura { text-transform: none; letter-spacing: 0; line-height: 1.08; }
  .numero > span { font-size: max(var(--mt-piso, 0cqw), calc(38cqw * var(--mt-escala-titulo, 1))); }
  .numero small { margin-top: 2.6cqw; }
  .texto { padding-top: 2.6cqw; }
  h1 { line-height: .98; }
}
</style>
<section class="mt-peca numero-grande">
  <div class="marca-nome" data-campo="marca" data-repete="marca">Ótica <b>Central</b></div>
  <div class="numero" data-entrada="crescer" data-ordem="1"><span data-campo="numero">25</span><small data-campo="unidade">anos</small></div>
  <div class="texto">
    <p class="kicker" data-entrada="esquerda" data-ordem="2"><i aria-hidden="true"></i><span data-campo="kicker">Desde 2001</span></p>
    <h1 data-campo="titulo" data-entrada="subir" data-ordem="3">Cuidando da visão do bairro</h1>
    <p class="apoio" data-campo="apoio" data-entrada="aparecer" data-ordem="4">Exame de vista, lentes sob medida e ajuste na hora — com a mesma equipe de sempre.</p>
  </div>
  <div class="assinatura" data-campo="endereco" data-entrada="aparecer" data-ordem="5">Rua Augusta, 1200 · São Paulo</div>
</section>
