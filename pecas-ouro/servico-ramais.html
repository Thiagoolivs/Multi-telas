<!--
  Ramais e contatos úteis — família serviço. Destaque e lateral.
  Uma lista telefônica de parede: o setor à esquerda, o número grande à
  direita, ligados por pontilhado, como no índice de um livro. O número é
  o que se procura de longe, então é ele que tem a cor e o tamanho.
  Linha com o setor em branco some.
-->
<style>
.mt-peca { overflow-wrap: break-word; display: grid; grid-template-columns: 36fr 64fr; align-items: center; column-gap: 6cqw; padding: 8cqmin 7cqw;
  color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: linear-gradient(115deg, var(--mt-fundo) 40%, var(--mt-fundo-2)); }
.kicker { display: flex; align-items: center; gap: 2cqmin; font: 700 max(var(--mt-piso, 0cqw), 3.6cqmin)/1.15 var(--mt-fonte-texto); letter-spacing: .06em; text-transform: uppercase; color: var(--mt-preco); }
/* O fio do kicker fica na altura da primeira linha, mesmo quando o kicker quebra. */
.kicker { align-items: flex-start; }
.kicker i { display: block; flex: none; align-self: flex-start; width: 6cqmin; height: .9cqmin; margin-top: .52em; border-radius: 1cqmin; background: var(--mt-destaque); }
h1 { margin-top: 3cqmin; font: 600 max(var(--mt-piso, 0cqw), calc(15cqmin * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.01em; }
.nota { margin-top: 5cqmin; padding: 2.4cqmin 3cqmin; border-radius: var(--mt-raio); background: var(--mt-destaque); color: var(--mt-sobre-destaque);
  font: 700 max(var(--mt-piso, 0cqw), 4.2cqmin)/1.25 var(--mt-fonte-texto); }
.nota:empty { display: none; }
.lista { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; column-gap: 6cqmin; }
.lista li { display: flex; align-items: baseline; gap: 2cqmin; padding: 2.6cqmin 0; border-bottom: .4cqmin solid var(--mt-linha); }
.lista li:has(.setor:empty) { display: none; }
.setor { flex: 0 1 auto; min-width: 0; font: 600 max(var(--mt-piso, 0cqw), 4.4cqmin)/1.2 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
.pontos { flex: 1 1 4cqmin; align-self: center; min-width: 4cqmin; height: 0; border-bottom: .6cqmin dotted var(--mt-linha); }
.ramal { flex: none; font: 700 max(var(--mt-piso, 0cqw), calc(8.4cqmin * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); color: var(--mt-preco); letter-spacing: .01em; }
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 860px) {
  .mt-peca { grid-template-columns: 1fr; align-content: center; row-gap: 5cqmin; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(10cqmin * var(--mt-escala-titulo, 1))); margin-top: 2cqmin; }
  .cabeca { display: grid; grid-template-columns: 1fr auto; column-gap: 5cqw; align-items: end; }
  .nota { margin-top: 0; grid-row: 1 / span 2; grid-column: 2; align-self: end; }
  .lista li { padding: 2.2cqmin 0; }
}
/* Em pé: uma coluna só. */
@container (aspect-ratio < 1.25) {
  .mt-peca { grid-template-columns: 1fr; align-content: center; row-gap: 6cqmin; padding: 8cqmin 8cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(11cqw * var(--mt-escala-titulo, 1))); }
  .nota { margin-top: 4cqmin; }
  .lista { grid-template-columns: 1fr; }
  .setor { font-size: max(var(--mt-piso, 0cqw), 4.8cqw); }
  .ramal { font-size: max(var(--mt-piso, 0cqw), calc(8.4cqw * var(--mt-escala-titulo, 1))); }
}
@container (aspect-ratio < 0.8) and (min-width: 701px) {
  .mt-peca { row-gap: 9cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 4.4cqw); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(16cqw * var(--mt-escala-titulo, 1))); }
  .nota { margin-top: 5cqw; font-size: max(var(--mt-piso, 0cqw), 5cqw); padding: 3cqw 4cqw; }
  .lista li { padding: 3.6cqw 0; }
  .setor { font-size: max(var(--mt-piso, 0cqw), 5.8cqw); }
  .ramal { font-size: max(var(--mt-piso, 0cqw), calc(10cqw * var(--mt-escala-titulo, 1))); }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { row-gap: 4cqmin; padding: 7cqmin 7cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(9cqmin * var(--mt-escala-titulo, 1))); margin-top: 2cqmin; }
  .nota { margin-top: 3cqmin; padding: 1.6cqmin 2.6cqmin; }
  .lista li { padding: 1.6cqmin 0; }
  .setor { font-size: max(var(--mt-piso, 0cqw), 4cqmin); }
  .ramal { font-size: max(var(--mt-piso, 0cqw), calc(7cqmin * var(--mt-escala-titulo, 1))); }
}
/* A lateral: a lista, sem o kicker; o setor pode quebrar em duas linhas. */
@container (max-width: 700px) {
  .kicker { display: none; }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(12cqw * var(--mt-escala-titulo, 1))); }
  .nota { font-size: max(var(--mt-piso, 0cqw), 6.2cqw); }
  .lista li { padding: 2.4cqw 0; }
  .setor { font-size: max(var(--mt-piso, 0cqw), 6.4cqw); }
  .pontos { display: none; }
  .ramal { margin-left: auto; font-size: max(var(--mt-piso, 0cqw), calc(11cqw * var(--mt-escala-titulo, 1))); }
}
/* Deitada e baixa: o título em cima, duas colunas de três. */
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { grid-template-columns: 1fr; align-content: center; row-gap: 3cqmin; padding: 6cqmin 6cqw; }
  .kicker, .nota { display: none; }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(11cqmin * var(--mt-escala-titulo, 1))); }
  .lista li { padding: 1.4cqmin 0; }
  .ramal { font-size: max(var(--mt-piso, 0cqw), calc(11cqmin * var(--mt-escala-titulo, 1))); }
}
/*
 * A lateral no tamanho da TV (504×782 sem margem, 452×674 com a margem
 * contra o corte de 5%): com a letra do balcão o último ramal passava do pé. As linhas
 * da lista apertam.
 */
@container (max-width: 700px) and (max-height: 720px) {
  .nota { margin-top: 3cqw; padding: 1.6cqw 3cqw; line-height: 1.12; }
  .lista li { padding: 1.3cqw 0; }
}
</style>
<section class="mt-peca servico-ramais">
  <div class="cabeca">
    <p class="kicker" data-entrada="esquerda"><i aria-hidden="true"></i><span data-campo="kicker">Contatos úteis</span></p>
    <h1 data-campo="titulo" data-entrada="subir" data-ordem="1">Ramais</h1>
    <p class="nota" data-campo="nota" data-entrada="aparecer" data-ordem="2">Emergência: ramal 299</p>
  </div>
  <ul class="lista">
    <li data-entrada="subir" data-ordem="2"><span class="setor" data-campo="setor1">Portaria</span><i class="pontos" aria-hidden="true"></i><b class="ramal" data-campo="ramal1">200</b></li>
    <li data-entrada="subir" data-ordem="3"><span class="setor" data-campo="setor2">RH</span><i class="pontos" aria-hidden="true"></i><b class="ramal" data-campo="ramal2">214</b></li>
    <li data-entrada="subir" data-ordem="4"><span class="setor" data-campo="setor3">Segurança</span><i class="pontos" aria-hidden="true"></i><b class="ramal" data-campo="ramal3">230</b></li>
    <li data-entrada="subir" data-ordem="3"><span class="setor" data-campo="setor4">Manutenção</span><i class="pontos" aria-hidden="true"></i><b class="ramal" data-campo="ramal4">245</b></li>
    <li data-entrada="subir" data-ordem="4"><span class="setor" data-campo="setor5">TI</span><i class="pontos" aria-hidden="true"></i><b class="ramal" data-campo="ramal5">260</b></li>
    <li data-entrada="subir" data-ordem="5"><span class="setor" data-campo="setor6">Ambulatório</span><i class="pontos" aria-hidden="true"></i><b class="ramal" data-campo="ramal6">280</b></li>
  </ul>
</section>
