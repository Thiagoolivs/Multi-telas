<!--
  Preparo de exame — família serviço. Destaque e lateral.
  O que mais se esquece vira o herói: as horas de jejum, num mostrador
  (anel na cor de destaque). Do lado, a lista do que levar e do que pode,
  cada item com um visto desenhado. Item em branco some.
-->
<style>
.mt-peca { overflow-wrap: break-word; display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 7cqw; padding: 8cqmin 7cqw;
  color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(90% 110% at 0% 50%, var(--mt-fundo-2), var(--mt-fundo) 64%); }
.mostrador { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 56cqmin; height: 56cqmin; border-radius: 50%;
  border: 3.4cqmin solid var(--mt-destaque); text-align: center; }
.mostrador::before { content: ''; position: absolute; inset: 3cqmin; border-radius: 50%; border: .5cqmin dashed var(--mt-linha); }
.numero { position: relative; font: 700 max(var(--mt-piso, 0cqw), calc(24cqmin * var(--mt-escala-titulo, 1)))/.9 var(--mt-fonte-titulo); letter-spacing: -.03em; }
.unidade { position: relative; max-width: 36cqmin; margin-top: 1.4cqmin; font: 700 max(var(--mt-piso, 0cqw), 4.4cqmin)/1.15 var(--mt-fonte-texto); color: var(--mt-texto-suave); text-wrap: balance; }
.kicker { display: flex; align-items: center; gap: 2cqmin; font: 700 max(var(--mt-piso, 0cqw), 3.8cqmin)/1.15 var(--mt-fonte-texto); letter-spacing: .08em; text-transform: uppercase; color: var(--mt-preco); }
.kicker i { display: block; flex: none; width: 6cqmin; height: .9cqmin; border-radius: 1cqmin; background: var(--mt-destaque); }
h1 { margin-top: 3cqmin; font: 700 max(var(--mt-piso, 0cqw), calc(10cqmin * var(--mt-escala-titulo, 1)))/1.04 var(--mt-fonte-titulo); letter-spacing: -.01em; text-wrap: balance; }
.itens { list-style: none; margin: 5cqmin 0 0; padding: 0; display: flex; flex-direction: column; gap: 3cqmin; }
.itens li { display: flex; align-items: center; gap: 3cqmin; font: 600 max(var(--mt-piso, 0cqw), 5.2cqmin)/1.2 var(--mt-fonte-texto); }
.itens li:has(span:empty) { display: none; }
/* O visto: um L girado dentro do círculo, medido em em do próprio item. */
.itens i { position: relative; flex: none; width: 1.3em; height: 1.3em; border-radius: 50%; background: var(--mt-destaque); }
.itens i::after { content: ''; position: absolute; left: .44em; top: .22em; width: .3em; height: .62em; border: solid var(--mt-sobre-destaque); border-width: 0 .13em .13em 0; transform: rotate(45deg); }
@container (aspect-ratio >= 1.25) and (aspect-ratio < 1.75) {
  .mt-peca { column-gap: 5cqw; padding: 7cqmin 6cqw; }
  .mostrador { width: 48cqmin; height: 48cqmin; border-width: 3cqmin; }
  .numero { font-size: max(var(--mt-piso, 0cqw), calc(20cqmin * var(--mt-escala-titulo, 1))); }
  .unidade { max-width: 30cqmin; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(8.6cqmin * var(--mt-escala-titulo, 1))); }
  .itens { margin-top: 4cqmin; gap: 2.4cqmin; }
  .itens li { font-size: max(var(--mt-piso, 0cqw), 4.6cqmin); }
}
/* Em pé: o mostrador em cima, a lista embaixo. */
@container (aspect-ratio < 1.25) {
  .mt-peca { grid-template-columns: 1fr; justify-items: center; align-content: center; row-gap: 7cqmin; padding: 8cqmin 8cqw; }
  .texto { justify-self: stretch; }
  .mostrador { width: 56cqw; height: 56cqw; border-width: 3.6cqw; }
  .numero { font-size: max(var(--mt-piso, 0cqw), calc(24cqw * var(--mt-escala-titulo, 1))); }
  .unidade { max-width: 38cqw; font-size: max(var(--mt-piso, 0cqw), 4.6cqw); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(10.6cqw * var(--mt-escala-titulo, 1))); }
  .itens li { font-size: max(var(--mt-piso, 0cqw), 5.6cqw); }
}
@container (aspect-ratio < 0.8) and (min-width: 701px) {
  .mt-peca { row-gap: 10cqw; }
  .mostrador { width: 62cqw; height: 62cqw; }
  .numero { font-size: max(var(--mt-piso, 0cqw), calc(27cqw * var(--mt-escala-titulo, 1))); }
  .unidade { font-size: max(var(--mt-piso, 0cqw), 5.2cqw); }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 4.6cqw); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(12cqw * var(--mt-escala-titulo, 1))); }
  .itens { margin-top: 7cqw; gap: 4.6cqw; }
  .itens li { font-size: max(var(--mt-piso, 0cqw), 6.2cqw); }
}
/* Quase quadrada: o mostrador menor ao lado do título, a lista embaixo na largura. */
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { grid-template-columns: auto 1fr; justify-items: start; align-items: center; column-gap: 5cqw; row-gap: 5cqmin; padding: 7cqmin 7cqw; }
  .texto { display: contents; }
  .mostrador { grid-column: 1; grid-row: 1; width: 36cqmin; height: 36cqmin; border-width: 2.4cqmin; }
  .mostrador::before { inset: 2cqmin; }
  .numero { font-size: max(var(--mt-piso, 0cqw), calc(15cqmin * var(--mt-escala-titulo, 1))); }
  .unidade { max-width: 24cqmin; margin-top: .6cqmin; font-size: max(var(--mt-piso, 0cqw), 3.6cqmin); }
  .cabeca { grid-column: 2; grid-row: 1; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(8.4cqmin * var(--mt-escala-titulo, 1))); }
  .itens { grid-column: 1 / -1; margin-top: 0; gap: 2.4cqmin; }
  .itens li { font-size: max(var(--mt-piso, 0cqw), 4.8cqmin); }
}
/* A lateral: o mostrador e a lista, sem o kicker. */
@container (max-width: 700px) {
  .mt-peca { row-gap: 7cqw; }
  .kicker { display: none; }
  .mostrador { width: 58cqw; height: 58cqw; }
  .numero { font-size: max(var(--mt-piso, 0cqw), calc(26cqw * var(--mt-escala-titulo, 1))); }
  .unidade { max-width: 40cqw; font-size: max(var(--mt-piso, 0cqw), 6cqw); }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(10.6cqw * var(--mt-escala-titulo, 1))); }
  .itens { margin-top: 5cqw; }
  .itens li { font-size: max(var(--mt-piso, 0cqw), 6.6cqw); }
}
/* Deitada e baixa: o mostrador e a lista; o título sai (a lista já diz). */
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { padding: 5cqmin 6cqw; column-gap: 5cqw; }
  .kicker { display: none; }
  .mostrador { width: 70cqmin; height: 70cqmin; }
  .numero { font-size: max(var(--mt-piso, 0cqw), calc(30cqmin * var(--mt-escala-titulo, 1))); }
  .unidade { max-width: 50cqmin; }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(11cqmin * var(--mt-escala-titulo, 1))); }
  .itens { margin-top: 3cqmin; gap: 2cqmin; }
  .itens li:nth-child(3) { display: none; }
}
</style>
<section class="mt-peca servico-preparo">
  <div class="mostrador" data-entrada="crescer">
    <b class="numero" data-campo="numero">8</b>
    <span class="unidade" data-campo="unidade">horas de jejum</span>
  </div>
  <div class="texto">
    <div class="cabeca">
      <p class="kicker" data-entrada="esquerda" data-ordem="1"><i aria-hidden="true"></i><span data-campo="kicker">Preparo</span></p>
      <h1 data-campo="titulo" data-entrada="subir" data-ordem="2">Antes do exame de sangue</h1>
    </div>
    <ul class="itens">
      <li data-entrada="subir" data-ordem="3"><i aria-hidden="true"></i><span data-campo="item1">Água pode, café não</span></li>
      <li data-entrada="subir" data-ordem="4"><i aria-hidden="true"></i><span data-campo="item2">Traga o pedido médico</span></li>
      <li data-entrada="subir" data-ordem="5"><i aria-hidden="true"></i><span data-campo="item3">E um documento com foto</span></li>
    </ul>
  </div>
</section>
