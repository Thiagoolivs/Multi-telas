<!--
  Evento com data — família institucional (lote 4, arquétipo A4).
  A data é o número que domina: o dia enorme na letra do título, o mês na
  cor de destaque logo abaixo. Ao lado, o nome do evento, a hora e o lugar
  sob um filete. A foto fecha a peça em corte seco. Degustação, palestra,
  workshop, SIPAT, campanha de vacinação.
-->
<style>
.mt-peca { --f: 2.6cqw; --t: 5.6cqw; --n: 13cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo); display: grid; grid-template-columns: 58fr 42fr; }
.texto { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 8cqh 5cqw 8cqh 6cqw; }
.foto { width: 100%; height: 100%; min-height: 0; object-fit: cover; object-position: 50% 50%; }
/* A data no alto: o dia enorme e, ao lado dele, o dia da semana e o mês; um filete separa do resto. */
.data { display: flex; align-items: baseline; gap: 2.4cqw; padding-bottom: 3cqh; border-bottom: .14cqw solid var(--mt-linha); }
.dia { flex: none; font: 500 max(var(--mt-piso, 0cqw), calc(var(--n) * var(--mt-escala-titulo, 1)))/.84 var(--mt-fonte-titulo); letter-spacing: -.04em; }
.mes { min-width: 0; font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.15 var(--mt-fonte-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--mt-destaque); }
.info { min-width: 0; margin-top: 4cqh; }
.kicker { font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.1 var(--mt-fonte-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--mt-texto-suave); }
h1 { margin-top: 2cqh; font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/1.02 var(--mt-fonte-titulo); letter-spacing: -.01em; text-wrap: balance; }
.onde { margin-top: 3cqh; font: 500 max(var(--mt-piso, 0cqw), var(--f))/1.3 var(--mt-fonte-texto); }
.onde span { display: block; color: var(--mt-texto-suave); }
.onde span:first-child { color: var(--mt-texto); }

@container (aspect-ratio >= 1.25) and (max-height: 900px) {
  .mt-peca { --f: 3.5cqw; --t: 5.4cqw; --n: 13cqw; grid-template-columns: 64fr 36fr; }
  .texto { padding: 5cqh 4cqw 5cqh 5cqw; }
  .mes { letter-spacing: .04em; }
  .kicker, .onde span + span { display: none; }
  .info { margin-top: 3cqh; }
  h1 { margin-top: 0; }
  .onde { margin-top: 2cqh; }
}
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { --f: 4.8cqw; --t: 5.2cqw; --n: 12cqw; }
  .data { padding-bottom: 2cqh; }
  .info { margin-top: 2cqh; }
  .onde { display: none; }
}
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.6cqw; --t: 9.4cqw; --n: 26cqw; grid-template-columns: 1fr; grid-template-rows: 40fr 60fr; }
  .foto { grid-row: 1; }
  .texto { grid-row: 2; justify-content: flex-start; padding: 5cqh 7cqw 6cqh; }
  .data { gap: 4cqw; border-bottom-width: .24cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --t: 7.4cqw; --n: 18cqw; grid-template-rows: 30fr 70fr; }
  .texto { justify-content: center; padding: 4cqh 7cqw 5cqh; }
  .kicker { display: none; }
  .info { margin-top: 3cqh; }
  h1 { margin-top: 0; }
}
@container (max-width: 700px) {
  .mt-peca { --f: 9.6cqw; --t: 12cqw; --n: 34cqw; grid-template-rows: 26fr 74fr; }
  .texto { justify-content: center; padding: 3cqh 8cqw 4cqh; }
  .data { flex-direction: column; gap: 1cqh; padding-bottom: 2cqh; }
  .mes { letter-spacing: .02em; text-transform: none; }
  .kicker, .onde { display: none; }
  .info { margin-top: 2.4cqh; }
  h1 { margin-top: 0; }
}
</style>
<section class="mt-peca evento-foto">
  <div class="texto">
    <p class="data" data-entrada="crescer" data-ordem="1"><b class="dia" data-campo="dia">14</b><span class="mes" data-campo="mes">Neste sábado</span></p>
    <div class="info">
      <p class="kicker" data-campo="kicker" data-entrada="aparecer" data-ordem="2">Na loja</p>
      <h1 data-campo="titulo" data-entrada="subir" data-ordem="3">Degustação de pães de fermentação natural</h1>
      <p class="onde" data-entrada="aparecer" data-ordem="4"><span data-campo="hora">Das 9h às 12h</span><span data-campo="local">No balcão, com o padeiro</span></p>
    </div>
  </div>
  <img class="foto" data-campo-img="foto" alt="" data-entrada="aparecer">
</section>
