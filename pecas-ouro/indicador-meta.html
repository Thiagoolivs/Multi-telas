<!--
  Indicador com meta — família institucional. Destaque e lateral.
  O número do mês é o herói (Geckoboard: número grande, sempre com meta e
  comparação, e "atualizado às"). A tendência vai num selo na cor de
  destaque, com a seta como campo: o cliente escreve ▲ ou ▼, ou apaga.
  Nenhum desenho depende do dado — barra ou gráfico mentiriam quando o
  número mudasse sem ninguém mexer no desenho.
-->
<style>
.mt-peca { overflow-wrap: break-word; display: flex; flex-direction: column; justify-content: center; padding: 8cqmin 7cqw;
  color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(120% 90% at 100% 100%, var(--mt-fundo-2), var(--mt-fundo) 62%); }
.mt-peca::before { content: ''; position: absolute; right: -14cqmin; bottom: -14cqmin; width: 62cqmin; height: 62cqmin; border-radius: 50%;
  border: 5cqmin solid var(--mt-destaque); opacity: .12; }
.kicker { display: flex; align-items: center; gap: 2cqmin; font: 700 max(var(--mt-piso, 0cqw), 3.6cqmin)/1.15 var(--mt-fonte-texto); letter-spacing: .12em; text-transform: uppercase; color: var(--mt-preco); }
/* O fio do kicker fica na altura da primeira linha, mesmo quando o kicker quebra. */
.kicker { align-items: flex-start; }
.kicker i { display: block; flex: none; align-self: flex-start; width: 6cqmin; height: .9cqmin; margin-top: .52em; border-radius: 1cqmin; background: var(--mt-destaque); }
h1 { margin-top: 2.4cqmin; font: 600 max(var(--mt-piso, 0cqw), calc(8.4cqmin * var(--mt-escala-titulo, 1)))/1.05 var(--mt-fonte-titulo); letter-spacing: -.01em; text-wrap: balance; }
.placar { margin-top: 4cqmin; display: flex; flex-wrap: wrap; align-items: flex-end; column-gap: 5cqmin; row-gap: 3cqmin; }
.numero { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 2.4cqmin; }
.numero b { font: 700 max(var(--mt-piso, 0cqw), calc(29cqmin * var(--mt-escala-titulo, 1)))/.86 var(--mt-fonte-titulo); letter-spacing: -.03em; white-space: nowrap; }
.numero small { font: 600 max(var(--mt-piso, 0cqw), 6cqmin)/1 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
.tendencia { display: flex; align-items: center; gap: 1.6cqmin; margin-bottom: 1.4cqmin; padding: 1.6cqmin 3.2cqmin; border-radius: 99em;
  background: var(--mt-destaque); color: var(--mt-sobre-destaque); font: 700 max(var(--mt-piso, 0cqw), 4.4cqmin)/1.15 var(--mt-fonte-texto); }
.tendencia span:empty { display: none; }
.base { margin-top: 6cqmin; padding-top: 3.4cqmin; border-top: .5cqmin solid var(--mt-linha); display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 6cqmin; row-gap: 1.6cqmin;
  font: 500 max(var(--mt-piso, 0cqw), 4.2cqmin)/1.2 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
.base b { font-weight: 700; color: var(--mt-texto); }
/* A principal ao lado da lateral (784 a 832 px de altura): o número um pouco menor. Pela altura, e não pela proporção: sem o respiro da peça, a do Corporativo fica com a proporção da TV inteira. */
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 860px) {
  .numero b { font-size: max(var(--mt-piso, 0cqw), calc(25cqmin * var(--mt-escala-titulo, 1))); }
}
/* Em pé e quase quadrada: tudo empilhado, o número na largura. */
@container (aspect-ratio < 1.25) {
  .mt-peca { padding: 8cqmin 8cqw; }
  .mt-peca::before { width: 70cqmin; height: 70cqmin; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 3.4cqmin); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(9cqmin * var(--mt-escala-titulo, 1))); }
  .placar { flex-direction: column; align-items: flex-start; margin-top: 5cqmin; }
  .numero b { font-size: max(var(--mt-piso, 0cqw), calc(26cqw * var(--mt-escala-titulo, 1))); }
  .tendencia { margin-bottom: 0; }
  .base { flex-direction: column; margin-top: 7cqmin; }
}
/* Em pé na tela inteira: o título em cima, o número no meio, a meta no pé. */
@container (aspect-ratio < 0.8) and (min-width: 701px) {
  .mt-peca { justify-content: space-between; padding: 13cqmin 8cqw 12cqmin; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 4.4cqw); }
  .kicker i { width: 8cqw; height: 1cqw; }
  h1 { margin-top: 3.4cqw; font-size: max(var(--mt-piso, 0cqw), calc(13cqw * var(--mt-escala-titulo, 1))); }
  .placar { margin-top: 0; row-gap: 4cqw; }
  .numero b { font-size: max(var(--mt-piso, 0cqw), calc(28cqw * var(--mt-escala-titulo, 1))); }
  .numero small { font-size: max(var(--mt-piso, 0cqw), 8cqw); }
  .tendencia { font-size: max(var(--mt-piso, 0cqw), 5.6cqw); padding: 1.8cqw 4cqw; }
  .base { margin-top: 0; padding-top: 4cqw; font-size: max(var(--mt-piso, 0cqw), 5.2cqw); }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .numero b { font-size: max(var(--mt-piso, 0cqw), calc(24cqw * var(--mt-escala-titulo, 1))); }
  .placar { margin-top: 3.4cqmin; row-gap: 2.4cqmin; }
  .base { margin-top: 5cqmin; padding-top: 2.6cqmin; }
}
/* A lateral: o número, a unidade, a tendência e a meta. O "atualizado" sai. */
@container (max-width: 700px) {
  .mt-peca { padding: 9cqmin 8cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 6.2cqw); letter-spacing: .06em; }
  .kicker i { display: none; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(11cqw * var(--mt-escala-titulo, 1))); }
  .numero b { font-size: max(var(--mt-piso, 0cqw), calc(25cqw * var(--mt-escala-titulo, 1))); }
  .numero small { font-size: max(var(--mt-piso, 0cqw), 8cqw); }
  .tendencia { font-size: max(var(--mt-piso, 0cqw), 6.6cqw); padding: 2cqw 4cqw; }
  .base { font-size: max(var(--mt-piso, 0cqw), 6.4cqw); }
  .atualizado { display: none; }
}
/* Deitada e baixa (a de baixo da TV em pé): o título, o número e a meta. */
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { padding: 6cqmin 6cqw; }
  .kicker, .atualizado { display: none; }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(11cqmin * var(--mt-escala-titulo, 1))); }
  .placar { margin-top: 3cqmin; }
  .numero b { font-size: max(var(--mt-piso, 0cqw), calc(30cqmin * var(--mt-escala-titulo, 1))); }
  .base { margin-top: 4cqmin; padding-top: 2.4cqmin; }
}
/*
 * A lateral da TV com a margem contra o corte de 3,5% ou mais (468×707 e
 * menor; a caixa sem o padding abaixo de 628 px): com a letra do balcão a
 * base da meta passava do pé. Os respiros apertam.
 */
@container (max-width: 700px) and (max-height: 628px) {
  h1 { margin-top: 1.6cqmin; line-height: 1; }
  .placar { margin-top: 2.4cqmin; row-gap: 2cqmin; }
  .base { margin-top: 3cqmin; padding-top: 2cqmin; row-gap: .6cqmin; line-height: 1.1; }
}
/*
 * A lateral com a margem contra o corte de 5% (452×674; a caixa sem o
 * padding abaixo de 598 px): o kicker e a meta chegavam às bordas. Os
 * respiros apertam mais.
 */
@container (max-width: 700px) and (max-height: 598px) {
  h1 { margin-top: 1cqmin; }
  .placar { margin-top: 1.4cqmin; }
  .base { margin-top: 2cqmin; padding-top: 1.6cqmin; }
}
</style>
<section class="mt-peca indicador-meta">
  <div class="cabeca">
    <p class="kicker" data-entrada="esquerda"><i aria-hidden="true"></i><span data-campo="kicker">Linha 2 · novembro</span></p>
    <h1 data-campo="titulo" data-entrada="subir" data-ordem="1">Peças produzidas no mês</h1>
  </div>
  <div class="placar">
    <p class="numero" data-entrada="crescer" data-ordem="2"><b data-campo="numero">18.450</b><small data-campo="unidade">peças</small></p>
    <p class="tendencia" data-entrada="aparecer" data-ordem="3"><span data-campo="seta">▲</span><span data-campo="tendencia">12% sobre outubro</span></p>
  </div>
  <div class="base" data-entrada="aparecer" data-ordem="4">
    <b data-campo="meta">Meta do mês: 17.000</b>
    <span class="atualizado" data-campo="atualizado">Atualizado às 14h</span>
  </div>
</section>
