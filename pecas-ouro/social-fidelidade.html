<!--
  Programa de fidelidade — família social. Destaque e lateral.
  O cartão de carimbos desenhado: nove carimbados e o décimo com o
  presente. É ilustração, não contagem — o cliente entende a regra sem
  ler, e a frase diz o que ganha. O nome da marca vai no cartão (some na
  tela que já tem cabeçalho).
-->
<style>
.mt-peca { overflow-wrap: break-word; display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 6cqw; padding: 8cqmin 7cqw;
  color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(100% 100% at 0% 100%, var(--mt-fundo-2), var(--mt-fundo) 62%); }
.kicker { display: flex; align-items: center; gap: 2cqmin; font: 700 max(var(--mt-piso, 0cqw), 4cqmin)/1.15 var(--mt-fonte-texto); letter-spacing: .08em; text-transform: uppercase; color: var(--mt-preco); }
/* O fio do kicker fica na altura da primeira linha, mesmo quando o kicker quebra. */
.kicker { align-items: flex-start; }
.kicker i { display: block; flex: none; align-self: flex-start; width: 6cqmin; height: .9cqmin; margin-top: .52em; border-radius: 1cqmin; background: var(--mt-destaque); }
h1 { margin-top: 3cqmin; font: 700 max(var(--mt-piso, 0cqw), calc(12cqmin * var(--mt-escala-titulo, 1)))/1.02 var(--mt-fonte-titulo); letter-spacing: -.01em; text-wrap: balance; }
.apoio { margin-top: 4cqmin; font: 500 max(var(--mt-piso, 0cqw), 5cqmin)/1.32 var(--mt-fonte-texto); color: var(--mt-texto-suave); max-width: 20em; text-wrap: pretty; }
/* O cartão: 10em de largura; os carimbos são uma grade de 5 por 2. */
.cartao { position: relative; width: 10em; padding: .7em .7em .75em; border-radius: .5em; font-size: 7cqmin; background: var(--mt-superficie);
  box-shadow: 0 0 0 .05em var(--mt-linha); transform: rotate(-4deg); }
.marca-nome { display: block; margin-bottom: .45em; font: 700 max(var(--mt-piso, 0cqw), .3em)/1.1 var(--mt-fonte-titulo); letter-spacing: .06em; text-transform: uppercase; color: var(--mt-texto-suave); }
.carimbos { display: grid; grid-template-columns: repeat(5, 1fr); gap: .3em; }
.carimbos i { position: relative; display: block; aspect-ratio: 1; border-radius: 50%; background: var(--mt-destaque); }
.carimbos i::after { content: ''; position: absolute; left: 36%; top: 22%; width: 22%; height: 42%; border: solid var(--mt-sobre-destaque); border-width: 0 .07em .07em 0; transform: rotate(45deg); }
/* O décimo: o prêmio — contorno tracejado e uma estrela no lugar do visto. */
.carimbos .brinde { background: transparent; border: .05em dashed var(--mt-destaque); }
.carimbos .brinde::after { left: 18%; top: 16%; width: 64%; height: 64%; border: 0; transform: none; background: var(--mt-destaque);
  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 860px) {
  .mt-peca { column-gap: 5cqw; padding: 7cqmin 6cqw; }
  .cartao { font-size: 6.2cqmin; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(10cqmin * var(--mt-escala-titulo, 1))); }
  .apoio { margin-top: 3cqmin; font-size: max(var(--mt-piso, 0cqw), 4.4cqmin); }
}
/* Em pé: o cartão em cima, a regra embaixo. */
@container (aspect-ratio < 1.25) {
  .mt-peca { grid-template-columns: 1fr; justify-items: center; align-content: center; row-gap: 9cqmin; padding: 9cqmin 8cqw; }
  .texto { justify-self: stretch; }
  .cartao { grid-row: 1; font-size: 7.6cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(12.4cqw * var(--mt-escala-titulo, 1))); }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 5.6cqw); max-width: none; }
}
@container (aspect-ratio < 0.8) and (min-width: 701px) {
  .mt-peca { row-gap: 13cqw; }
  .cartao { font-size: 8.4cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 4.8cqw); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(14cqw * var(--mt-escala-titulo, 1))); }
  .apoio { margin-top: 5cqw; font-size: max(var(--mt-piso, 0cqw), 6.4cqw); }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { row-gap: 6cqmin; padding: 7cqmin 7cqw; }
  .cartao { font-size: 5.4cqmin; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 3.8cqmin); }
  h1 { margin-top: 2.4cqmin; font-size: max(var(--mt-piso, 0cqw), calc(10cqmin * var(--mt-escala-titulo, 1))); }
  .apoio { margin-top: 3cqmin; font-size: max(var(--mt-piso, 0cqw), 4.6cqmin); }
}
/* A lateral: o cartão e a regra curta; a explicação sai. */
@container (max-width: 700px) {
  .cartao { font-size: 7.4cqw; }
  .marca-nome { font-size: max(var(--mt-piso, 0cqw), 5.4cqw); }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 5.8cqw); letter-spacing: .04em; }
  .kicker i, .apoio { display: none; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(11.6cqw * var(--mt-escala-titulo, 1))); }
}
/* Deitada e baixa: a regra ao lado do cartão; a explicação sai. */
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { padding: 6cqmin 6cqw; }
  .apoio { display: none; }
  .cartao { font-size: 7.4cqmin; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(13cqmin * var(--mt-escala-titulo, 1))); }
}
</style>
<section class="mt-peca social-fidelidade">
  <div class="texto">
    <p class="kicker" data-entrada="esquerda"><i aria-hidden="true"></i><span data-campo="kicker">Cartão fidelidade</span></p>
    <h1 data-campo="titulo" data-entrada="subir" data-ordem="1">O 10º café é por nossa conta</h1>
    <p class="apoio" data-campo="apoio" data-entrada="aparecer" data-ordem="2">A cada café, um carimbo. Peça o seu cartão no caixa.</p>
  </div>
  <div class="cartao" data-entrada="crescer" data-ordem="3">
    <span class="marca-nome" data-campo="marca" data-repete="marca">Padaria do Bairro</span>
    <div class="carimbos" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="brinde"></i></div>
  </div>
</section>
