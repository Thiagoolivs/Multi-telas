<!--
  Prato do dia em cartão — família cardápio (lote 4, arquétipo A5).
  A foto do prato ocupa a peça; o texto vem num cartão de fundo cheio com
  um filete interno, como o cardápio impresso sobre a mesa. Deitada, o
  cartão fica à esquerda, de cima a baixo; em pé e quadrada, no pé. O cartão
  cresce com a letra da TV — o texto nunca fica sobre a foto.
-->
<style>
.mt-peca { --f: 2.6cqw; --t: 6cqw; --p: 8cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo); }
.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 50%; }
.cartao { position: absolute; left: 4cqw; top: 6cqh; bottom: 6cqh; width: 44%; display: flex; flex-direction: column; justify-content: center; padding: 5cqh 4cqw; background: var(--mt-fundo); outline: .16cqw solid var(--mt-linha); outline-offset: -1.4cqw; }
.kicker { font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.1 var(--mt-fonte-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--mt-destaque); }
h1 { margin-top: 2cqh; font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.01em; text-wrap: balance; }
.apoio { margin-top: 2.4cqh; font: 400 max(var(--mt-piso, 0cqw), var(--f))/1.3 var(--mt-fonte-texto); color: var(--mt-texto-suave); text-wrap: pretty; }
.pe { margin-top: 3.4cqh; padding-top: 2.4cqh; border-top: .14cqw solid var(--mt-linha); display: flex; align-items: baseline; justify-content: space-between; gap: 2cqw; flex-wrap: wrap; }
.quando { font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.2 var(--mt-fonte-texto); }
.valor { font: 500 max(var(--mt-piso, 0cqw), calc(var(--p) * var(--mt-escala-titulo, 1)))/.9 var(--mt-fonte-titulo); color: var(--mt-preco); white-space: nowrap; }
.valor small { font-size: max(var(--mt-piso, 0cqw), .32em); margin-right: .12em; }
.valor sup { font-size: max(var(--mt-piso, 0cqw), .36em); vertical-align: 1.1em; }

@container (aspect-ratio >= 1.25) and (max-height: 900px) {
  .mt-peca { --f: 3.5cqw; --t: 5.6cqw; --p: 8.4cqw; }
  .cartao { left: 3cqw; top: 5cqh; bottom: 5cqh; width: 54%; padding: 4cqh 4cqw; }
  .apoio { display: none; }
}
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { --f: 4.8cqw; --t: 5.4cqw; --p: 8cqw; }
  .kicker { display: none; }
}
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.6cqw; --t: 9.6cqw; --p: 14cqw; }
  .foto { height: 64%; object-position: 50% 50%; }
  .cartao { top: auto; left: 5cqw; right: 5cqw; bottom: 4cqh; width: auto; padding: 4cqh 6cqw; outline-offset: -2cqw; outline-width: .24cqw; }
  .pe { border-top-width: .24cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --t: 7.4cqw; --p: 11cqw; }
  .foto { height: 56%; }
  .cartao { padding: 3.4cqh 6cqw; }
  .apoio { display: none; }
}
@container (max-width: 700px) {
  .mt-peca { --f: 9.6cqw; --t: 12cqw; --p: 22cqw; }
  .foto { height: 46%; }
  .cartao { left: 4cqw; right: 4cqw; bottom: 4cqh; padding: 3cqh 6cqw 4.4cqh; outline-offset: -2.6cqw; }
  .kicker { letter-spacing: .02em; text-transform: none; }
  .apoio, .quando { display: none; }
  .pe { margin-top: 2cqh; padding-top: 1.6cqh; }
}
</style>
<section class="mt-peca cardapio-destaque">
  <img class="foto" data-campo-img="foto" alt="" data-entrada="aparecer">
  <div class="cartao" data-entrada="esquerda" data-ordem="1">
    <p class="kicker" data-campo="kicker">Prato do dia · quinta</p>
    <h1 data-campo="titulo" data-entrada="subir" data-ordem="2">Tagliatelle ao ragu de costela</h1>
    <p class="apoio" data-campo="apoio" data-entrada="aparecer" data-ordem="3">Massa fresca da casa, ragu cozido por seis horas e parmesão.</p>
    <div class="pe" data-entrada="subir" data-ordem="4">
      <span class="quando" data-campo="quando">Almoço, até as 15h</span>
      <span class="valor"><small aria-hidden="true">R$</small><span data-campo="preco">48</span><sup data-campo="centavos">,00</sup></span>
    </div>
  </div>
</section>
