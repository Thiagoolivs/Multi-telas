<!--
  Formas de pagamento — família serviço. Destaque e lateral.
  A resposta antes da pergunta no caixa. Quatro cartões, cada um com um
  ícone desenhado em CSS — celular com QR (Pix), cartão (crédito e
  débito), tíquete (vale) e cédula (dinheiro) — e o nome escrito: o
  ícone ajuda, a palavra decide. Sem logotipo de bandeira. Cartão com o
  nome em branco some.
-->
<style>
.mt-peca { overflow-wrap: break-word; display: flex; flex-direction: column; justify-content: center; padding: 8cqmin 7cqw;
  color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(120% 100% at 50% 0%, var(--mt-fundo-2), var(--mt-fundo) 62%); }
.kicker { display: flex; align-items: center; gap: 2cqmin; font: 700 max(var(--mt-piso, 0cqw), 4cqmin)/1.15 var(--mt-fonte-texto); letter-spacing: .08em; text-transform: uppercase; color: var(--mt-preco); }
/* O fio do kicker fica na altura da primeira linha, mesmo quando o kicker quebra. */
.kicker { align-items: flex-start; }
.kicker i { display: block; flex: none; align-self: flex-start; width: 6cqmin; height: .9cqmin; margin-top: .52em; border-radius: 1cqmin; background: var(--mt-destaque); }
h1 { margin-top: 2.4cqmin; font: 700 max(var(--mt-piso, 0cqw), calc(12cqmin * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.01em; }
.formas { list-style: none; margin: 6cqmin 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 3cqmin; }
.formas li { display: flex; flex-direction: column; align-items: flex-start; gap: 3cqmin; padding: 4cqmin 3.4cqmin; border-radius: var(--mt-raio); background: var(--mt-superficie); }
.formas li:has(.nome:empty) { display: none; }
.nome { font: 700 max(var(--mt-piso, 0cqw), 5cqmin)/1.15 var(--mt-fonte-texto); text-wrap: balance; }
.nota { margin-top: 5cqmin; font: 600 max(var(--mt-piso, 0cqw), 4.6cqmin)/1.3 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
.nota:empty { display: none; }
/* Os ícones: 10em × 7em, desenhados com a cor de destaque, medidos em em. */
.ico { position: relative; display: block; flex: none; width: 10em; height: 7em; font-size: 2.2cqmin; }
.ico::before, .ico::after, .ico i { content: ''; position: absolute; display: block; }
.pix::before { left: 3em; top: 0; width: 4em; height: 7em; border-radius: .8em; background: var(--mt-destaque); }
.pix::after { left: 3.6em; top: .9em; width: 2.8em; height: 4.4em; border-radius: .2em; background: var(--mt-superficie); }
.pix i { left: 4.05em; top: 1.95em; width: 1.9em; height: 1.9em;
  background: linear-gradient(var(--mt-destaque), var(--mt-destaque)) 0 0 / 42% 42% no-repeat, linear-gradient(var(--mt-destaque), var(--mt-destaque)) 100% 0 / 42% 42% no-repeat,
    linear-gradient(var(--mt-destaque), var(--mt-destaque)) 0 100% / 42% 42% no-repeat; }
.cartao::before { left: .5em; top: .6em; width: 9em; height: 5.8em; border-radius: .7em; background: var(--mt-destaque); }
.cartao::after { left: .5em; top: 1.7em; width: 9em; height: 1.1em; background: var(--mt-sobre-destaque); opacity: .85; }
.cartao i { left: 1.5em; top: 3.9em; width: 2em; height: 1.4em; border-radius: .25em; background: var(--mt-sobre-destaque); }
.vale::before { left: .5em; top: 1em; width: 9em; height: 5em; border-radius: .5em; background: var(--mt-destaque); }
.vale::after { left: 6.4em; top: 1em; width: 0; height: 5em; border-left: .3em dashed var(--mt-superficie); }
.vale i { left: 1.6em; top: 2.6em; width: 3.6em; height: .55em; border-radius: .3em; background: var(--mt-sobre-destaque); box-shadow: 0 1.2em 0 0 var(--mt-sobre-destaque); }
.dinheiro::before { left: .5em; top: 1em; width: 9em; height: 5em; border-radius: .4em; background: var(--mt-destaque); }
.dinheiro::after { left: 3.6em; top: 1.9em; width: 2.8em; height: 2.8em; border-radius: 50%; border: .5em solid var(--mt-sobre-destaque); box-sizing: border-box; }
.dinheiro i { left: 1.4em; top: 3.05em; width: .7em; height: .7em; border-radius: 50%; background: var(--mt-sobre-destaque); box-shadow: 6.5em 0 0 0 var(--mt-sobre-destaque); }
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 860px) {
  .mt-peca { padding: 7cqmin 6cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(10cqmin * var(--mt-escala-titulo, 1))); }
  .formas { margin-top: 5cqmin; gap: 2.4cqmin; }
  .formas li { padding: 3.4cqmin 2.8cqmin; }
  .nome { font-size: max(var(--mt-piso, 0cqw), 4.4cqmin); }
  .ico { font-size: 1.8cqmin; }
}
/* Em pé e quase quadrada: dois por linha, o ícone ao lado do nome. */
@container (aspect-ratio < 1.25) {
  .mt-peca { padding: 8cqmin 8cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(12cqw * var(--mt-escala-titulo, 1))); }
  .formas { grid-template-columns: 1fr 1fr; gap: 3.4cqmin; }
  .nome { font-size: max(var(--mt-piso, 0cqw), 5.4cqw); }
  .ico { font-size: 2.2cqw; }
  .nota { font-size: max(var(--mt-piso, 0cqw), 4.8cqw); }
}
@container (aspect-ratio < 0.8) and (min-width: 701px) {
  .kicker { font-size: max(var(--mt-piso, 0cqw), 4.8cqw); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(14cqw * var(--mt-escala-titulo, 1))); }
  .formas { margin-top: 10cqw; gap: 4.4cqw; }
  .formas li { padding: 6cqw 5cqw; gap: 4cqw; }
  .nome { font-size: max(var(--mt-piso, 0cqw), 6.6cqw); }
  .ico { font-size: 2.8cqw; }
  .nota { margin-top: 8cqw; font-size: max(var(--mt-piso, 0cqw), 5.6cqw); }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { padding: 7cqmin 7cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 3.6cqmin); }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(10cqmin * var(--mt-escala-titulo, 1))); }
  .formas { margin-top: 4.4cqmin; gap: 2.6cqmin; }
  .formas li { flex-direction: row; align-items: center; gap: 2.6cqmin; padding: 3cqmin; }
  .nome { font-size: max(var(--mt-piso, 0cqw), 4.6cqmin); }
  .ico { font-size: 1.3cqmin; }
  .nota { margin-top: 4cqmin; font-size: max(var(--mt-piso, 0cqw), 4cqmin); }
}
/* A lateral: uma forma por linha, o ícone ao lado; a nota fica. */
@container (max-width: 700px) {
  /* Com a letra do balcão a nota passava do pé: os cartões e o respiro mais justos. */
  .mt-peca { padding: 6cqmin 7cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 5.8cqw); letter-spacing: .04em; line-height: 1.1; }
  .kicker i { display: none; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(11.6cqw * var(--mt-escala-titulo, 1))); }
  .formas { grid-template-columns: 1fr; gap: 2cqw; margin-top: 4.4cqw; }
  .formas li { flex-direction: row; align-items: center; gap: 4cqw; padding: 1.7cqw 4cqw; }
  .nome { font-size: max(var(--mt-piso, 0cqw), 6.4cqw); line-height: 1.1; }
  .ico { font-size: 1.7cqw; }
  .nota { margin-top: 3.4cqw; font-size: max(var(--mt-piso, 0cqw), 6cqw); line-height: 1.16; }
}
/* Deitada e baixa: o título e as quatro formas numa linha; a nota sai. */
/*
 * A lateral no tamanho da TV (504×782 sem margem, 452×674 com a margem
 * contra o corte de 5%; a caixa sem o padding abaixo de 740 px): com a
 * letra do balcão a nota passava do pé. O kicker sai (o título diz) e as
 * formas apertam; bem baixa (a margem de 3,5% para cima), a nota sai, como
 * na deitada e baixa.
 */
@container (max-width: 700px) and (max-height: 740px) {
  .kicker { display: none; }
  h1 { margin-top: 0; }
  .formas { gap: 1.4cqw; margin-top: 3.6cqw; }
  .formas li { padding: 1.1cqw 4cqw; }
}
@container (max-width: 700px) and (max-height: 655px) {
  .nota { display: none; }
}
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { padding: 5cqmin 6cqw; }
  .kicker, .nota { display: none; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(11cqmin * var(--mt-escala-titulo, 1))); }
  .formas { margin-top: 4cqmin; gap: 2cqmin; }
  .formas li { gap: 2cqmin; padding: 3cqmin 2.4cqmin; }
  .ico { font-size: 2cqmin; }
}
</style>
<section class="mt-peca servico-pagamento">
  <p class="kicker" data-entrada="esquerda"><i aria-hidden="true"></i><span data-campo="kicker">No caixa</span></p>
  <h1 data-campo="titulo" data-entrada="subir" data-ordem="1">Pague como preferir</h1>
  <ul class="formas">
    <li data-entrada="subir" data-ordem="2"><span class="ico pix" aria-hidden="true"><i></i></span><span class="nome" data-campo="forma1">Pix</span></li>
    <li data-entrada="subir" data-ordem="3"><span class="ico cartao" aria-hidden="true"><i></i></span><span class="nome" data-campo="forma2">Crédito e débito</span></li>
    <li data-entrada="subir" data-ordem="4"><span class="ico vale" aria-hidden="true"><i></i></span><span class="nome" data-campo="forma3">Vale-refeição</span></li>
    <li data-entrada="subir" data-ordem="5"><span class="ico dinheiro" aria-hidden="true"><i></i></span><span class="nome" data-campo="forma4">Dinheiro</span></li>
  </ul>
  <p class="nota" data-campo="nota" data-entrada="aparecer" data-ordem="6">Até 3x sem juros nas compras acima de R$ 100</p>
</section>
