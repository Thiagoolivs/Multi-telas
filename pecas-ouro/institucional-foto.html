<!--
  Foto cheia com assinatura — família institucional. Destaque.
  A foto ocupa a peça inteira, como uma página de revista; o véu sobe do
  pé (de --mt-fundo a --mt-fundo-0) e a frase entra por cima dele, nunca
  direto sobre a imagem. A assinatura da casa fecha à direita — numa tela
  com cabeçalho o nome sai (data-repete) e fica o endereço. Sem preço: é a
  peça de marca, não de oferta.
-->
<style>
.mt-peca { color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo); }
.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }
/* D44: o kicker fica a um terço da altura, em cor de destaque: o véu sobe até ele (antes, 1,6:1 com foto clara). Com a letra da TV o bloco cresce: o véu fica cheio até o kicker. */
.veu { position: absolute; inset: 0; background: linear-gradient(0deg, var(--mt-fundo) 36%, var(--mt-fundo-0) 76%); }
/* A frase não encolhe (o kicker quebrava em duas linhas no destaque); quem cede é a assinatura, que quebra o endereço. */
.pe { position: absolute; left: 6cqw; right: 6cqw; bottom: 8cqh; display: flex; align-items: flex-end; justify-content: space-between; gap: 5cqw; }
.frase { flex: none; }
.kicker { display: flex; align-items: center; gap: 1.1cqw; font: 600 max(var(--mt-piso, 0cqw), 1.25cqw)/1 var(--mt-fonte-texto); letter-spacing: .2em; text-transform: uppercase; color: var(--mt-destaque); }
.kicker i { display: block; width: 3.6cqw; height: .14cqw; background: var(--mt-destaque); }
h1 { margin-top: 2cqw; font: 400 max(var(--mt-piso, 0cqw), 6.4cqw)/.95 var(--mt-fonte-titulo); text-transform: uppercase; }
h1 span, h1 em { display: block; white-space: nowrap; }
h1 em { font-style: normal; color: var(--mt-destaque); }
.assina { flex: 0 1 auto; min-width: 0; text-align: right; padding-bottom: .6cqw; }
.assina b { display: block; font: 600 max(var(--mt-piso, 0cqw), 1.5cqw)/1 var(--mt-fonte-texto); letter-spacing: .32em; text-transform: uppercase; }
.assina small { display: block; margin-top: 1cqw; font: 500 max(var(--mt-piso, 0cqw), 1.2cqw)/1.3 var(--mt-fonte-texto); color: var(--mt-texto-suave); text-wrap: balance; }
/* Sem foto: o véu sai e o fundo da marca segura a peça sozinho. */
.foto[data-sem-foto] + .veu { display: none; }
@container (aspect-ratio < 0.8) {
  .foto { object-position: 50% 38%; }
  .veu { background: linear-gradient(0deg, var(--mt-fundo) 34%, var(--mt-fundo-0) 70%); }
  .pe { left: 8cqw; right: 8cqw; bottom: 6cqh; flex-direction: column; align-items: flex-start; gap: 5cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 2.4cqw); }
  .kicker i { width: 6cqw; height: .28cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 13cqw); margin-top: 3.4cqw; }
  .assina { text-align: left; }
  .assina b { font-size: max(var(--mt-piso, 0cqw), 2.6cqw); }
  .assina small { font-size: max(var(--mt-piso, 0cqw), 2.2cqw); margin-top: 1.4cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  /* Quadrada: com a letra da TV o bloco sobe até perto do meio; o véu cheio vai até o kicker e os vãos encurtam. */
  .veu { background: linear-gradient(0deg, var(--mt-fundo) 44%, var(--mt-fundo-0) 80%); }
  .pe { left: 7cqw; right: 7cqw; bottom: 6cqh; flex-direction: column; align-items: flex-start; gap: 4cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 1.9cqw); }
  .kicker i { width: 5cqw; height: .2cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), 9cqw); margin-top: 3.2cqw; }
  .assina { text-align: left; padding-bottom: 0; }
  .assina b { font-size: max(var(--mt-piso, 0cqw), 2cqw); letter-spacing: .22em; }
  .assina small { font-size: max(var(--mt-piso, 0cqw), 1.7cqw); line-height: 1.2; }
}
</style>
<section class="mt-peca institucional-foto">
  <img class="foto" data-campo-img="foto" alt="" data-entrada="aparecer">
  <div class="veu" aria-hidden="true"></div>
  <div class="pe">
    <div class="frase">
      <p class="kicker" data-entrada="esquerda" data-ordem="1"><i aria-hidden="true"></i><span data-campo="kicker">Desde 2001</span></p>
      <h1 data-entrada="subir" data-ordem="2"><span data-campo="titulo">Ver bem</span><em data-campo="titulo2">muda tudo</em></h1>
    </div>
    <p class="assina" data-entrada="aparecer" data-ordem="3"><b data-campo="marca" data-repete="marca">Ótica Central</b><small data-campo="endereco">Rua Augusta, 1200 · São Paulo</small></p>
  </div>
</section>
