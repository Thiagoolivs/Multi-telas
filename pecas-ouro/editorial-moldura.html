<!--
  Moldura editorial — família institucional (lote 4, arquétipo A3).
  Página de revista: um cabeçalho com filete (a seção à esquerda, a casa à
  direita), a foto EMOLDURADA pela margem — ela não encosta na borda — e o
  título grande ao lado, com uma legenda curta. --f é a letra de leitura e
  --t a do título: cada formato redefine as duas, e toda letra fica acima
  do piso da TV no tamanho em que foi desenhada (o piso não empurra nada).
-->
<style>
.mt-peca { --f: 2.6cqw; --t: 6.4cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo);
  display: flex; flex-direction: column; padding: 6cqh 6cqw 7cqh; }
.topo { flex: none; display: flex; justify-content: space-between; align-items: baseline; gap: 3cqw; padding-bottom: 1.6cqh; border-bottom: .14cqw solid var(--mt-linha);
  font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.1 var(--mt-fonte-texto); letter-spacing: .14em; text-transform: uppercase; }
.topo span { color: var(--mt-destaque); }
.corpo { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 42fr 58fr; gap: 5cqw; margin-top: 5cqh; }
.texto { min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; }
h1 { font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.01em; text-wrap: balance; }
.apoio { margin-top: 3cqh; font: 400 max(var(--mt-piso, 0cqw), var(--f))/1.3 var(--mt-fonte-texto); color: var(--mt-texto-suave); text-wrap: pretty; }
.legenda { margin-top: 4cqh; padding-top: 1.6cqh; border-top: .14cqw solid var(--mt-linha); font: 500 max(var(--mt-piso, 0cqw), var(--f))/1.2 var(--mt-fonte-texto); }
.quadro { min-height: 0; position: relative; }
.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }

@container (aspect-ratio >= 1.25) and (max-height: 900px) {
  .mt-peca { --f: 3.5cqw; --t: 6.2cqw; padding: 5cqh 5cqw 6cqh; }
  .topo { letter-spacing: .06em; }
  .corpo { grid-template-columns: 50fr 50fr; gap: 4cqw; margin-top: 4cqh; }
  .apoio { display: none; }
  .legenda { margin-top: 3cqh; }
}
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { --f: 4.8cqw; --t: 5.6cqw; padding: 5cqh 5cqw; }
  .topo, .legenda { display: none; }
  .corpo { margin-top: 0; }
  .texto { justify-content: center; }
}
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.6cqw; --t: 10.4cqw; padding: 5cqh 7cqw 6cqh; }
  .topo { letter-spacing: .08em; }
  .corpo { grid-template-columns: 1fr; grid-template-rows: 1fr auto; gap: 4cqh; margin-top: 4cqh; }
  .texto { grid-row: 2; }
  .quadro { grid-row: 1; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --t: 8.2cqw; padding: 5cqh 6cqw 6cqh; }
  .corpo { grid-template-columns: 46fr 54fr; grid-template-rows: 1fr; gap: 5cqw; }
  .texto, .quadro { grid-row: 1; }
  .apoio { display: none; }
  .topo b { display: none; }
}
@container (max-width: 700px) {
  .mt-peca { --f: 9.6cqw; --t: 13cqw; padding: 4cqh 8cqw 5cqh; }
  .topo { letter-spacing: .02em; text-transform: none; }
  .topo b, .apoio, .legenda { display: none; }
  .corpo { gap: 3cqh; margin-top: 3cqh; }
}
</style>
<section class="mt-peca editorial-moldura">
  <header class="topo" data-entrada="aparecer" data-ordem="1"><span data-campo="kicker">Edição de outono</span><b data-campo="marca" data-repete="marca">Ótica Central</b></header>
  <div class="corpo">
    <div class="texto">
      <h1 data-campo="titulo" data-entrada="subir" data-ordem="2">Clássicos que não saem de moda</h1>
      <p class="apoio" data-campo="apoio" data-entrada="aparecer" data-ordem="3">Acetato italiano, desenho dos anos cinquenta e lentes feitas na medida do seu rosto.</p>
      <p class="legenda" data-campo="legenda" data-entrada="aparecer" data-ordem="4">Na foto: armação Lisboa</p>
    </div>
    <figure class="quadro" data-entrada="aparecer" data-ordem="2"><img class="foto" data-campo-img="foto" alt=""></figure>
  </div>
</section>
