<!--
  Aniversariantes do mês — família gente. Destaque e lateral.
  A lista do mês, com o dia grande à esquerda — a pessoa procura o próprio
  nome pelo dia. Deitada, duas colunas; em pé e na lateral, uma só. Linha
  deixada em branco some.
-->
<style>
.mt-peca { color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(90% 90% at 100% 0%, var(--mt-fundo-2), var(--mt-fundo) 62%); }
.cabeca { position: absolute; left: 6cqw; right: 6cqw; top: 7cqh; }
.kicker { display: flex; align-items: center; gap: 1.1cqw; font: 700 max(var(--mt-piso, 0cqw), 1.3cqw)/1.1 var(--mt-fonte-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--mt-destaque); }
.kicker i { display: block; width: 3.6cqw; height: .16cqw; background: var(--mt-destaque); }
h1 { margin-top: 1.8cqw; font: 600 max(var(--mt-piso, 0cqw), calc(6cqw * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.02em; }
h1 span, h1 em { display: block; white-space: nowrap; }
h1 em { font-style: normal; color: var(--mt-destaque); }
.lista { position: absolute; left: 6cqw; right: 6cqw; bottom: 7cqh; list-style: none; margin: 0; padding: 0;
  display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(3, auto); column-gap: 5cqw; }
.lista li { display: grid; grid-template-columns: 6cqw 1fr; align-items: baseline; column-gap: 1.6cqw; padding: 1cqw 0; border-top: .14cqw solid var(--mt-linha); }
.lista li:has(> b > span:empty) { display: none; }
.dia { font: 600 max(var(--mt-piso, 0cqw), 3.4cqw)/1 var(--mt-fonte-titulo); color: var(--mt-destaque); letter-spacing: -.02em; }
.lista b { font: 600 max(var(--mt-piso, 0cqw), 2cqw)/1.2 var(--mt-fonte-texto); }
.lista small { display: block; margin-top: .3cqw; font: 500 max(var(--mt-piso, 0cqw), 1.3cqw)/1.2 var(--mt-fonte-texto); color: var(--mt-texto-suave); }
@container (aspect-ratio < 1.25) {
  .cabeca { left: 8cqw; right: 8cqw; top: 6cqh; }
  /* O kicker quebra em duas linhas com a letra da TV: o fio fica na altura da primeira. */
  .kicker { align-items: flex-start; font-size: max(var(--mt-piso, 0cqw), 2.4cqw); letter-spacing: .12em; }
  .kicker i { width: 6cqw; height: .28cqw; margin-top: .5em; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(10cqw * var(--mt-escala-titulo, 1))); margin-top: 3cqw; }
  .lista { left: 8cqw; right: 8cqw; bottom: 6cqh; grid-template-columns: 1fr; grid-auto-flow: row; grid-template-rows: none; }
  .lista li { grid-template-columns: 12cqw 1fr; column-gap: 3cqw; padding: 2.4cqw 0; border-top-width: .25cqw; }
  .dia { font-size: max(var(--mt-piso, 0cqw), 7cqw); }
  .lista b { font-size: max(var(--mt-piso, 0cqw), 4cqw); }
  .lista small { font-size: max(var(--mt-piso, 0cqw), 2.6cqw); margin-top: .6cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .cabeca { left: 7cqw; right: 7cqw; top: 6cqh; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(7.6cqw * var(--mt-escala-titulo, 1))); margin-top: 2cqw; }
  .lista { left: 7cqw; right: 7cqw; bottom: 6cqh; grid-template-columns: 1fr 1fr; column-gap: 4cqw; grid-auto-flow: column; grid-template-rows: repeat(3, auto); }
  .lista li { grid-template-columns: 7cqw 1fr; column-gap: 1.6cqw; padding: 1.8cqw 0; }
  .dia { font-size: max(var(--mt-piso, 0cqw), 5cqw); }
  .lista b { font-size: max(var(--mt-piso, 0cqw), 2.8cqw); }
  .lista small { font-size: max(var(--mt-piso, 0cqw), 1.9cqw); }
}
/* A coluna estreita: o dia e o nome. O kicker sai — o título já diz — e o setor também: seis pessoas
   de duas linhas, com a letra do balcão, subiam no título. */
@container (max-width: 700px) {
  .cabeca { top: 6cqh; }
  .kicker, .lista small { display: none; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(8.6cqw * var(--mt-escala-titulo, 1))); margin-top: 0; }
  .lista { bottom: 5cqh; }
  .lista li { grid-template-columns: 14cqw 1fr; padding: 1.6cqw 0; }
  .dia { font-size: max(var(--mt-piso, 0cqw), 8cqw); }
  .lista b { font-size: max(var(--mt-piso, 0cqw), 5cqw); line-height: 1.1; }
}
/*
 * A principal do Corporativo com a margem contra o corte (de 1321×739 a
 * 1236×674): com a letra do balcão o título descia por cima da primeira
 * linha da lista. O kicker aperta o espaçado (uma linha), o título vai numa
 * linha só e a lista e o cabeçalho chegam mais perto das bordas.
 */
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 775px) {
  .cabeca { top: 5cqh; }
  .kicker { letter-spacing: .04em; }
  h1 { margin-top: 1.2cqw; }
  h1 span, h1 em { display: inline; }
  .lista { bottom: 5cqh; }
  .lista li { padding: .6cqw 0; }
  .lista b, .lista small { line-height: 1.12; }
}
/*
 * A lateral no tamanho da TV (504×782 sem margem, 452×674 com a margem
 * contra o corte de 5%): o título não cabia na largura (fonte larga) e a
 * lista subia nele. O título quebra onde couber ("Aniversariantes / de
 * outubro"), o cabeçalho e a lista usam a largura até a margem e chegam
 * mais perto do alto e do pé; as linhas apertam.
 */
@container (max-width: 700px) and (max-height: 800px) {
  .cabeca { left: 4cqw; right: 4cqw; top: 4.6cqh; }
  h1 { line-height: .98; }
  h1 span, h1 em { display: inline; white-space: normal; }
  .lista { left: 4cqw; right: 4cqw; bottom: 3.4cqh; }
  .lista li { grid-template-columns: 12cqw 1fr; padding: .6cqw 0; }
  .lista b { line-height: 1.02; }
}
/*
 * A lateral sem mensagem no rodapé (504×913): a coluna fica mais alta, mas
 * não mais larga, e o "Aniversariantes de" da fonte larga passava da borda.
 * O título quebra onde couber.
 */
@container (max-width: 700px) and (min-height: 860px) and (max-height: 940px) {
  h1 span, h1 em { display: inline; white-space: normal; }
}
</style>
<section class="mt-peca gente-mes">
  <div class="cabeca">
    <p class="kicker" data-entrada="esquerda"><i aria-hidden="true"></i><span data-campo="kicker">Parabéns a quem faz aniversário</span></p>
    <h1 data-entrada="subir" data-ordem="1"><span data-campo="titulo">Aniversariantes</span> <em data-campo="mes">do mês</em></h1>
  </div>
  <ul class="lista">
    <li data-entrada="subir" data-ordem="2"><span class="dia" data-campo="dia1">03</span><b><span data-campo="nome1">Carlos Lima</span><small data-campo="setor1">Expedição</small></b></li>
    <li data-entrada="subir" data-ordem="3"><span class="dia" data-campo="dia2">09</span><b><span data-campo="nome2">Ana Ribeiro</span><small data-campo="setor2">Financeiro</small></b></li>
    <li data-entrada="subir" data-ordem="4"><span class="dia" data-campo="dia3">14</span><b><span data-campo="nome3">João Pedro Alves</span><small data-campo="setor3">Frota</small></b></li>
    <li data-entrada="subir" data-ordem="3"><span class="dia" data-campo="dia4">20</span><b><span data-campo="nome4">Marina Souza</span><small data-campo="setor4">Logística</small></b></li>
    <li data-entrada="subir" data-ordem="4"><span class="dia" data-campo="dia5">26</span><b><span data-campo="nome5">Rafael Torres</span><small data-campo="setor5">Compras</small></b></li>
    <li data-entrada="subir" data-ordem="5"><span class="dia" data-campo="dia6">31</span><b><span data-campo="nome6">Beatriz Nunes</span><small data-campo="setor6">Atendimento</small></b></li>
  </ul>
</section>
