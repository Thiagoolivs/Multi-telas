<!--
  Quadro do cardápio — família cardápio (lote 4, arquétipo A5).
  O menu board de restaurante: a foto do prato da vez numa coluna de corte
  seco e, na outra, o título e cinco linhas de nome e preço ligadas por um
  pontilhado fino (a guia). O preço fica na letra do título, alinhado à
  direita. Cinco itens no máximo: com a letra da TV, mais que isso não se lê.
-->
<style>
.mt-peca { --f: 2.6cqw; --t: 5.4cqw; --p: 3.2cqw; color: var(--mt-texto); font-family: var(--mt-fonte-texto); background: var(--mt-fundo); display: grid; grid-template-columns: 38fr 62fr; }
.foto { width: 100%; height: 100%; min-height: 0; object-fit: cover; object-position: 50% 50%; }
.texto { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 6cqh 6cqw 6cqh 5cqw; }
.kicker { font: 600 max(var(--mt-piso, 0cqw), var(--f))/1.1 var(--mt-fonte-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--mt-destaque); }
h1 { margin-top: 1.6cqh; font: 500 max(var(--mt-piso, 0cqw), calc(var(--t) * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); letter-spacing: -.01em; }
.itens { margin-top: 3.4cqh; list-style: none; padding: 0; }
.itens li { display: flex; align-items: baseline; gap: 1.2cqw; padding: 1.2cqh 0; }
.itens li + li { border-top: .12cqw solid var(--mt-linha); }
.itens span { flex: 0 1 auto; min-width: 0; font: 500 max(var(--mt-piso, 0cqw), var(--f))/1.2 var(--mt-fonte-texto); }
.itens i { flex: 1 1 2cqw; min-width: 2cqw; align-self: center; height: 0; border-bottom: .16cqw dotted var(--mt-linha); }
.itens b { flex: none; font: 500 max(var(--mt-piso, 0cqw), calc(var(--p) * var(--mt-escala-titulo, 1)))/1 var(--mt-fonte-titulo); color: var(--mt-preco); white-space: nowrap; }
.nota { margin-top: 3cqh; font: 400 max(var(--mt-piso, 0cqw), var(--f))/1.25 var(--mt-fonte-texto); color: var(--mt-texto-suave); }

@container (aspect-ratio >= 1.25) and (max-height: 900px) {
  .mt-peca { --f: 3.5cqw; --t: 5cqw; --p: 3.8cqw; grid-template-columns: 38fr 62fr; }
  .texto { padding: 4cqh 5cqw 4cqh 4cqw; }
  .kicker, .nota { display: none; }
  h1 { margin-top: 0; }
  .itens { margin-top: 2cqh; }
  .itens li { padding: .9cqh 0; }
}
@container (aspect-ratio < 1.25) {
  .mt-peca { --f: 4.6cqw; --t: 9cqw; --p: 5.6cqw; grid-template-columns: 1fr; grid-template-rows: 34fr 66fr; }
  .texto { justify-content: flex-start; padding: 5cqh 7cqw 6cqh; }
  .itens { margin-top: 4cqh; }
  .itens li { gap: 2cqw; padding: 1.8cqh 0; }
  .itens li + li, .itens i { border-width: .24cqw; }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { --t: 7cqw; --p: 5cqw; grid-template-rows: 31fr 69fr; }
  .texto { justify-content: center; padding: 4cqh 7cqw 5cqh; }
  .kicker, .nota { display: none; }
  h1 { margin-top: 0; }
  .itens { margin-top: 2.4cqh; }
  .itens li { padding: 1.2cqh 0; }
}
</style>
<section class="mt-peca cardapio-quadro">
  <img class="foto" data-campo-img="foto" alt="" data-entrada="aparecer">
  <div class="texto">
    <p class="kicker" data-campo="kicker" data-entrada="aparecer" data-ordem="1">Feitas aqui, todo dia</p>
    <h1 data-campo="titulo" data-entrada="subir" data-ordem="2">Massas da casa</h1>
    <ul class="itens" data-entrada="subir" data-ordem="3">
      <li><span data-campo="item1">Tagliatelle ao ragu</span><i aria-hidden="true"></i><b data-campo="preco1">58</b></li>
      <li><span data-campo="item2">Nhoque de batata</span><i aria-hidden="true"></i><b data-campo="preco2">49</b></li>
      <li><span data-campo="item3">Lasanha da nonna</span><i aria-hidden="true"></i><b data-campo="preco3">62</b></li>
      <li><span data-campo="item4">Ravioli de abóbora</span><i aria-hidden="true"></i><b data-campo="preco4">56</b></li>
      <li><span data-campo="item5">Espaguete ao pomodoro</span><i aria-hidden="true"></i><b data-campo="preco5">44</b></li>
    </ul>
    <p class="nota" data-campo="nota" data-entrada="aparecer" data-ordem="4">Preços em reais · meia porção sob pedido</p>
  </div>
</section>
