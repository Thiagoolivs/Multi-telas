<!--
  EPI obrigatório — família serviço. Destaque e lateral.
  A placa de obrigação (NBR 7195: círculo cheio com o pictograma em
  branco), na cor da marca. Os quatro pictogramas — capacete, óculos,
  protetor auricular e luva — são desenho em CSS, medidos em em dentro do
  círculo: o mesmo desenho em qualquer tamanho. Rótulo em branco tira o
  equipamento da placa.
-->
<style>
.mt-peca { overflow-wrap: break-word; display: grid; grid-template-columns: 1fr 1fr; align-items: center; column-gap: 6cqw; padding: 8cqmin 7cqw;
  color: var(--mt-texto); font-family: var(--mt-fonte-texto);
  background: radial-gradient(100% 100% at 0% 100%, var(--mt-fundo-2), var(--mt-fundo) 60%); }
.kicker { display: flex; align-items: center; gap: 2cqmin; font: 700 max(var(--mt-piso, 0cqw), 3.6cqmin)/1.15 var(--mt-fonte-texto); letter-spacing: .12em; text-transform: uppercase; color: var(--mt-preco); }
/* O fio do kicker fica na altura da primeira linha, mesmo quando o kicker quebra. */
.kicker { align-items: flex-start; }
.kicker i { display: block; flex: none; align-self: flex-start; width: 6cqmin; height: .9cqmin; margin-top: .52em; border-radius: 1cqmin; background: var(--mt-destaque); }
h1 { margin-top: 3cqmin; font: 700 max(var(--mt-piso, 0cqw), calc(14cqmin * var(--mt-escala-titulo, 1)))/.98 var(--mt-fonte-titulo); letter-spacing: -.01em; text-transform: uppercase; }
h1 span { display: block; }
h1 span + span { color: var(--mt-destaque); }
.apoio { margin-top: 5cqmin; font: 500 max(var(--mt-piso, 0cqw), 4.8cqmin)/1.35 var(--mt-fonte-texto); color: var(--mt-texto-suave); max-width: 20em; }
.epi { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 5cqmin 4cqmin; }
.epi li { display: flex; flex-direction: column; align-items: center; gap: 2.4cqmin; text-align: center; }
.epi li:has(.rotulo:empty) { display: none; }
.rotulo { font: 700 max(var(--mt-piso, 0cqw), 4.6cqmin)/1.15 var(--mt-fonte-texto); text-wrap: balance; }
/* O círculo da placa: 10em de lado; tudo dentro dele é medido em em. */
.ico { position: relative; flex: none; width: 10em; height: 10em; border-radius: 50%; font-size: 2.3cqmin; background: var(--mt-destaque); }
.ico::before, .ico::after, .ico i { content: ''; position: absolute; display: block; background: var(--mt-sobre-destaque); }
.capacete::before { left: 2.3em; top: 2.5em; width: 5.4em; height: 3.7em; border-radius: 2.7em 2.7em .3em .3em; }
.capacete::after { left: 1.4em; top: 6em; width: 7.2em; height: .9em; border-radius: .45em; }
.capacete i { left: 4.6em; top: 2.9em; width: .8em; height: 3.1em; border-radius: .4em; background: var(--mt-destaque); }
.oculos::before { left: 1em; top: 4.4em; width: 8em; height: .7em; border-radius: .35em; }
.oculos::after { left: 2em; top: 3.3em; width: 6em; height: 3.1em; border-radius: 1.6em 1.6em 1.3em 1.3em; }
.oculos i { left: 4.3em; top: 5.2em; width: 1.4em; height: 1.4em; border-radius: .7em .7em 0 0; background: var(--mt-destaque); }
.protetor::before { left: 2.2em; top: 1.8em; width: 5.6em; height: 5.6em; border-radius: 50%; background: transparent;
  border: .8em solid transparent; border-top-color: var(--mt-sobre-destaque); border-left-color: var(--mt-sobre-destaque); transform: rotate(45deg); }
.protetor::after { left: 1.6em; top: 4.4em; width: 2.2em; height: 3.6em; border-radius: 1.1em; box-shadow: 4.6em 0 0 0 var(--mt-sobre-destaque); }
.luva::before { left: 3.3em; top: 4.3em; width: 4em; height: 3.9em; border-radius: .7em .7em 1.6em 1.6em; }
.luva::after { left: 6.4em; top: 2.6em; width: .86em; height: 2.6em; border-radius: .43em; }
.luva i { left: 3.3em; top: 1.8em; width: .86em; height: 3.2em; border-radius: .43em; box-shadow: 1.04em -.3em 0 0 var(--mt-sobre-destaque), 2.08em -.1em 0 0 var(--mt-sobre-destaque); }
.luva b { position: absolute; left: 1.7em; top: 4.6em; width: 2.6em; height: 1em; border-radius: .5em; background: var(--mt-sobre-destaque); transform: rotate(-38deg); }
@container (aspect-ratio >= 1.25) and (min-height: 600px) and (max-height: 860px) {
  .mt-peca { grid-template-columns: 44fr 56fr; column-gap: 5cqw; padding: 7cqmin 6cqw; }
  .kicker { display: none; }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(12cqmin * var(--mt-escala-titulo, 1))); }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 4.4cqmin); }
  .ico { font-size: 2cqmin; }
  .rotulo { font-size: max(var(--mt-piso, 0cqw), 4.2cqmin); }
}
/* Em pé: o aviso em cima, a placa embaixo. */
@container (aspect-ratio < 1.25) {
  .mt-peca { grid-template-columns: 1fr; align-content: center; row-gap: 8cqmin; padding: 8cqmin 8cqw; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(15cqw * var(--mt-escala-titulo, 1))); }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 4.8cqw); }
  .ico { font-size: 2.4cqw; }
  .rotulo { font-size: max(var(--mt-piso, 0cqw), 4.8cqw); }
}
@container (aspect-ratio < 0.8) and (min-width: 701px) {
  .mt-peca { row-gap: 12cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 4.4cqw); }
  h1 { margin-top: 3.4cqw; font-size: max(var(--mt-piso, 0cqw), calc(15.4cqw * var(--mt-escala-titulo, 1))); }
  .apoio { font-size: max(var(--mt-piso, 0cqw), 5.6cqw); }
  .epi { gap: 9cqw 5cqw; }
  .ico { font-size: 3.2cqw; }
  .rotulo { font-size: max(var(--mt-piso, 0cqw), 5.6cqw); }
}
@container (aspect-ratio >= 0.8) and (aspect-ratio < 1.25) {
  .mt-peca { row-gap: 5cqmin; padding: 7cqmin 7cqw; }
  .kicker { display: none; }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(11cqmin * var(--mt-escala-titulo, 1))); }
  h1 span { display: inline; }
  .apoio { margin-top: 2.6cqmin; font-size: max(var(--mt-piso, 0cqw), 4.2cqmin); }
  .epi { grid-template-columns: 1fr 1fr; gap: 3.4cqmin 4cqmin; }
  .epi li { flex-direction: row; text-align: left; gap: 3cqmin; }
  .ico { font-size: 1.7cqmin; }
  .rotulo { font-size: max(var(--mt-piso, 0cqw), 4.4cqmin); }
}
/* A lateral: o título e a placa; o apoio sai. */
@container (max-width: 700px) {
  /* Com a letra do balcão o rótulo de duas linhas passava do pé: o círculo um pouco menor e o respiro mais justo. */
  .mt-peca { row-gap: 6cqmin; padding: 6cqmin 7cqw; }
  .kicker { font-size: max(var(--mt-piso, 0cqw), 6cqw); letter-spacing: .06em; line-height: 1.1; }
  .kicker i, .apoio { display: none; }
  h1 { font-size: max(var(--mt-piso, 0cqw), calc(15cqw * var(--mt-escala-titulo, 1))); }
  .epi { gap: 5cqw 4cqw; }
  .epi li { gap: 2cqmin; }
  .ico { font-size: 2.9cqw; }
  .rotulo { font-size: max(var(--mt-piso, 0cqw), 6.4cqw); line-height: 1.08; }
}
/* Deitada e baixa: o título em cima e a placa em duas linhas, o rótulo ao lado do círculo. */
@container (aspect-ratio >= 1.25) and (max-height: 640px) {
  .mt-peca { grid-template-columns: 1fr; align-content: center; row-gap: 4cqmin; padding: 6cqmin 6cqw; }
  .kicker, .apoio { display: none; }
  h1 { margin-top: 0; font-size: max(var(--mt-piso, 0cqw), calc(13cqmin * var(--mt-escala-titulo, 1))); }
  h1 span { display: inline; }
  .epi { gap: 3cqmin 5cqw; }
  .epi li { flex-direction: row; text-align: left; gap: 3cqmin; }
  .ico { font-size: 2.2cqmin; }
}
</style>
<section class="mt-peca servico-epi">
  <div class="texto">
    <p class="kicker" data-entrada="esquerda"><i aria-hidden="true"></i><span data-campo="kicker">Área de produção</span></p>
    <h1 data-entrada="subir" data-ordem="1"><span data-campo="titulo">EPI</span> <span data-campo="titulo2">obrigatório</span></h1>
    <p class="apoio" data-campo="apoio" data-entrada="aparecer" data-ordem="2">Sem o equipamento completo, não entre na área.</p>
  </div>
  <ul class="epi">
    <li data-entrada="crescer" data-ordem="2"><span class="ico capacete" aria-hidden="true"><i></i></span><span class="rotulo" data-campo="epi1">Capacete</span></li>
    <li data-entrada="crescer" data-ordem="3"><span class="ico oculos" aria-hidden="true"><i></i></span><span class="rotulo" data-campo="epi2">Óculos</span></li>
    <li data-entrada="crescer" data-ordem="4"><span class="ico protetor" aria-hidden="true"></span><span class="rotulo" data-campo="epi3">Protetor auricular</span></li>
    <li data-entrada="crescer" data-ordem="5"><span class="ico luva" aria-hidden="true"><i></i><b></b></span><span class="rotulo" data-campo="epi4">Luva</span></li>
  </ul>
</section>
