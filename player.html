<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MultiTelas · Player</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230E0B1F'/%3E%3Crect x='5' y='5' width='8.5' height='8.5' rx='1.2' fill='%23fff'/%3E%3Crect x='15' y='5' width='4' height='8.5' rx='1.2' fill='%23C6F432'/%3E%3Crect x='5' y='15' width='14' height='4' rx='1.2' fill='%2386858F'/%3E%3C/svg%3E" />
  <!--
    Instalável na TV box.

    `start_url` já leva `?cloud=1` e `display` é `fullscreen`: instalada, a
    tela abre direto no player, em tela cheia, sem barra de endereço e sem
    ninguém digitar a URL com o controle remoto — que era o passo em que a
    instalação numa recepção emperrava.
  -->
  <link rel="manifest" href="/player.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#05070f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="css/player.css" />
  <link rel="stylesheet" href="css/animacao.css" />
  <!-- Antes do player, em ES5: completa o que falta em navegador um pouco
       antigo e, se o pacote do player não compilar (navegador antigo demais),
       mostra um aviso claro em vez de "Iniciando exibição" para sempre
       (QA de lançamento, 03/11). Fora do pacote de propósito: erro de sintaxe
       lá dentro não pode levar o aviso junto. -->
  <script src="js/compat.js"></script>
  <!-- Antes de qualquer pintura: decide se esta tela aguenta o vidro. Numa TV,
       pintar uma vez no modo caro já custa os primeiros segundos. -->
  <script src="js/perf.js"></script>
</head>
<body>
  <div id="overlay" class="mt-overlay">
    <div class="mt-overlay-box">
      <div class="mt-logo"></div>
      <div class="mt-overlay-hint">Iniciando exibição</div>
      <div class="mt-overlay-bar"></div>
    </div>
  </div>

  <main id="stage" class="mt-stage"></main>

  <!-- Pareamento (modo nuvem): mostra o código para conectar pelo celular -->
  <div id="pairing" class="mt-pairing hidden">
    <div class="mt-pairing-box">
      <!-- A marca do produto (docs/MARCA.md): era azul de tema e letra do sistema, sem logo (QA de lançamento, 03/11). -->
      <div class="mt-marca" aria-label="MultiTelas"><span class="mt-marca-simbolo"><svg viewBox="0 0 136 136" width="100%" height="100%" aria-hidden="true"><rect width="88" height="88" rx="12" fill="#fff"/><rect x="96" width="40" height="88" rx="12" fill="#C6F432"/><rect y="96" width="136" height="40" rx="12" fill="#86858F"/></svg></span><span class="mt-marca-nome">MultiTelas</span></div>
      <div class="mt-pairing-title">Conecte esta TV pelo celular</div>
      <div class="mt-pairing-code">••••••</div>
      <div class="mt-pairing-hint">Aponte a câmera do celular para o QR, ou no painel do MultiTelas abra <strong>Telas</strong> &rsaquo; <strong>Parear tela</strong> e digite este código.</div>
      <button id="pairing-reset" class="mt-pairing-reset" type="button">Gerar outro código (tela nova)</button>
    </div>
  </div>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/cor.js"></script>
  <script src="js/fontes.js"></script>
  <script src="js/peca.js"></script>
  <script src="js/animacao.js"></script>
  <script src="js/tokens.js"></script>
  <script src="js/peca-html.js"></script>
  <script src="js/peca-render.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/datas-br.js"></script>
  <script src="js/seasons.js"></script>
  <script src="js/adaptive.js"></script>
  <script src="js/expediente.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/news.js"></script>
  <script src="js/graficos.js"></script>
  <script src="js/precos.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/render.js"></script>
  <script src="js/exibicoes.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/rodizio.js"></script>
  <script src="js/player.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
