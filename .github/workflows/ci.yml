# Roda os testes e o build do painel em cada push.
#
# Sem isto, os 252 testes só rodavam quando alguém lembrava — e um erro ia
# direto para a parede do cliente. O build do painel entra junto porque um
# erro de import passa em todos os testes e só aparece na hora de servir.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch: o que importa é o
# último commit, e ficar esperando fila de commits velhos só atrasa o retorno.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # O servidor só depende de `pg`, e o painel tem o seu próprio
      # package-lock — por isso são duas instalações.
      - name: Dependências do servidor
        run: npm install --no-audit --no-fund

      # Antes dos testes: desde o item 25 eles importam módulos do painel
      # (web/src/lib/rodar.js puxa lucide-react). Sem isto, o CI falhava desde o #173.
      - name: Dependências do painel
        run: npm --prefix web ci --no-audit --no-fund

      - name: Testes
        run: npm test

      # O eval roda em modo dev: sem chave, sem rede, custo zero. Ele não
      # testa o PROMPT — testa tudo o que vem depois dele, que é onde os
      # defeitos desta semana moraram: o corte pelo teto, o formato pedido, o
      # "sem foto", o layout e o custo prometido.
      #
      # Bloqueia porque estas conferências são determinísticas. A parte que
      # não bloqueia é a folha de contato com Gemini, que roda à mão.
      - name: Eval (modo dev)
        run: npm run eval

      # Nome solto no servidor. As rotas extraídas de server.js recebem tudo
      # por `ctx`, e um nome esquecido não quebra boot nem teste: explode na
      # primeira requisição, como "erro interno". Já custou o login com
      # Google, o convite de equipe e a troca de senha no SQLite.
      - name: Nomes indefinidos no servidor (no-undef)
        run: npm run lint:nomes


      - name: Build do painel
        run: npm --prefix web run build

  # A régua da TV (fase 2): o robô sobe o servidor, pareia três TVs de
  # verdade (deitada, em pé e quadrada) e mede a letra que cada tipo de
  # conteúdo desenha em tela cheia. Letra abaixo de 4,5% do lado menor da TV
  # — o que se lê a 4 m — reprova. Job à parte: o navegador leva um minuto
  # para instalar e não atrasa o retorno dos testes.
  regua-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependências do servidor
        run: npm install --no-audit --no-fund

      # O painel não entra: a TV é servida do player.html e de js/.
      - name: Navegador (Playwright com Chromium)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Régua da TV
        run: npm run regua
        env:
          REGUA_SAIDA: regua-fotos

      # As fotos ficam no resumo da execução: dá para ver o que reprovou.
      - name: Fotos da régua
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regua-tv
          path: regua-fotos
          if-no-files-found: ignore
          retention-days: 7
