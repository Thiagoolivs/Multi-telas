<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      A cor da barra do sistema segue o TEMA ESCOLHIDO, e não uma constante.
      Aqui fica o claro, que é o padrão de quem abre pela primeira vez; quando
      a pessoa troca para escuro, o próprio app reescreve esta etiqueta. Fixa
      em escuro, o app instalado abria branco com a barra preta em cima.
    -->
    <meta name="theme-color" content="#F7F8FA" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icone.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iOS não lê o manifesto: sem estas duas, "Adicionar à Tela de Início"
         abre o painel dentro do Safari, com barra de endereço e tudo. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MultiTelas" />
    <title>MultiTelas — Painel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
